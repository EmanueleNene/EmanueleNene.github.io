<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>FerroDaStiro</title>
<meta name="description" content="Private workout log. Data stays on your phone.">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#DEDDD8">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="FerroDaStiro">
<meta name="apple-mobile-web-app-status-bar-style" content="default">

<style>
  :root{
    --concrete:#DEDDD8; --paper:#EFEEEA; --ink:#191B1C;
    --steel:#6E7276; --rust:#A33B28; --slate:#33505C; --line:#C3C2BC; --r:3px;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;padding:0;overscroll-behavior-y:contain}
  body{background:var(--concrete);color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"Helvetica Neue",Arial,sans-serif;
    font-size:16px;line-height:1.45;padding:0 0 92px;-webkit-font-smoothing:antialiased}
  .wrap{max-width:620px;margin:0 auto;padding:0 18px}
  header{padding:calc(env(safe-area-inset-top) + 22px) 0 14px;
    display:flex;align-items:baseline;justify-content:space-between;gap:12px}
  .mark{font-weight:800;font-size:23px;letter-spacing:-.035em}
  .mark span{color:var(--rust)}
  .who{background:transparent;border:1px solid var(--line);color:var(--steel);
    padding:5px 11px;font-size:13px;font-weight:600;border-radius:99px}
  h2{font-size:19px;letter-spacing:-.02em;margin:26px 0 10px;font-weight:700}
  h3{font-size:15px;margin:0;font-weight:700;letter-spacing:-.01em}
  p.note{color:var(--steel);font-size:14px;margin:6px 0 0}
  .card{background:var(--paper);border:1px solid var(--line);border-radius:var(--r);
    padding:14px;margin-bottom:10px}
  .row{display:flex;align-items:center;gap:10px}
  .grow{flex:1;min-width:0}
  button{font:inherit;cursor:pointer;border-radius:var(--r);border:1px solid var(--ink);
    background:var(--ink);color:var(--paper);padding:10px 15px;font-weight:600}
  button.ghost{background:transparent;color:var(--ink);border-color:var(--line)}
  button.quiet{background:transparent;border-color:transparent;color:var(--steel);padding:6px 8px}
  button.rust{background:var(--rust);border-color:var(--rust)}
  button.danger{background:transparent;color:var(--rust);border-color:var(--rust)}
  button:active{transform:translateY(1px)}
  :focus-visible{outline:2px solid var(--slate);outline-offset:2px}
  input,select{font:inherit;background:var(--paper);color:var(--ink);
    border:1px solid var(--line);border-radius:var(--r);padding:9px 10px;width:100%}
  input[type=number]{font-variant-numeric:tabular-nums}
  .prog{display:flex;justify-content:space-between;align-items:center;gap:12px;
    padding:13px 14px;border:1px solid var(--line);background:var(--paper);
    border-radius:var(--r);margin-bottom:8px;text-align:left;width:100%;color:var(--ink);font-weight:400}
  .prog[aria-pressed=true]{border-color:var(--ink);border-width:2px;padding:12px 13px}
  .prog small{display:block;color:var(--steel);font-size:13px;margin-top:2px}
  .exhead{display:flex;justify-content:space-between;align-items:baseline;gap:8px;margin-bottom:9px}
  .exhead em{font-style:normal;color:var(--steel);font-size:13px;white-space:nowrap}
  .setrow{display:grid;grid-template-columns:26px 1fr 1fr 42px;gap:7px;align-items:center;
    margin:0 -8px 6px;padding:2px 8px;border-radius:2px}
  .setrow.now{box-shadow:inset 3px 0 0 var(--rust)}
  .setrow.ok input{opacity:.5}
  .setno{font-variant-numeric:tabular-nums;color:var(--steel);font-size:13px;text-align:center}
  .setrow.now .setno{color:var(--rust);font-weight:800}
  .setrow input{padding:8px;text-align:center}
  .controls{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
  .step{display:flex;align-items:center;border:1px solid var(--line);border-radius:var(--r)}
  .step button{background:transparent;border:none;color:var(--ink);
    padding:4px 11px;font-size:17px;font-weight:700;line-height:1.2;border-radius:0}
  .step button:disabled{color:var(--line)}
  .step span{font-size:13px;color:var(--steel);padding:0 4px;min-width:58px;
    text-align:center;font-variant-numeric:tabular-nums}
  .tick{border:1px solid var(--line);background:var(--paper);color:var(--steel);
    padding:8px 0;font-weight:700;border-radius:var(--r);width:100%}
  .tick[aria-pressed=true]{background:var(--slate);border-color:var(--slate);color:var(--paper)}
  .done{opacity:.55}
  .units{display:grid;grid-template-columns:26px 1fr 1fr 42px;gap:7px;font-size:11px;
    color:var(--steel);letter-spacing:.04em;margin-bottom:4px}
  .units div{text-align:center}
  .timerbar{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--ink);color:var(--paper);
    padding:12px 18px calc(env(safe-area-inset-bottom) + 12px);display:none;align-items:center;gap:14px}
  .timerbar.on{display:flex}
  .clock{font-size:30px;font-weight:800;font-variant-numeric:tabular-nums;letter-spacing:-.03em;min-width:88px}
  .timerbar button{background:transparent;border-color:var(--steel);color:var(--paper);padding:8px 12px}
  .timerbar .lbl{font-size:13px;color:var(--steel);flex:1}
  nav{position:fixed;left:0;right:0;bottom:0;z-index:10;background:var(--paper);
    border-top:1px solid var(--line);display:flex;padding-bottom:env(safe-area-inset-bottom)}
  nav button{flex:1;background:transparent;border:none;color:var(--steel);
    padding:13px 4px;font-size:13px;font-weight:600;border-radius:0}
  nav button[aria-current=true]{color:var(--ink);box-shadow:inset 0 -3px 0 var(--rust)}
  .empty{border:1px dashed var(--line);border-radius:var(--r);padding:22px 16px;
    color:var(--steel);font-size:14px;text-align:center}
  .stat{display:flex;gap:22px;margin:2px 0 14px}
  .stat b{display:block;font-size:26px;font-weight:800;letter-spacing:-.03em;font-variant-numeric:tabular-nums}
  .stat span{font-size:12px;color:var(--steel)}
  .histline{display:flex;justify-content:space-between;gap:10px;padding:11px 0;border-bottom:1px solid var(--line)}
  .histline:last-child{border-bottom:none}
  .histline small{color:var(--steel);font-size:13px}
  svg .grid{stroke:var(--line);stroke-width:1}
  svg .plot{fill:none;stroke:var(--rust);stroke-width:2.5;stroke-linejoin:round;stroke-linecap:round}
  svg .dot{fill:var(--rust)}
  svg text{fill:var(--steel);font-size:11px;font-family:inherit}
  #err{display:none;position:fixed;top:0;left:0;right:0;z-index:50;background:var(--rust);
    color:var(--paper);font-size:13px;line-height:1.4;padding:calc(env(safe-area-inset-top) + 10px) 16px 10px}
  dialog{border:1px solid var(--ink);border-radius:var(--r);background:var(--paper);
    color:var(--ink);padding:18px;width:min(94vw,420px)}
  dialog::backdrop{background:rgba(222,221,216,.85)}

  /* calendar */
  .monthbar{display:flex;align-items:center;justify-content:space-between;gap:8px;margin:4px 0 12px}
  .monthbar b{font-size:17px;letter-spacing:-.02em}
  .monthbar button{background:transparent;border:1px solid var(--line);color:var(--ink);padding:6px 13px}
  .cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
  .dow{font-size:11px;color:var(--steel);text-align:center;padding-bottom:2px}
  .cell{aspect-ratio:1/1;border:1px solid transparent;border-radius:var(--r);background:transparent;
    color:var(--ink);font-size:13px;font-weight:600;padding:0;display:flex;flex-direction:column;
    align-items:center;justify-content:center;gap:1px;font-variant-numeric:tabular-nums;overflow:hidden}
  .cell.blank{visibility:hidden}
  .cell.has{background:var(--rust);border-color:var(--rust);color:var(--paper)}
  .cell.today{border-color:var(--ink);border-width:2px}
  .cell.sel{outline:2px solid var(--slate);outline-offset:1px}
  .cell small{font-size:8.5px;font-weight:700;line-height:1.1;max-width:96%;
    overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

  /* exercise library + editor */
  .chips{display:flex;gap:6px;overflow-x:auto;padding:2px 0 8px;-webkit-overflow-scrolling:touch}
  .chip{white-space:nowrap;border:1px solid var(--line);background:transparent;color:var(--steel);
    padding:6px 12px;border-radius:99px;font-size:13px;font-weight:600}
  .chip[aria-pressed=true]{background:var(--ink);border-color:var(--ink);color:var(--paper)}
  .lib{max-height:48vh;overflow-y:auto;margin:2px -2px 10px;padding:0 2px}
  .libitem{display:flex;justify-content:space-between;align-items:center;gap:10px;
    padding:10px 2px;border-bottom:1px solid var(--line);width:100%;
    background:transparent;border-left:none;border-right:none;border-top:none;
    color:var(--ink);text-align:left;font-weight:400;border-radius:0}
  .libitem[aria-pressed=true]{color:var(--slate);font-weight:700}
  .libitem small{color:var(--steel);font-size:12px;display:block;font-weight:400}
  .exline{display:flex;align-items:center;gap:7px;padding:9px 0;border-bottom:1px solid var(--line)}
  .exline:last-of-type{border-bottom:none}
  .exline .nm{flex:1;min-width:0;font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .exline input{width:46px;padding:6px 4px;text-align:center;font-size:13px}
  .exline .x{font-size:12px;color:var(--steel)}
  .mini{background:transparent;border:1px solid var(--line);color:var(--steel);
    padding:5px 9px;font-size:13px;font-weight:700;border-radius:var(--r)}
  .mg-bar-bg{background:var(--concrete);height:7px;border-radius:3px;overflow:hidden;margin-top:4px}
  .mg-bar-fill{background:var(--rust);height:100%;border-radius:3px}
  .ex-thumb{width:36px;height:36px;object-fit:contain;border-radius:2px;background:var(--paper);flex-shrink:0}
  .ex-diagram{margin:8px 0;padding:8px;background:var(--paper);border:1px solid var(--line);border-radius:var(--r);text-align:center}
  .ex-diagram img{max-width:100%;height:auto;border-radius:2px;display:block;margin:0 auto}
  .diag-toggle{font-size:14px;cursor:pointer}
  @media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>

<script>
/* ============================================================
   STORAGE MODEL
   fds.profiles      -> [{id, name}]
   fds.active        -> profile id
   fds.data.<id>     -> that person's whole log
   Everything is localStorage: it never leaves this device.
   ============================================================ */
const PKEY='fds.profiles', AKEY='fds.active', dkey=id=>'fds.data.'+id;

/* One-time carry-over from the old "ironlog.*" keys, for anyone
   who installed before the rename. Runs once, then never again. */
(function migrate(){
  try{
    if(localStorage.getItem(PKEY) || !localStorage.getItem('ironlog.profiles')) return;
    localStorage.setItem(PKEY, localStorage.getItem('ironlog.profiles'));
    const a=localStorage.getItem('ironlog.active'); if(a) localStorage.setItem(AKEY,a);
    JSON.parse(localStorage.getItem('ironlog.profiles')).forEach(p=>{
      const d=localStorage.getItem('ironlog.data.'+p.id);
      if(d) localStorage.setItem('fds.data.'+p.id, d);
    });
  }catch(e){ /* nothing to carry over */ }
})();
const readJSON=(k,f)=>{try{const v=localStorage.getItem(k);return v?JSON.parse(v):f}catch(e){return f}};
const writeJSON=(k,v)=>{try{localStorage.setItem(k,JSON.stringify(v))}catch(e){alert('Storage is full or blocked. Data was not saved.')}};

const BLANK = () => ({unit:'kg', programId:'ul', custom:{}, customEx:[], sessions:[], draft:null});

const BUILTIN = {
  ul:{name:'Upper / Lower', note:'4 days · balanced strength', days:[
    {name:'Upper A', ex:[['Bench press',4,5],['Barbell row',4,6],['Overhead press',3,8],['Lat pulldown',3,10],['Triceps pushdown',3,12]]},
    {name:'Lower A', ex:[['Back squat',4,5],['Romanian deadlift',3,8],['Leg press',3,10],['Standing calf raise',4,12]]},
    {name:'Upper B', ex:[['Incline dumbbell press',4,8],['Pull-up',4,6],['Cable row',3,10],['Lateral raise',3,15],['Barbell curl',3,10]]},
    {name:'Lower B', ex:[['Deadlift',3,4],['Front squat',3,6],['Walking lunge',3,10],['Leg curl',3,12]]}]},
  ppl:{name:'Push / Pull / Legs', note:'6 days · higher volume', days:[
    {name:'Push', ex:[['Bench press',4,6],['Overhead press',3,8],['Incline dumbbell press',3,10],['Lateral raise',3,15],['Triceps pushdown',3,12]]},
    {name:'Pull', ex:[['Deadlift',3,5],['Pull-up',4,8],['Barbell row',3,8],['Face pull',3,15],['Barbell curl',3,10]]},
    {name:'Legs', ex:[['Back squat',4,6],['Romanian deadlift',3,8],['Leg press',3,12],['Leg curl',3,12],['Standing calf raise',4,15]]}]},
  s5:{name:'Strong 5×5', note:'3 days · minimal, heavy', days:[
    {name:'Workout A', ex:[['Back squat',5,5],['Bench press',5,5],['Barbell row',5,5]]},
    {name:'Workout B', ex:[['Back squat',5,5],['Overhead press',5,5],['Deadlift',1,5]]}]},
  full:{name:'Full body', note:'3 days · one session covers everything', days:[
    {name:'Day 1', ex:[['Back squat',3,6],['Bench press',3,6],['Barbell row',3,8],['Plank',3,45]]},
    {name:'Day 2', ex:[['Deadlift',3,5],['Overhead press',3,8],['Lat pulldown',3,10],['Leg curl',3,12]]},
    {name:'Day 3', ex:[['Front squat',3,8],['Incline dumbbell press',3,10],['Cable row',3,10],['Lateral raise',3,15]]}]}
};

/* ---------- exercise library ----------
   n = name, g = muscle group, s/r = sensible default sets/reps,
   t = measured in seconds rather than reps                          */
const GROUPS = ['Chest','Back','Shoulders','Legs','Biceps','Triceps','Core','Conditioning'];
const EXERCISES = [
  {n:'Bench press',g:'Chest',s:4,r:6},{n:'Incline barbell press',g:'Chest',s:4,r:8},
  {n:'Incline dumbbell press',g:'Chest',s:3,r:10},{n:'Dumbbell bench press',g:'Chest',s:3,r:10},
  {n:'Dumbbell fly',g:'Chest',s:3,r:12},{n:'Cable crossover',g:'Chest',s:3,r:15},
  {n:'Machine chest press',g:'Chest',s:3,r:10},{n:'Push-up',g:'Chest',s:3,r:15},
  {n:'Dip',g:'Chest',s:3,r:8},

  {n:'Deadlift',g:'Back',s:3,r:5},{n:'Rack pull',g:'Back',s:3,r:6},
  {n:'Barbell row',g:'Back',s:4,r:8},{n:'Pendlay row',g:'Back',s:4,r:6},
  {n:'Dumbbell row',g:'Back',s:3,r:10},{n:'T-bar row',g:'Back',s:3,r:10},
  {n:'Cable row',g:'Back',s:3,r:12},{n:'Lat pulldown',g:'Back',s:3,r:10},
  {n:'Pull-up',g:'Back',s:4,r:6},{n:'Chin-up',g:'Back',s:4,r:8},
  {n:'Straight-arm pulldown',g:'Back',s:3,r:15},{n:'Shrug',g:'Back',s:3,r:12},

  {n:'Overhead press',g:'Shoulders',s:4,r:6},{n:'Seated dumbbell press',g:'Shoulders',s:3,r:10},
  {n:'Arnold press',g:'Shoulders',s:3,r:10},{n:'Lateral raise',g:'Shoulders',s:3,r:15},
  {n:'Cable lateral raise',g:'Shoulders',s:3,r:15},{n:'Rear delt fly',g:'Shoulders',s:3,r:15},
  {n:'Face pull',g:'Shoulders',s:3,r:15},{n:'Upright row',g:'Shoulders',s:3,r:12},

  {n:'Back squat',g:'Legs',s:4,r:6},{n:'Front squat',g:'Legs',s:3,r:6},
  {n:'Hack squat',g:'Legs',s:3,r:10},{n:'Leg press',g:'Legs',s:3,r:12},
  {n:'Romanian deadlift',g:'Legs',s:3,r:8},{n:'Stiff-leg deadlift',g:'Legs',s:3,r:8},
  {n:'Bulgarian split squat',g:'Legs',s:3,r:10},{n:'Walking lunge',g:'Legs',s:3,r:12},
  {n:'Step-up',g:'Legs',s:3,r:12},{n:'Leg extension',g:'Legs',s:3,r:15},
  {n:'Leg curl',g:'Legs',s:3,r:12},{n:'Hip thrust',g:'Legs',s:3,r:10},
  {n:'Glute bridge',g:'Legs',s:3,r:12},{n:'Good morning',g:'Legs',s:3,r:10},
  {n:'Standing calf raise',g:'Legs',s:4,r:15},{n:'Seated calf raise',g:'Legs',s:4,r:15},

  {n:'Barbell curl',g:'Biceps',s:3,r:10},{n:'EZ-bar curl',g:'Biceps',s:3,r:10},
  {n:'Dumbbell curl',g:'Biceps',s:3,r:12},{n:'Hammer curl',g:'Biceps',s:3,r:12},
  {n:'Incline dumbbell curl',g:'Biceps',s:3,r:12},{n:'Preacher curl',g:'Biceps',s:3,r:12},
  {n:'Cable curl',g:'Biceps',s:3,r:15},
  {n:'Triceps pushdown',g:'Triceps',s:3,r:12},{n:'Overhead triceps extension',g:'Triceps',s:3,r:12},
  {n:'Skull crusher',g:'Triceps',s:3,r:10},{n:'Close-grip bench press',g:'Triceps',s:3,r:8},
  {n:'Bench dip',g:'Triceps',s:3,r:12},

  {n:'Plank',g:'Core',s:3,r:45,t:1},{n:'Side plank',g:'Core',s:3,r:30,t:1},
  {n:'Hanging leg raise',g:'Core',s:3,r:12},{n:'Cable crunch',g:'Core',s:3,r:15},
  {n:'Ab wheel rollout',g:'Core',s:3,r:10},{n:'Russian twist',g:'Core',s:3,r:20},
  {n:'Dead bug',g:'Core',s:3,r:12},{n:'Back extension',g:'Core',s:3,r:15},

  {n:'Rowing machine',g:'Conditioning',s:1,r:600,t:1},{n:'Assault bike',g:'Conditioning',s:5,r:60,t:1},
  {n:'Treadmill run',g:'Conditioning',s:1,r:1200,t:1},{n:'Stationary bike',g:'Conditioning',s:1,r:900,t:1},
  {n:'Jump rope',g:'Conditioning',s:4,r:60,t:1},{n:'Kettlebell swing',g:'Conditioning',s:4,r:20},
  {n:"Farmer's walk",g:'Conditioning',s:3,r:40,t:1},{n:'Sled push',g:'Conditioning',s:5,r:30,t:1}
];
const exMeta = name => EXERCISES.find(e=>e.n===name) || (db.customEx||[]).find(e=>e.n===name) || null;
const isTimed = name => !!exMeta(name)?.t;
const allExercises = () => [...EXERCISES, ...(db.customEx||[])];
function exSlug(name) { return name.toLowerCase().replace(/['']/g, '').replace(/[^a-z0-9]+/g, '-').replace(/^-+|-+$/g, ''); }
function hesc(s) { return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;'); }
window.exSlug = exSlug;
window.exMeta = exMeta;
window.isTimed = isTimed;

const dayKey = d => { const x=new Date(d);
  return x.getFullYear()+'-'+String(x.getMonth()+1).padStart(2,'0')+'-'+String(x.getDate()).padStart(2,'0'); };

let profiles=[], me=null, db=BLANK(), tab='calendar';
let calMonth=(()=>{const d=new Date();d.setDate(1);d.setHours(0,0,0,0);return d;})();
let calSel=dayKey(new Date()), editing=null;
let progressTimeframe='weekly', progressMetric='weight', progressEx=null;

function getWeekStart(d){
  const dt=new Date(d); dt.setHours(0,0,0,0);
  const day=dt.getDay();
  const diff=dt.getDate()-day+(day===0?-6:1);
  return new Date(dt.setDate(diff));
}

function getWeeklyBuckets(sessions,numWeeks=8){
  let maxDate=new Date();
  for(const s of sessions){
    const d=new Date(s.date);
    if(!isNaN(d)&&d>maxDate) maxDate=d;
  }
  const endMon=getWeekStart(maxDate);
  const weeks=[];
  for(let i=numWeeks-1;i>=0;i--){
    const mon=new Date(endMon);
    mon.setDate(mon.getDate()-i*7);
    const sun=new Date(mon);
    sun.setDate(sun.getDate()+6);
    sun.setHours(23,59,59,999);
    weeks.push({
      start:mon, end:sun, key:mon.toISOString().slice(0,10),
      label:mon.toLocaleDateString(undefined,{month:'short',day:'numeric'}),
      weightVol:0, repsVol:0, workouts:0, sessions:[]
    });
  }
  for(const s of sessions){
    const sDate=new Date(s.date);
    if(isNaN(sDate)) continue;
    for(const w of weeks){
      if(sDate>=w.start && sDate<=w.end){
        w.workouts++;
        w.sessions.push(s);
        for(const ex of (s.ex||[])){
          for(const set of (ex.sets||[])){
            const r=+set.r||0, weight=+set.w||0;
            w.repsVol+=r;
            w.weightVol+=weight*r;
          }
        }
        break;
      }
    }
  }
  return weeks;
}

function getMonthlyBuckets(sessions,numMonths=6){
  let maxDate=new Date();
  for(const s of sessions){
    const d=new Date(s.date);
    if(!isNaN(d)&&d>maxDate) maxDate=d;
  }
  const endMonth=new Date(maxDate.getFullYear(),maxDate.getMonth(),1);
  const months=[];
  for(let i=numMonths-1;i>=0;i--){
    const m=new Date(endMonth.getFullYear(),endMonth.getMonth()-i,1);
    const mEnd=new Date(m.getFullYear(),m.getMonth()+1,0,23,59,59,999);
    months.push({
      start:m, end:mEnd, key:m.getFullYear()+'-'+String(m.getMonth()+1).padStart(2,'0'),
      label:m.toLocaleDateString(undefined,{month:'short'}),
      weightVol:0, repsVol:0, workouts:0, sessions:[]
    });
  }
  for(const s of sessions){
    const sDate=new Date(s.date);
    if(isNaN(sDate)) continue;
    for(const m of months){
      if(sDate>=m.start && sDate<=m.end){
        m.workouts++;
        m.sessions.push(s);
        for(const ex of (s.ex||[])){
          for(const set of (ex.sets||[])){
            const r=+set.r||0, weight=+set.w||0;
            m.repsVol+=r;
            m.weightVol+=weight*r;
          }
        }
        break;
      }
    }
  }
  return months;
}

function renderVolumeChart(buckets,metric){
  const vals=buckets.map(b=>metric==='weight'?b.weightVol:b.repsVol);
  const maxVal=Math.max(...vals,1);
  const W=560, H=180, P={l:45,r:15,t:22,b:30};
  const n=buckets.length;
  const slotW=(W-P.l-P.r)/n;
  const barW=Math.min(Math.max(slotW*0.52,10),34);

  const yTicks=[0,Math.round(maxVal/2),Math.round(maxVal)];
  const formatY=v=>{
    if(v>=1000000) return (v/1000000).toFixed(1)+'M';
    if(v>=1000) return (v/1000).toFixed(1)+'k';
    return String(v);
  };
  const yPos=v=>P.t+(1-(v/maxVal))*(H-P.t-P.b);

  let svgHtml=`<svg viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="Volume history chart">`;
  yTicks.forEach(t=>{
    const y=yPos(t);
    svgHtml+=`<line class="grid" x1="${P.l}" x2="${W-P.r}" y1="${y.toFixed(1)}" y2="${y.toFixed(1)}"/>`;
    svgHtml+=`<text x="${P.l-6}" y="${(y+4).toFixed(1)}" text-anchor="end">${formatY(t)}</text>`;
  });

  buckets.forEach((b,i)=>{
    const val=vals[i];
    const x=P.l+i*slotW+(slotW-barW)/2;
    const barH=val>0 ? Math.max((val/maxVal)*(H-P.t-P.b),4) : 0;
    const y=H-P.b-barH;

    if(val>0){
      svgHtml+=`<rect x="${x.toFixed(1)}" y="${y.toFixed(1)}" width="${barW.toFixed(1)}" height="${barH.toFixed(1)}" rx="3" fill="var(--slate)"/>`;
      const txtY=Math.max(y-5,P.t+10);
      svgHtml+=`<text x="${(x+barW/2).toFixed(1)}" y="${txtY.toFixed(1)}" text-anchor="middle" font-size="10" fill="var(--steel)">${val>=1000 ? (val/1000).toFixed(1)+'k' : Math.round(val)}</text>`;
    } else {
      svgHtml+=`<rect x="${x.toFixed(1)}" y="${(H-P.b-2).toFixed(1)}" width="${barW.toFixed(1)}" height="2" rx="1" fill="var(--line)"/>`;
    }
    svgHtml+=`<text x="${(P.l+i*slotW+slotW/2).toFixed(1)}" y="${H-8}" text-anchor="middle">${hesc(b.label)}</text>`;
  });
  svgHtml+=`</svg>`;
  return svgHtml;
}

function renderMuscleBreakdown(buckets){
  const STANDARD_GROUPS=['Chest','Back','Legs','Shoulders','Biceps','Triceps','Core','Conditioning'];
  const groupStats={};
  STANDARD_GROUPS.forEach(g=>{ groupStats[g]={sets:0,reps:0,weightVol:0}; });

  const tfSessions=buckets.flatMap(b=>b.sessions||[]);
  tfSessions.forEach(s=>{
    (s.ex||[]).forEach(ex=>{
      const meta=exMeta(ex.name);
      const g=meta?.g||'Other';
      if(!groupStats[g]) groupStats[g]={sets:0,reps:0,weightVol:0};
      (ex.sets||[]).forEach(set=>{
        const r=+set.r||0, w=+set.w||0;
        groupStats[g].sets+=1;
        groupStats[g].reps+=r;
        groupStats[g].weightVol+=w*r;
      });
    });
  });

  const totalSets=Object.values(groupStats).reduce((a,b)=>a+b.sets,0);
  const groupsToDisplay=[...new Set([...STANDARD_GROUPS,...Object.keys(groupStats)])];

  if(totalSets===0){
    return `<div class="empty" style="padding:12px;font-size:13px">No volume recorded in this timeframe.</div>`;
  }

  const GROUP_COLORS = {
    Chest: '#A33B28',      // --rust
    Back: '#33505C',       // --slate
    Legs: '#6E7276',       // --steel
    Shoulders: '#C25E3E',  // warm rust
    Biceps: '#5C7A86',     // slate blue
    Triceps: '#8C4839',    // terracotta
    Arms: '#5C7A86',       // legacy Arms
    Core: '#4A4D4F',       // dark steel
    Conditioning: '#A8A59C'// muted earth
  };

  const activeGroups = groupsToDisplay.filter(g => (groupStats[g]?.sets||0) > 0);

  // Build SVG Donut chart
  const cx = 100, cy = 100, R = 80, rInner = 48;
  let chartSvg = '';
  let startAngle = -Math.PI / 2;

  if (activeGroups.length === 1) {
    const g = activeGroups[0];
    const sets = groupStats[g].sets;
    const pct = totalSets > 0 ? (sets / totalSets) : 0;
    const pctRound = Math.round(pct * 100);
    const color = GROUP_COLORS[g] || '#A33B28';
    chartSvg = `<circle class="pie-slice" data-group="${hesc(g)}" data-pct="${pctRound}" data-sets="${sets}" aria-label="${hesc(g)}: ${pctRound}%" cx="${cx}" cy="${cy}" r="${R}" fill="${color}" style="cursor:pointer" />`;
  } else {
    activeGroups.forEach(g => {
      const sets = groupStats[g].sets;
      const pct = sets / totalSets;
      const pctRound = Math.round(pct * 100);
      const angleSpan = pct * 2 * Math.PI;
      const endAngle = startAngle + angleSpan;
      const color = GROUP_COLORS[g] || '#A33B28';

      const x1 = cx + R * Math.cos(startAngle);
      const y1 = cy + R * Math.sin(startAngle);
      const x2 = cx + R * Math.cos(endAngle);
      const y2 = cy + R * Math.sin(endAngle);

      const x1in = cx + rInner * Math.cos(endAngle);
      const y1in = cy + rInner * Math.sin(endAngle);
      const x2in = cx + rInner * Math.cos(startAngle);
      const y2in = cy + rInner * Math.sin(startAngle);

      const largeArc = angleSpan > Math.PI ? 1 : 0;

      const pathData = [
        `M ${x1.toFixed(2)} ${y1.toFixed(2)}`,
        `A ${R} ${R} 0 ${largeArc} 1 ${x2.toFixed(2)} ${y2.toFixed(2)}`,
        `L ${x1in.toFixed(2)} ${y1in.toFixed(2)}`,
        `A ${rInner} ${rInner} 0 ${largeArc} 0 ${x2in.toFixed(2)} ${y2in.toFixed(2)}`,
        'Z'
      ].join(' ');

      chartSvg += `<path class="pie-slice" data-group="${hesc(g)}" data-pct="${pctRound}" data-sets="${sets}" aria-label="${hesc(g)}: ${pctRound}%" d="${pathData}" fill="${color}" stroke="var(--paper)" stroke-width="1.5" style="cursor:pointer" />`;
      startAngle = endAngle;
    });
  }

  const pieChart = `<div class="mg-pie-wrap" style="text-align:center;margin:12px 0 16px">
    <svg viewBox="0 0 200 200" width="160" height="160" role="img" aria-label="Muscle group volume breakdown chart" style="display:inline-block">
      ${chartSvg}
      <circle id="pie-center-hit" cx="${cx}" cy="${cy}" r="${rInner}" fill="var(--paper)" style="cursor:pointer" />
      <g id="pie-center-text" style="cursor:pointer" data-total-sets="${totalSets}">
        <text id="pie-val" x="${cx}" y="${cy - 4}" text-anchor="middle" font-weight="800" font-size="22" fill="var(--ink)" font-family="inherit">${totalSets}</text>
        <text id="pie-lbl" x="${cx}" y="${cy + 14}" text-anchor="middle" font-size="11" fill="var(--steel)" font-family="inherit">total sets</text>
      </g>
    </svg>
  </div>`;

  const breakdownRows = groupsToDisplay.map(g=>{
    const st=groupStats[g]||{sets:0,reps:0,weightVol:0};
    if(st.sets===0 && !STANDARD_GROUPS.includes(g)) return '';
    const pct=totalSets>0 ? Math.round((st.sets/totalSets)*100) : 0;
    const color=GROUP_COLORS[g] || '#A33B28';
    return `<div class="mg-row" data-group="${hesc(g)}" style="margin-bottom:12px">
      <div style="display:flex;justify-content:space-between;align-items:baseline;margin-bottom:4px;font-size:13px">
        <span style="font-weight:600"><span style="display:inline-block;width:9px;height:9px;border-radius:50%;background:${color};margin-right:6px"></span>${hesc(g)}</span>
        <span style="color:var(--steel);font-size:12px">${st.sets} set${st.sets===1?'':'s'} · ${st.reps} reps (${pct}%)</span>
      </div>
      <div class="mg-bar-bg">
        <div class="mg-bar-fill" style="width:${pct}%;background:${pct>0 ? color : 'var(--line)'}"></div>
      </div>
    </div>`;
  }).join('');

  return pieChart + breakdownRows;
}

/* ---------- weight memory ----------
   Weights are remembered per set position, so a ramp like 60/70/80
   comes back as 60/70/80 rather than three sets of 80.            */
function lastPerformance(name){
  for(const s of db.sessions){
    const e=s.ex.find(x=>x.name===name);
    if(e && e.sets.length) return {date:s.date, sets:e.sets};
  }
  return null;
}
function prefill(name,count,reps){
  const prev=lastPerformance(name);
  return Array.from({length:count},(_,i)=>({
    w: prev ? (prev.sets[i]?.w ?? prev.sets[prev.sets.length-1].w ?? '') : '',
    r: reps, done:false
  }));
}

    ex:day.ex.map(([name,sets,reps])=>({name,target:reps,sets:prefill(name,sets,reps)}))};
  save(); tab='train'; render();
}

function beginRepeat(src,dateMs){
  db.draft={id:'s'+Date.now().toString(36)+Math.random().toString(36).slice(2,7),
    date:dateMs||noon(new Date()), day:src.day, program:src.program||'Repeat',
    ex:src.ex.map(e=>({name:e.name, target:+e.sets[0]?.r||10,
      sets:e.sets.map(s=>({w:s.w, r:s.r, done:false}))}))};
  save(); tab='train'; render();
}

function drawDraft(){
  const dr=db.draft;
  const isEditing = dr.isEdit || db.sessions.some(s=>s.id===dr.id);
  const vol=dr.ex.reduce((a,e)=>a+e.sets.reduce((b,s)=>b+(+s.w||0)*(+s.r||0),0),0);
  const doneCount=dr.ex.reduce((a,e)=>a+e.sets.filter(s=>s.done).length,0);
  const total=dr.ex.reduce((a,e)=>a+e.sets.length,0);
  const dayLabel=new Date(dr.date).toLocaleDateString(undefined,{weekday:'long',day:'numeric',month:'long'});
  const isToday=dayKey(dr.date)===dayKey(new Date());
  view().innerHTML=`<h2 style="margin-top:20px">${dr.day}</h2>
    <p class="note" style="margin-bottom:10px">${isToday?'Today':dayLabel}${dr.program?' · '+dr.program:''}</p>
    <div class="stat">
      <div><b>${total}</b><span>sets</span></div>
      <div><b>${Math.round(vol).toLocaleString()}</b><span>${db.unit} volume</span></div>
    </div>
    <div id="exlist"></div>
    <button class="ghost" id="addex" style="width:100%;margin-bottom:14px">Add an exercise</button>
    <div class="row" style="margin:0 0 4px">
      <button class="rust grow" id="finish">${isEditing?'Save changes':'Finish session'}</button>
      <button class="ghost" id="scrap">${isEditing?'Cancel edit':'Discard'}</button>
    </div>`;
  const list=document.getElementById('exlist');
  dr.ex.forEach(ex=>{
    const finished = ex.sets.filter(s=>s.done).length;
    const complete = finished===ex.sets.length;
    const nowIdx = ex.sets.findIndex(s=>!s.done);   // the set you're on
    const prev = lastPerformance(ex.name);
    const slug = exSlug(ex.name);
    const isExpanded = !!ex.showDiag;

    const card=document.createElement('div');
    card.className='card'+(complete?' done':'');
    card.innerHTML=`
      <div class="exhead" style="cursor:pointer" title="Tap to toggle diagram">
        <h3>${ex.name} <button class="quiet diag-toggle" aria-label="Toggle diagram for ${ex.name}" style="padding:0 4px;font-size:14px;vertical-align:middle;">🖼️</button></h3>
        <em>${finished} of ${ex.sets.length} ticked</em>
      </div>
      ${isExpanded ? `
        <div class="ex-diagram">
          <img src="img/exercises/${slug}.svg" alt="${ex.name} diagram" onerror="this.style.display='none'">
        </div>` : ''}
      ${prev?`<p class="note" style="margin:-2px 0 10px">Last time ${fmtDate(prev.date)}: ${prev.sets.map(s=>`${s.w}×${s.r}`).join(', ')}</p>`:''}
      <div class="controls">
        <div class="step" data-k="sets">
          <button data-d="-1" ${ex.sets.length<=1?'disabled':''} aria-label="One set fewer">−</button>
          <span>${ex.sets.length} sets</span>
          <button data-d="1" ${ex.sets.length>=12?'disabled':''} aria-label="One set more">+</button>
        </div>
        <div class="step" data-k="reps">
          <button data-d="-1" ${ex.target<=1?'disabled':''} aria-label="One rep fewer">−</button>
          <span>${ex.target} ${isTimed(ex.name)?'sec':'reps'}</span>
          <button data-d="1" ${ex.target>=50?'disabled':''} aria-label="One rep more">+</button>
        </div>
        <button class="mini dropex" aria-label="Remove ${ex.name} from this session">Drop</button>
      </div>
      <div class="units"><div></div><div>${db.unit}</div><div>${isTimed(ex.name)?'sec':'reps'}</div><div></div></div>
      <div class="sets"></div>`;

    card.querySelector('.exhead').onclick=()=>{
      ex.showDiag = !ex.showDiag; save(); drawDraft();
    };
    card.querySelectorAll('.step button').forEach(b=>{
      b.onclick=()=>{
        const d=+b.dataset.d, kind=b.parentElement.dataset.k;
        if(kind==='sets'){
          if(d>0) ex.sets.push({w:ex.sets.at(-1)?.w||'', r:ex.target, done:false});
          else if(ex.sets.length>1) ex.sets.pop();
        } else {
          const cap=isTimed(ex.name)?600:50;
          ex.target=Math.min(cap,Math.max(1,ex.target+d));
          ex.sets.forEach(s=>{ if(!s.done) s.r=ex.target; });  // only reshape sets not yet logged
        }
        save(); drawDraft();
      };
    });
    card.querySelector('.dropex').onclick=()=>{
      if(finished && !confirm(`Drop ${ex.name}? ${finished} logged set${finished>1?'s':''} will be lost.`)) return;
      db.draft.ex=db.draft.ex.filter(x=>x!==ex); save(); drawDraft();
    };

    const sets=card.querySelector('.sets');
    ex.sets.forEach((s,si)=>{
      const r=document.createElement('div');
      r.className='setrow'+(s.done?' ok':'')+(si===nowIdx?' now':'');
      r.innerHTML=`<div class="setno">${si+1}</div>
        <input type="number" inputmode="decimal" step="0.5" value="${s.w}" placeholder="–" aria-label="Weight, set ${si+1}">
        <input type="number" inputmode="numeric" value="${s.r}" aria-label="Reps, set ${si+1}">
        <button class="tick" aria-pressed="${s.done}" aria-label="Set ${si+1} ${s.done?'logged':'not logged'}">✓</button>`;
      const [wIn,rIn]=r.querySelectorAll('input');
      wIn.oninput=e=>{s.w=e.target.value;save();};
      rIn.oninput=e=>{s.r=e.target.value;save();};
      r.querySelector('.tick').onclick=()=>{
        s.done=!s.done; save();
        if(s.done) startTimer(/squat|deadlift|bench|press|row/i.test(ex.name)?180:90);
        else stopTimer();          // untick = mistake, kill the rest clock
        drawDraft();
      };
      sets.appendChild(r);
    });
    list.appendChild(card);
  });
  document.getElementById('addex').onclick=()=>openLibrary(picked=>{
    picked.forEach(x=>db.draft.ex.push({name:x.n,target:x.r,sets:prefill(x.n,x.s,x.r)}));
    save(); drawDraft();
  });
  document.getElementById('finish').onclick=()=>{
    const s=JSON.parse(JSON.stringify(dr));
    delete s.isEdit;
    s.ex=s.ex.filter(e=>e.sets.length);
    if(!s.ex.length){
      if(isEditing){
        db.sessions=db.sessions.filter(x=>x.id!==s.id);
      }
      db.draft=null;save();render();return;
    }
    if(!s.id) s.id='s'+Date.now().toString(36)+Math.random().toString(36).slice(2,7);
    const existingIdx = db.sessions.findIndex(x=>x.id===s.id);
    if(existingIdx >= 0){
      db.sessions[existingIdx] = s;
    } else {
      db.sessions.unshift(s);
    }
    db.sessions.sort((a,b)=>b.date-a.date);     // backdated sessions slot into place
    db.draft=null; stopTimer(); save();
    const d=new Date(s.date);
    calMonth=new Date(d.getFullYear(),d.getMonth(),1);
    calSel=dayKey(s.date); tab='calendar'; render();
  };
  document.getElementById('scrap').onclick=()=>{
    db.draft=null;stopTimer();save();
    if(isEditing){ tab='calendar'; }
    render();
  };
}

/* --- Progress --- */

    <h2 style="margin-top:22px">Exercise History & 1RM</h2>
    <select id="pick" style="margin:4px 0 14px">${names.map(n=>`<option ${n===progressEx?'selected':''}>${hesc(n)}</option>`).join('')}</select>
    <div id="chart"></div>`;

  document.getElementById('tf-weekly').onclick = () => { progressTimeframe = 'weekly'; vProgress(); };
  document.getElementById('tf-monthly').onclick = () => { progressTimeframe = 'monthly'; vProgress(); };
  document.getElementById('m-weight').onclick = () => { progressMetric = 'weight'; vProgress(); };
  document.getElementById('m-reps').onclick = () => { progressMetric = 'reps'; vProgress(); };

  const pickEl = document.getElementById('pick');
  if (pickEl) {
    pickEl.onchange = () => { progressEx = pickEl.value; chartFor(progressEx); };
    chartFor(pickEl.value);
  }

  // Interactive Pie Chart handling
  const mbEl = document.getElementById('muscle-breakdown');
  if (mbEl) {
    let selectedGroup = null;

    const resetPie = () => {
      selectedGroup = null;
      const pieVal = mbEl.querySelector('#pie-val');
      const pieLbl = mbEl.querySelector('#pie-lbl');
      const pieTextGroup = mbEl.querySelector('#pie-center-text');
      const totalSets = pieTextGroup ? pieTextGroup.dataset.totalSets : '';

      if (pieVal) pieVal.textContent = totalSets;
      if (pieLbl) pieLbl.textContent = 'total sets';

      mbEl.querySelectorAll('.pie-slice').forEach(el => {
        el.classList.remove('selected');
        el.style.opacity = '1';
        el.style.stroke = el.tagName.toLowerCase() === 'circle' ? '' : 'var(--paper)';
        el.style.strokeWidth = el.tagName.toLowerCase() === 'circle' ? '' : '1.5';
      });

      mbEl.querySelectorAll('.mg-row').forEach(row => {
        row.classList.remove('selected');
        row.style.opacity = '1';
        row.style.fontWeight = '';
      });
    };

    mbEl.querySelectorAll('.pie-slice').forEach(slice => {
      slice.onclick = (e) => {
        e.stopPropagation();
        const g = slice.dataset.group;
        const pct = slice.dataset.pct;
        const sets = +slice.dataset.sets;

        if (selectedGroup === g) {
          resetPie();
        } else {
          selectedGroup = g;
          const pieVal = mbEl.querySelector('#pie-val');
          const pieLbl = mbEl.querySelector('#pie-lbl');
          if (pieVal) pieVal.textContent = `${pct}%`;
          if (pieLbl) pieLbl.textContent = `${g} · ${sets} set${sets === 1 ? '' : 's'}`;

          mbEl.querySelectorAll('.pie-slice').forEach(el => {
            if (el.dataset.group === g) {
              el.classList.add('selected');
              el.style.opacity = '1';
              el.style.stroke = 'var(--ink)';
              el.style.strokeWidth = '3';
            } else {
              el.classList.remove('selected');
              el.style.opacity = '0.35';
              el.style.stroke = el.tagName.toLowerCase() === 'circle' ? '' : 'var(--paper)';
              el.style.strokeWidth = el.tagName.toLowerCase() === 'circle' ? '' : '1.5';
            }
          });

          mbEl.querySelectorAll('.mg-row').forEach(row => {
            if (row.dataset.group === g) {
              row.classList.add('selected');
              row.style.opacity = '1';
              row.style.fontWeight = '600';
            } else {
              row.classList.remove('selected');
              row.style.opacity = '0.4';
              row.style.fontWeight = '';
            }
          });
        }
      };
    });

    const centerHit = mbEl.querySelector('#pie-center-hit');
    const centerText = mbEl.querySelector('#pie-center-text');
    if (centerHit) centerHit.onclick = (e) => { e.stopPropagation(); resetPie(); };
    if (centerText) centerText.onclick = (e) => { e.stopPropagation(); resetPie(); };
  }
}

function chartFor(name){
  const pts=db.sessions.slice().reverse().flatMap(s=>{
    const ex=(s.ex||[]).find(e=>e.name===name); if(!ex || !ex.sets || !ex.sets.length) return [];
    const best=Math.max(...ex.sets.map(x=>e1rm(+x.w||0,+x.r||0)));
    const vol=ex.sets.reduce((a,x)=>a+(+x.w||0)*(+x.r||0),0);
    return [{d:s.date,v:best,vol}];
  });
  const box=document.getElementById('chart');
  if(!box) return;

  if(!pts.length){
    box.innerHTML=`<div class="empty">No logged sessions found for ${hesc(name)}.</div>`;
    return;
  }

  if(pts.length===1){
    const p=pts[0];
    box.innerHTML=`<div class="card">
      <div class="exhead"><h3>Estimated 1-rep max</h3><em>1 session logged</em></div>
      <div class="stat" style="margin:8px 0 10px">
        <div><b>${Math.round(p.v)} ${hesc(db.unit)}</b><span>Best Epley 1RM</span></div>
      </div>
      <p class="note">Trend line will appear once you log a second session with this exercise.</p>
    </div>
    <div class="card"><h3 style="margin-bottom:8px">Session volume</h3>
      <div class="histline">
        <span>${fmtDate(p.d)}</span><small>${Math.round(p.vol).toLocaleString()} ${hesc(db.unit)}</small>
      </div>
    </div>`;
    return;
  }

  const W=560,H=210,P={l:38,r:12,t:14,b:26};
  const vs=pts.map(p=>p.v), lo=Math.min(...vs)*0.94, hi=Math.max(...vs)*1.04||1;
  const x=i=>P.l+i*(W-P.l-P.r)/(pts.length-1);
  const y=v=>P.t+(hi-v)/((hi-lo)||1)*(H-P.t-P.b);
  const line=pts.map((p,i)=>`${i?'L':'M'}${x(i).toFixed(1)},${y(p.v).toFixed(1)}`).join(' ');
  const gain=pts[0].v>0 ? (pts.at(-1).v/pts[0].v-1)*100 : 0;
  box.innerHTML=`<div class="card">
      <div class="exhead"><h3>Estimated 1-rep max</h3>
        <em style="color:${gain>=0?'var(--slate)':'var(--steel)'}">${gain>=0?'+':''}${gain.toFixed(1)}% overall</em></div>
      <svg viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="Estimated one-rep max over time">
        ${[lo,(lo+hi)/2,hi].map(t=>`<line class="grid" x1="${P.l}" x2="${W-P.r}" y1="${y(t)}" y2="${y(t)}"/>
          <text x="4" y="${y(t)+4}">${Math.round(t)}</text>`).join('')}
        <path class="plot" d="${line}"/>
        ${pts.map((p,i)=>`<circle class="dot" cx="${x(i).toFixed(1)}" cy="${y(p.v).toFixed(1)}" r="3.5"/>`).join('')}
        <text x="${P.l}" y="${H-6}">${fmtDate(pts[0].d)}</text>
        <text x="${W-P.r}" y="${H-6}" text-anchor="end">${fmtDate(pts.at(-1).d)}</text>
      </svg>
      <p class="note">Epley estimate: weight × (1 + reps ÷ 30), best set of each session, in ${hesc(db.unit)}.</p>
    </div>
    <div class="card"><h3 style="margin-bottom:8px">Session volume</h3>
      ${pts.slice().reverse().slice(0,6).map(p=>`<div class="histline">
        <span>${fmtDate(p.d)}</span><small>${Math.round(p.vol).toLocaleString()} ${hesc(db.unit)}</small></div>`).join('')}
    </div>`;
}

    const b=document.createElement('button');

      <span style="font-size:13px;color:var(--steel);font-weight:600">${id===db.programId?'active':'use'}</span>`;
    b.onclick=()=>{db.programId=id;save();render();};
    const edit=document.createElement('button');
    edit.className='mini'; edit.textContent=mine?'Edit':'Copy';
    edit.title=mine?'Edit this program':'Copy into your own programs to edit';
    edit.onclick=()=>{
      editing = mine
        ? {id, ...JSON.parse(JSON.stringify(p))}
        : {id:'c'+Date.now().toString(36), name:p.name+' (mine)', note:'', days:JSON.parse(JSON.stringify(p.days))};
      render();
    };
    wrap.append(b,edit); box.appendChild(wrap);
  });

  document.getElementById('newprog').onclick=()=>{
    editing={id:'c'+Date.now().toString(36),name:'',note:'',days:[{name:'Day 1',ex:[]}]}; render();
  };
  document.getElementById('unit').onchange=e=>{db.unit=e.target.value;save();};
  document.getElementById('exp').onclick=()=>{
    const name=profiles.find(p=>p.id===me).name;
    const blob=new Blob([JSON.stringify({profile:name,exported:Date.now(),data:db},null,2)],{type:'application/json'});
    const a=document.createElement('a');
    a.href=URL.createObjectURL(blob);
    a.download=`ferrodastiro-${name.toLowerCase()}-${new Date().toISOString().slice(0,10)}.json`;
    a.click(); URL.revokeObjectURL(a.href);
  };
  document.getElementById('imp').onclick=()=>document.getElementById('file').click();
  document.getElementById('file').onchange=async e=>{
    const f=e.target.files[0]; if(!f) return;
    try{
      const parsed=JSON.parse(await f.text());
      const incoming=parsed.data||parsed;
      if(!Array.isArray(incoming.sessions)) throw new Error('shape');
      if(confirm(`Replace this profile's log with ${incoming.sessions.length} imported sessions?`)){
        db=Object.assign(BLANK(),incoming);
        db.sessions.forEach(s=>{ if(!s.id) s.id='s'+Math.random().toString(36).slice(2,9); });
        save(); render();
      }
    }catch(err){ alert("That file isn't a FerroDaStiro export."); }
  };
  document.getElementById('del').onclick=()=>{
    const name=profiles.find(p=>p.id===me).name;
    if(!confirm(`Delete ${name} and all their sessions? This cannot be undone.`)) return;
    localStorage.removeItem(dkey(me));
    profiles=profiles.filter(p=>p.id!==me); writeJSON(PKEY,profiles);
    localStorage.removeItem(AKEY); loadProfiles();
    if(me){loadData();} else {db=BLANK();}
    tab='train'; render();
  };
}

/* --- Exercise library --- */
function openLibrary(onAdd, extra){
  screen=Object.assign({type:'lib', onAdd, group:'All', q:'', picked:[]}, extra||{});

}

function sLibrary(){
  const st=screen;
  // If creating mode, show creation form inline
  if(st.creating){
    view().innerHTML=`
      <h2>New exercise</h2>
      <div class="card" style="margin-top:10px">
        <div style="margin-bottom:12px">
          <label style="font-size:13px;font-weight:600;display:block;margin-bottom:4px">Exercise name</label>
          <input id="cxname" placeholder="e.g. Kettlebell press" maxlength="60" autocomplete="off"
            value="${(st.cxname||'').replace(/"/g,'&quot;')}">
        </div>
        <div style="margin-bottom:12px">
          <label style="font-size:13px;font-weight:600;display:block;margin-bottom:6px">Muscle group</label>
          <div class="chips" id="cxchips" style="flex-wrap:wrap"></div>
        </div>
        <div style="margin-bottom:12px">
          <label style="font-size:13px;font-weight:600;display:block;margin-bottom:6px">Measurement</label>
          <div style="display:flex;gap:8px">
            <button id="cxreps" class="${(st.cxt||0)?'ghost':'rust'}" style="flex:1">Reps</button>
            <button id="cxsecs" class="${(st.cxt||0)?'rust':'ghost'}" style="flex:1">Seconds</button>
          </div>
        </div>
        <div style="margin-bottom:14px;display:flex;align-items:center;gap:10px">
          <div style="flex:1">
            <label style="font-size:13px;font-weight:600;display:block;margin-bottom:4px">Default sets</label>
            <input id="cxsets" type="number" inputmode="numeric" min="1" max="12" value="${st.cxsets||3}">
          </div>
          <div style="flex:1">
            <label style="font-size:13px;font-weight:600;display:block;margin-bottom:4px">${(st.cxt||0)?'Seconds':'Reps'}</label>
            <input id="cxrepsv" type="number" inputmode="numeric" min="1" max="600" value="${st.cxrepsv||10}">
          </div>
        </div>
        <div class="row">
          <button class="rust grow" id="cxsave">Create exercise</button>
          <button class="ghost" id="cxcancel">Cancel</button>
        </div>
      </div>`;

    const cxChips=document.getElementById('cxchips');
    GROUPS.forEach(g=>{
      const c=document.createElement('button'); c.className='chip'; c.textContent=g;
      c.setAttribute('aria-pressed',String(g===(st.cxgroup||GROUPS[0])));
      c.onclick=()=>{ st.cxgroup=g; sLibrary(); };
      cxChips.appendChild(c);
    });

    document.getElementById('cxname').oninput=e=>{ st.cxname=e.target.value; };
    document.getElementById('cxsets').oninput=e=>{ st.cxsets=Math.min(12,Math.max(1,+e.target.value||1)); };
    document.getElementById('cxrepsv').oninput=e=>{ st.cxrepsv=Math.min(600,Math.max(1,+e.target.value||1)); };
    document.getElementById('cxreps').onclick=()=>{ st.cxt=0; sLibrary(); };
    document.getElementById('cxsecs').onclick=()=>{ st.cxt=1; sLibrary(); };
    document.getElementById('cxcancel').onclick=()=>{ st.creating=false; sLibrary(); };
    document.getElementById('cxsave').onclick=()=>{
      const name=(st.cxname||'').trim();
      if(!name){ alert('Please enter an exercise name.'); document.getElementById('cxname').focus(); return; }
      if(allExercises().some(e=>e.n.toLowerCase()===name.toLowerCase())){
        alert('An exercise with that name already exists.'); document.getElementById('cxname').focus(); return; }
      const ex={n:name, g:st.cxgroup||GROUPS[0], s:+(st.cxsets||3), r:+(st.cxrepsv||10)};
      if(st.cxt) ex.t=1;
      db.customEx = db.customEx||[];
      db.customEx.push(ex);
      save();
      st.creating=false; st.cxname=''; st.q=name.toLowerCase(); sLibrary();
    };
    // Focus name input
    const ni=document.getElementById('cxname'); if(ni && !ni.value) ni.focus();
    return;
  }

  const allEx=allExercises();
  view().innerHTML=`
    <h2>Exercise library</h2>
    <div class="row" style="margin-top:6px;gap:8px">
      <input id="q" placeholder="Search ${allEx.length} exercises" autocomplete="off"
        value="${st.q.replace(/"/g,'&quot;')}" style="margin-top:0;flex:1">
      <button class="ghost" id="newex" style="white-space:nowrap;padding:9px 12px">+ New</button>
    </div>
    <div class="chips" id="chips" style="margin-top:10px"></div>
    <div class="row" style="margin:10px 0 6px;position:sticky;top:0;z-index:5;background:var(--concrete);padding:6px 0">
      <button class="rust grow" id="addsel" ${st.picked.length?'':'disabled'}>${
        st.picked.length?'Add '+st.picked.length:'Add'}</button>
      <button class="ghost" id="cancel">Cancel</button>
    </div>
    <div id="lib"></div>`;

  const chips=document.getElementById('chips');
  ['All',...GROUPS].forEach(g=>{
    const c=document.createElement('button'); c.className='chip'; c.textContent=g;
    c.setAttribute('aria-pressed',String(g===st.group));
    c.onclick=()=>{ st.group=g; sLibrary(); };
    chips.appendChild(c);
  });

  const lib=document.getElementById('lib');
  const list=allEx.filter(e=>(st.group==='All'||e.g===st.group) && e.n.toLowerCase().includes(st.q));
  if(!list.length){
    lib.innerHTML=`<div class="empty">Nothing matches that search.</div>`;
  }
  st.showDiag = st.showDiag || {};
  list.forEach(e=>{
    const on=st.picked.includes(e.n);
    const slug=exSlug(e.n);
    const isExpanded=!!st.showDiag[e.n];
    const isCustom=!!(db.customEx||[]).find(c=>c.n===e.n);
    const row=document.createElement('div');
    row.className='libitem-row';
    row.style.borderBottom='1px solid var(--line)';
    row.innerHTML=`
      <div style="display:flex;align-items:center;gap:8px;width:100%;">
        <button class="libitem" aria-pressed="${on}" style="border-bottom:none;flex:1;display:flex;align-items:center;gap:10px;text-align:left;padding:10px 2px;">
          <img src="img/exercises/${slug}.svg" alt="${hesc(e.n)} diagram" onerror="this.style.display='none'" class="ex-thumb">
          <span style="flex:1;min-width:0">${hesc(e.n)}${isCustom?' <span style="font-size:10px;color:var(--steel);background:var(--line);border-radius:3px;padding:1px 5px;font-weight:600">custom</span>':''}<small style="color:var(--steel);font-size:12px;display:block;font-weight:400">${hesc(e.g)} · ${hesc(e.s)}×${hesc(e.r)}${e.t?' sec':''}</small></span>
          <span style="font-size:15px">${on?'✓':'+'}</span>
        </button>
        <button class="quiet diag-toggle" aria-label="Toggle diagram for ${hesc(e.n)}" style="padding:6px 8px;flex-shrink:0;font-size:14px;">🖼️</button>
      </div>
      ${isExpanded ? `
        <div class="ex-diagram">
          <img src="img/exercises/${slug}.svg" alt="${hesc(e.n)} diagram" onerror="this.style.display='none'">
        </div>` : ''}
    `;
    row.querySelector('.libitem').onclick=()=>{ on ? st.picked.splice(st.picked.indexOf(e.n),1) : st.picked.push(e.n); sLibrary(); };
    row.querySelector('.diag-toggle').onclick=()=>{ st.showDiag[e.n] = !st.showDiag[e.n]; sLibrary(); };
    lib.appendChild(row);
  });

  const q=document.getElementById('q');
  q.oninput=ev=>{ st.q=ev.target.value.toLowerCase().trim(); const pos=ev.target.selectionStart;
    sLibrary(); const nq=document.getElementById('q'); nq.focus(); nq.setSelectionRange(pos,pos); };
  document.getElementById('newex').onclick=()=>{ st.creating=true; st.cxname=st.q?st.q:''; st.cxgroup=GROUPS[0]; st.cxt=0; st.cxsets=3; st.cxrepsv=10; sLibrary(); };
  document.getElementById('cancel').onclick=closeScreen;
  document.getElementById('addsel').onclick=()=>{
    const chosen=st.picked.map(n=>allExercises().find(e=>e.n===n)).filter(Boolean);
    const cb=st.onAdd; screen=null; cb(chosen);
  };
}

/* --- Calendar --- */
function vCalendar(){
  const byDay={};
  db.sessions.forEach(s=>{ const k=dayKey(s.date); (byDay[k]=byDay[k]||[]).push(s); });

  const y=calMonth.getFullYear(), m=calMonth.getMonth();
  const first=new Date(y,m,1), daysIn=new Date(y,m+1,0).getDate();
  const lead=(first.getDay()+6)%7;                       // Monday-first week
  const todayK=dayKey(new Date());
  const monthSessions=db.sessions.filter(s=>{const d=new Date(s.date);return d.getFullYear()===y&&d.getMonth()===m;});
  const monthVol=monthSessions.reduce((a,s)=>a+s.ex.reduce((b,e)=>b+e.sets.reduce((c,x)=>c+(+x.w||0)*(+x.r||0),0),0),0);

  view().innerHTML=`
    <div class="monthbar">
      <button id="prev" aria-label="Previous month">‹</button>
      <b>${calMonth.toLocaleDateString(undefined,{month:'long',year:'numeric'})}</b>
      <button id="next" aria-label="Next month">›</button>
    </div>
    <div class="cal" id="grid"></div>
    <div class="stat" style="margin-top:18px">
      <div><b>${monthSessions.length}</b><span>sessions this month</span></div>
      <div><b>${Math.round(monthVol).toLocaleString()}</b><span>${db.unit} lifted</span></div>
    </div>
    <div id="daydetail"></div>`;

  const grid=document.getElementById('grid');
  document.getElementById('prev').onclick=()=>{calMonth=new Date(y,m-1,1);calSel=null;vCalendar();};
  document.getElementById('next').onclick=()=>{calMonth=new Date(y,m+1,1);calSel=null;vCalendar();};
  ['M','T','W','T','F','S','S'].forEach(d=>{
    const h=document.createElement('div'); h.className='dow'; h.textContent=d; grid.appendChild(h); });
  for(let i=0;i<lead;i++){ const b=document.createElement('div'); b.className='cell blank'; grid.appendChild(b); }
  for(let d=1;d<=daysIn;d++){
    const k=dayKey(new Date(y,m,d)), ss=byDay[k];
    const c=document.createElement('button');
    c.className='cell'+(ss?' has':'')+(k===todayK?' today':'')+(k===calSel?' sel':'');
    c.innerHTML=`<span>${d}</span>${ss?`<small>${ss[0].day}</small>`:''}`;
    c.onclick=()=>{ calSel=k; vCalendar(); };
    grid.appendChild(c);
  }

  const box=document.getElementById('daydetail');
  const selMs = calSel ? noon(new Date(calSel+'T12:00:00')) : null;
  const shown = calSel ? (byDay[calSel]||[]) : monthSessions;

  let out='';
  if(calSel){
    const label=new Date(selMs).toLocaleDateString(undefined,{weekday:'long',day:'numeric',month:'long'});
    const draftHere = db.draft && dayKey(db.draft.date)===calSel;
    const future = selMs > noon(new Date());
    out += `<div class="card">
      <h3 style="margin-bottom:2px">${label}</h3>
      <p class="note" style="margin-bottom:12px">${
        draftHere ? 'A workout is open for this day.'
        : shown.length ? `${shown.length} session${shown.length>1?'s':''} logged.`
        : future ? 'Nothing logged. You can plan this day ahead.'
        : 'Nothing logged.'}</p>
      <button class="${draftHere?'rust':'ghost'}" id="startHere" style="width:100%">${
        draftHere ? 'Continue this workout' : shown.length ? 'Log another workout' : 'Start a workout'}</button>
    </div>`;
  }
  out += shown.map(s=>sessionCard(s)).join('');
  if(!calSel && !shown.length) out=`<div class="empty">No sessions this month yet.</div>`;

  /* One assignment, then wire everything. Writing to innerHTML a second
     time would re-parse the panel and throw away its click handler. */
  box.innerHTML=out;

  const startBtn=document.getElementById('startHere');
  if(startBtn) startBtn.onclick=()=>{
    if(db.draft && dayKey(db.draft.date)===calSel){ tab='train'; render(); }
    else openStart(selMs);
  };
  box.querySelectorAll('[data-edit]').forEach(b=>{
    b.onclick=()=>{
      const id=b.dataset.edit;
      const s=db.sessions.find(x=>x.id===id);
      if(!s) return;
      if(db.draft && !confirm('A workout is already open. Discard it and edit this one?')) return;
      db.draft={ ...JSON.parse(JSON.stringify(s)), isEdit:true };
      save(); tab='train'; render();
    };
  });
  box.querySelectorAll('[data-del]').forEach(b=>{
    b.onclick=()=>{
      const id=b.dataset.del;
      if(!confirm('Delete this logged session? This cannot be undone.')) return;
      db.sessions=db.sessions.filter(s=>s.id!==id); save(); vCalendar();
    };
  });
}

function sessionCard(s){
  if(!s.id) s.id='s'+Math.random().toString(36).slice(2,9);
  const vol=s.ex.reduce((a,e)=>a+e.sets.reduce((b,x)=>b+(+x.w||0)*(+x.r||0),0),0);
  return `<div class="card">
    <div class="exhead"><h3>${s.day}</h3>
      <em>${new Date(s.date).toLocaleDateString(undefined,{weekday:'short',day:'numeric',month:'short'})}</em></div>
    ${s.ex.map(e=>`<div class="histline"><span>${e.name}</span>
      <small>${e.sets.map(x=>`${x.w}×${x.r}`).join('  ')}</small></div>`).join('')}
    <div class="row" style="margin-top:10px">
      <p class="note grow" style="margin:0">${s.program||''}${s.program?' · ':''}${Math.round(vol).toLocaleString()} ${db.unit} volume</p>
      <button class="mini" data-edit="${s.id}">Edit</button>
      <button class="mini" data-del="${s.id}">Delete</button>
    </div>
  </div>`;
}

/* ---------- boot ---------- */
document.querySelectorAll('nav button').forEach(b=>
  b.onclick=()=>{tab=b.dataset.tab;editing=null;screen=null;render();window.scrollTo(0,0);});
loadProfiles(); if(me) loadData(); render();

if('serviceWorker' in navigator)
  window.addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));
</script>
