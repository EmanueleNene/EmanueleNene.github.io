<script>
/* ============================================================
   STORAGE MODEL
   fds.profiles      -> [{id, name}]
   fds.active        -> profile id
   fds.data.<id>     -> that person's whole log
   Everything is stored locally: it never leaves this device.
   Synchronous reads/writes use localStorage with zero latency.
   Asynchronously mirrored to IndexedDB ('fds_store' / 'kv') for durability
   and auto-resurrection if WebKit/Safari purges localStorage.
   Persistent Storage API requested via navigator.storage.persist().
   ============================================================ */
const PKEY='fds.profiles', AKEY='fds.active', dkey=id=>'fds.data.'+id;

/* IndexedDB durable mirror */
const IDB_NAME='fds_store', IDB_VER=1, IDB_STORE='kv';
let idbPromise=null;
function getIDB(){
  if(!idbPromise){
    idbPromise=new Promise((resolve)=>{
      if(typeof indexedDB==='undefined'){ resolve(null); return; }
      try{
        const req=indexedDB.open(IDB_NAME, IDB_VER);
        req.onupgradeneeded=()=>{
          const db=req.result;
          if(!db.objectStoreNames.contains(IDB_STORE)){
            db.createObjectStore(IDB_STORE);
          }
        };
        req.onsuccess=()=>resolve(req.result);
        req.onerror=()=>resolve(null);
      }catch(e){ resolve(null); }
    });
  }
  return idbPromise;
}

function idbPut(k,v){
  return getIDB().then(db=>{
    if(!db) return;
    try{
      const tx=db.transaction(IDB_STORE,'readwrite');
      tx.objectStore(IDB_STORE).put(v, k);
    }catch(e){}
  }).catch(()=>{});
}

function idbDel(k){
  return getIDB().then(db=>{
    if(!db) return;
    try{
      const tx=db.transaction(IDB_STORE,'readwrite');
      tx.objectStore(IDB_STORE).delete(k);
    }catch(e){}
  }).catch(()=>{});
}

function idbGetAll(){
  return getIDB().then(db=>{
    if(!db) return null;
    return new Promise(resolve=>{
      try{
        const tx=db.transaction(IDB_STORE,'readonly');
        const st=tx.objectStore(IDB_STORE);
        if(st.getAll && st.getAllKeys){
          const reqK=st.getAllKeys();
          reqK.onsuccess=()=>{
            const keys=reqK.result;
            const reqV=st.getAll();
            reqV.onsuccess=()=>{
              const res={};
              keys.forEach((k,i)=>{ res[k]=reqV.result[i]; });
              resolve(res);
            };
            reqV.onerror=()=>resolve(null);
          };
          reqK.onerror=()=>resolve(null);
        }else if(st.openCursor){
          const res={};
          const req=st.openCursor();
          req.onsuccess=e=>{
            const cursor=e.target.result;
            if(cursor){
              res[cursor.key]=cursor.value;
              cursor.continue();
            }else{
              resolve(res);
            }
          };
          req.onerror=()=>resolve(null);
        }else{
          resolve(null);
        }
      }catch(e){ resolve(null); }
    });
  }).catch(()=>null);
}

/* Auto-resurrection from IndexedDB mirror if localStorage was wiped */
async function autoResurrect(){
  try{
    if(localStorage.getItem(PKEY)) return false;
    const kv=await idbGetAll();
    if(!kv || !kv[PKEY]) return false;
    let restoredCount=0;
    Object.keys(kv).forEach(k=>{
      if(k.startsWith('fds.')){
        const val = typeof kv[k] === 'string' && k === AKEY ? kv[k] : JSON.stringify(kv[k]);
        localStorage.setItem(k, val);
        restoredCount++;
      }
    });
    return restoredCount > 0;
  }catch(e){
    return false;
  }
}

/* Persistent storage checking & request */
let storageStatus={persisted:false, checked:false};
async function checkPersistence(){
  try{
    if(navigator.storage && navigator.storage.persisted){
      storageStatus.persisted = await navigator.storage.persisted();
      storageStatus.checked = true;
    }
  }catch(e){}
  return storageStatus.persisted;
}

async function requestPersistence(){
  try{
    if(navigator.storage && navigator.storage.persist){
      storageStatus.persisted = await navigator.storage.persist();
      storageStatus.checked = true;
    }else{
      await checkPersistence();
    }
  }catch(e){}
  return storageStatus.persisted;
}

/* One-time carry-over from the old "ironlog.*" keys, for anyone
   who installed before the rename. Runs once, then never again. */
(function migrate(){
  try{
    if(localStorage.getItem(PKEY) || !localStorage.getItem('ironlog.profiles')) return;
    localStorage.setItem(PKEY, localStorage.getItem('ironlog.profiles'));
    const a=localStorage.getItem('ironlog.active'); if(a) localStorage.setItem(AKEY,a);
    JSON.parse(localStorage.getItem('ironlog.profiles')).forEach(p=>{
      const d=localStorage.getItem('ironlog.data.'+p.id);
      if(d) localStorage.setItem('fds.data.'+p.id, d);
    });
  }catch(e){ /* nothing to carry over */ }
})();
const readJSON=(k,f)=>{try{const v=localStorage.getItem(k);return v?JSON.parse(v):f}catch(e){return f}};
const writeJSON=(k,v)=>{
  try{localStorage.setItem(k,JSON.stringify(v))}catch(e){alert('Storage is full or blocked. Data was not saved.')}
  idbPut(k, v);
};

const BLANK = () => ({unit:'kg', programId:'ul', custom:{}, customEx:[], exEdits:{}, sessions:[], bodyweight:[], draft:null});

const dayKey = d => { const x=new Date(d);
  return x.getFullYear()+'-'+String(x.getMonth()+1).padStart(2,'0')+'-'+String(x.getDate()).padStart(2,'0'); };

let profiles=[], me=null, db=BLANK(), tab='calendar';
let calMonth=(()=>{const d=new Date();d.setDate(1);d.setHours(0,0,0,0);return d;})();
let calSel=dayKey(new Date()), editing=null;
let progressTimeframe='weekly', progressMetric='weight', progressEx=null, progressRadarMode='relative', progressRadarSel=null;

function getWeekStart(d){
  const dt=new Date(d); dt.setHours(0,0,0,0);
  const day=dt.getDay();
  const diff=dt.getDate()-day+(day===0?-6:1);
  return new Date(dt.setDate(diff));
}

function getWeeklyBuckets(sessions,numWeeks=8){
  let maxDate=new Date();
  for(const s of sessions){
    const d=new Date(s.date);
    if(!isNaN(d)&&d>maxDate) maxDate=d;
  }
  const endMon=getWeekStart(maxDate);
  const weeks=[];
  for(let i=numWeeks-1;i>=0;i--){
    const mon=new Date(endMon);
    mon.setDate(mon.getDate()-i*7);
    const sun=new Date(mon);
    sun.setDate(sun.getDate()+6);
    sun.setHours(23,59,59,999);
    weeks.push({
      start:mon, end:sun, key:mon.toISOString().slice(0,10),
      label:mon.toLocaleDateString(undefined,{month:'short',day:'numeric'}),
      weightVol:0, repsVol:0, workouts:0, sessions:[]
    });
  }
  for(const s of sessions){
    const sDate=new Date(s.date);
    if(isNaN(sDate)) continue;
    for(const w of weeks){
      if(sDate>=w.start && sDate<=w.end){
        w.workouts++;
        w.sessions.push(s);
        for(const ex of (s.ex||[])){
          const timed=isTimed(ex.name);
          for(const set of (ex.sets||[])){
            const r=+set.r||0, weight=+set.w||0;
            w.repsVol+=r;
            if(!timed) w.weightVol+=weight*r;
          }
        }
        break;
      }
    }
  }
  return weeks;
}

function getMonthlyBuckets(sessions,numMonths=6){
  let maxDate=new Date();
  for(const s of sessions){
    const d=new Date(s.date);
    if(!isNaN(d)&&d>maxDate) maxDate=d;
  }
  const endMonth=new Date(maxDate.getFullYear(),maxDate.getMonth(),1);
  const months=[];
  for(let i=numMonths-1;i>=0;i--){
    const m=new Date(endMonth.getFullYear(),endMonth.getMonth()-i,1);
    const mEnd=new Date(m.getFullYear(),m.getMonth()+1,0,23,59,59,999);
    months.push({
      start:m, end:mEnd, key:m.getFullYear()+'-'+String(m.getMonth()+1).padStart(2,'0'),
      label:m.toLocaleDateString(undefined,{month:'short'}),
      weightVol:0, repsVol:0, workouts:0, sessions:[]
    });
  }
  for(const s of sessions){
    const sDate=new Date(s.date);
    if(isNaN(sDate)) continue;
    for(const m of months){
      if(sDate>=m.start && sDate<=m.end){
        m.workouts++;
        m.sessions.push(s);
        for(const ex of (s.ex||[])){
          const timed=isTimed(ex.name);
          for(const set of (ex.sets||[])){
            const r=+set.r||0, weight=+set.w||0;
            m.repsVol+=r;
            if(!timed) m.weightVol+=weight*r;
          }
        }
        break;
      }
    }
  }
  return months;
}

function renderVolumeChart(buckets,metric){
  const vals=buckets.map(b=>metric==='weight'?b.weightVol:b.repsVol);
  const maxVal=Math.max(...vals,1);
  const W=560, H=180, P={l:45,r:15,t:22,b:30};
  const n=buckets.length;
  const slotW=(W-P.l-P.r)/n;
  const barW=Math.min(Math.max(slotW*0.52,10),34);

  const yTicks=[0,Math.round(maxVal/2),Math.round(maxVal)];
  const formatY=v=>{
    if(v>=1000000) return (v/1000000).toFixed(1)+'M';
    if(v>=1000) return (v/1000).toFixed(1)+'k';
    return String(v);
  };
  const yPos=v=>P.t+(1-(v/maxVal))*(H-P.t-P.b);

  let svgHtml=`<svg viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="Volume history chart">`;
  yTicks.forEach(t=>{
    const y=yPos(t);
    svgHtml+=`<line class="grid" x1="${P.l}" x2="${W-P.r}" y1="${y.toFixed(1)}" y2="${y.toFixed(1)}"/>`;
    svgHtml+=`<text x="${P.l-6}" y="${(y+4).toFixed(1)}" text-anchor="end">${formatY(t)}</text>`;
  });

  buckets.forEach((b,i)=>{
    const val=vals[i];
    const x=P.l+i*slotW+(slotW-barW)/2;
    const barH=val>0 ? Math.max((val/maxVal)*(H-P.t-P.b),4) : 0;
    const y=H-P.b-barH;

    if(val>0){
      svgHtml+=`<rect x="${x.toFixed(1)}" y="${y.toFixed(1)}" width="${barW.toFixed(1)}" height="${barH.toFixed(1)}" rx="3" fill="var(--slate)"/>`;
      const txtY=Math.max(y-5,P.t+10);
      svgHtml+=`<text x="${(x+barW/2).toFixed(1)}" y="${txtY.toFixed(1)}" text-anchor="middle" font-size="10" fill="var(--steel)">${val>=1000 ? (val/1000).toFixed(1)+'k' : Math.round(val)}</text>`;
    } else {
      svgHtml+=`<rect x="${x.toFixed(1)}" y="${(H-P.b-2).toFixed(1)}" width="${barW.toFixed(1)}" height="2" rx="1" fill="var(--line)"/>`;
    }
    svgHtml+=`<text x="${(P.l+i*slotW+slotW/2).toFixed(1)}" y="${H-8}" text-anchor="middle">${hesc(b.label)}</text>`;
  });
  svgHtml+=`</svg>`;
  return svgHtml;
}

function renderMuscleBreakdown(buckets){
  const STANDARD_GROUPS=['Chest','Back','Legs','Shoulders','Biceps','Triceps','Core','Conditioning','Cardio'];
  const groupStats={};
  STANDARD_GROUPS.forEach(g=>{ groupStats[g]={sets:0,reps:0,weightVol:0}; });

  const tfSessions=buckets.flatMap(b=>b.sessions||[]);
  tfSessions.forEach(s=>{
    (s.ex||[]).forEach(ex=>{
      const meta=exMeta(ex.name);
      const g=meta?.g||'Other';
      const timed=isTimed(ex.name);
      if(!groupStats[g]) groupStats[g]={sets:0,reps:0,weightVol:0};
      (ex.sets||[]).forEach(set=>{
        const r=+set.r||0, w=+set.w||0;
        groupStats[g].sets+=1;
        groupStats[g].reps+=r;
        if(!timed) groupStats[g].weightVol+=w*r;
      });
    });
  });

  const totalSets=Object.values(groupStats).reduce((a,b)=>a+b.sets,0);
  const groupsToDisplay=[...new Set([...STANDARD_GROUPS,...Object.keys(groupStats)])];

  if(totalSets===0){
    return `<div class="empty" style="padding:12px;font-size:13px">No volume recorded in this timeframe.</div>`;
  }

  const GROUP_COLORS = {
    Chest: '#A33B28',      // --rust
    Back: '#33505C',       // --slate
    Legs: '#6E7276',       // --steel
    Shoulders: '#C25E3E',  // warm rust
    Biceps: '#5C7A86',     // slate blue
    Triceps: '#8C4839',    // terracotta
    Arms: '#5C7A86',       // legacy Arms
    Core: '#4A4D4F',       // dark steel
    Conditioning: '#A8A59C'// muted earth
  };

  const activeGroups = groupsToDisplay.filter(g => (groupStats[g]?.sets||0) > 0);

  // Build SVG Donut chart
  const cx = 100, cy = 100, R = 80, rInner = 48;
  let chartSvg = '';
  let startAngle = -Math.PI / 2;

  if (activeGroups.length === 1) {
    const g = activeGroups[0];
    const sets = groupStats[g].sets;
    const pct = totalSets > 0 ? (sets / totalSets) : 0;
    const pctRound = Math.round(pct * 100);
    const color = GROUP_COLORS[g] || '#A33B28';
    chartSvg = `<circle class="pie-slice" data-group="${hesc(g)}" data-pct="${pctRound}" data-sets="${sets}" aria-label="${hesc(g)}: ${pctRound}%" cx="${cx}" cy="${cy}" r="${R}" fill="${color}" style="cursor:pointer" />`;
  } else {
    activeGroups.forEach(g => {
      const sets = groupStats[g].sets;
      const pct = sets / totalSets;
      const pctRound = Math.round(pct * 100);
      const angleSpan = pct * 2 * Math.PI;
      const endAngle = startAngle + angleSpan;
      const color = GROUP_COLORS[g] || '#A33B28';

      const x1 = cx + R * Math.cos(startAngle);
      const y1 = cy + R * Math.sin(startAngle);
      const x2 = cx + R * Math.cos(endAngle);
      const y2 = cy + R * Math.sin(endAngle);

      const x1in = cx + rInner * Math.cos(endAngle);
      const y1in = cy + rInner * Math.sin(endAngle);
      const x2in = cx + rInner * Math.cos(startAngle);
      const y2in = cy + rInner * Math.sin(startAngle);

      const largeArc = angleSpan > Math.PI ? 1 : 0;

      const pathData = [
        `M ${x1.toFixed(2)} ${y1.toFixed(2)}`,
        `A ${R} ${R} 0 ${largeArc} 1 ${x2.toFixed(2)} ${y2.toFixed(2)}`,
        `L ${x1in.toFixed(2)} ${y1in.toFixed(2)}`,
        `A ${rInner} ${rInner} 0 ${largeArc} 0 ${x2in.toFixed(2)} ${y2in.toFixed(2)}`,
        'Z'
      ].join(' ');

      chartSvg += `<path class="pie-slice" data-group="${hesc(g)}" data-pct="${pctRound}" data-sets="${sets}" aria-label="${hesc(g)}: ${pctRound}%" d="${pathData}" fill="${color}" stroke="var(--paper)" stroke-width="1.5" style="cursor:pointer" />`;
      startAngle = endAngle;
    });
  }

  const pieChart = `<div class="mg-pie-wrap" style="text-align:center;margin:12px 0 16px">
    <svg viewBox="0 0 200 200" width="160" height="160" role="img" aria-label="Muscle group volume breakdown chart" style="display:inline-block">
      ${chartSvg}
      <circle id="pie-center-hit" cx="${cx}" cy="${cy}" r="${rInner}" fill="var(--paper)" style="cursor:pointer" />
      <g id="pie-center-text" style="cursor:pointer" data-total-sets="${totalSets}">
        <text id="pie-val" x="${cx}" y="${cy - 4}" text-anchor="middle" font-weight="800" font-size="22" fill="var(--ink)" font-family="inherit">${totalSets}</text>
        <text id="pie-lbl" x="${cx}" y="${cy + 14}" text-anchor="middle" font-size="11" fill="var(--steel)" font-family="inherit">total sets</text>
      </g>
    </svg>
  </div>`;

  const breakdownRows = groupsToDisplay.map(g=>{
    const st=groupStats[g]||{sets:0,reps:0,weightVol:0};
    if(st.sets===0 && !STANDARD_GROUPS.includes(g)) return '';
    const pct=totalSets>0 ? Math.round((st.sets/totalSets)*100) : 0;
    const color=GROUP_COLORS[g] || '#A33B28';
    return `<div class="mg-row" data-group="${hesc(g)}" style="margin-bottom:12px">
      <div style="display:flex;justify-content:space-between;align-items:baseline;margin-bottom:4px;font-size:13px">
        <span style="font-weight:600"><span style="display:inline-block;width:9px;height:9px;border-radius:50%;background:${color};margin-right:6px"></span>${hesc(g)}</span>
        <span style="color:var(--steel);font-size:12px">${st.sets} set${st.sets===1?'':'s'} · ${st.reps} reps (${pct}%)</span>
      </div>
      <div class="mg-bar-bg">
        <div class="mg-bar-fill" style="width:${pct}%;background:${pct>0 ? color : 'var(--line)'}"></div>
      </div>
    </div>`;
  }).join('');

  return pieChart + breakdownRows;
}

const e1rm = (w, r) => {
  w = +w || 0;
  r = +r || 0;
  if (w <= 0 || r <= 0) return 0;
  if (r === 1) return w;
  const epley = w * (1 + r / 30);
  const brzycki = r < 36 ? w * (36 / (37 - r)) : epley;
  return (epley + brzycki) / 2;
};

/* ---------- weight memory ----------
   Weights are remembered per set position, so a ramp like 60/70/80
   comes back as 60/70/80 rather than three sets of 80.            */
function lastPerformance(name){
  for(const s of db.sessions){
    const e=s.ex.find(x=>x.name===name);
    if(e && e.sets.length) return {date:s.date, sets:e.sets};
  }
  return null;
}
function prefill(name,count,reps){
  const prev=lastPerformance(name);
  return Array.from({length:count},(_,i)=>({
    w: prev ? (prev.sets[i]?.w ?? prev.sets[prev.sets.length-1].w ?? '') : '',
    r: reps, done:false
  }));
}

function drawDraft(){
  const dr=db.draft;
  const isEditing = dr.isEdit || db.sessions.some(s=>s.id===dr.id);
  const vol=dr.ex.reduce((a,e)=>a+(isTimed(e.name)?0:e.sets.reduce((b,s)=>b+(+s.w||0)*(+s.r||0),0)),0);
  const doneCount=dr.ex.reduce((a,e)=>a+e.sets.filter(s=>s.done).length,0);
  const total=dr.ex.reduce((a,e)=>a+e.sets.length,0);
  const dayLabel=new Date(dr.date).toLocaleDateString(undefined,{weekday:'long',day:'numeric',month:'long'});
  const isToday=dayKey(dr.date)===dayKey(new Date());
  view().innerHTML=`<h2 style="margin-top:20px">${dr.day}</h2>
    <p class="note" style="margin-bottom:10px">${isToday?'Today':dayLabel}${dr.program?' · '+dr.program:''}</p>
    <div class="stat">
      <div><b>${total}</b><span>sets</span></div>
      <div><b>${Math.round(vol).toLocaleString()}</b><span>${db.unit} volume</span></div>
    </div>
    <div id="exlist"></div>
    <button class="ghost" id="addex" style="width:100%;margin-bottom:14px">Add an exercise</button>
    <div class="row" style="margin:0 0 4px">
      <button class="rust grow" id="finish">${isEditing?'Save changes':'Finish session'}</button>
      <button class="ghost" id="scrap">${isEditing?'Cancel edit':'Discard'}</button>
    </div>`;
  const list=document.getElementById('exlist');
  let dragSrcIdx=null;
  let touchSrcIdx=null;
  let touchTargetIdx=null;
  dr.ex.forEach((ex,idx)=>{
    const finished = ex.sets.filter(s=>s.done).length;
    const complete = finished===ex.sets.length;
    const nowIdx = ex.sets.findIndex(s=>!s.done);   // the set you're on
    const prev = lastPerformance(ex.name);
    const slug = exSlug(ex.name);
    const isExpanded = !!ex.showDiag;

    const card=document.createElement('div');
    card.className='card'+(complete?' done':'');
    card.dataset.idx=idx;
    card.innerHTML=`
      <div class="exhead" style="cursor:pointer" title="Tap to toggle diagram">
        <div style="display:flex;align-items:center;gap:6px">
          <button type="button" class="quiet drag-handle" aria-label="Drag to reorder ${ex.name}" draggable="true" style="cursor:grab;touch-action:none;padding:2px 6px;font-size:16px;color:var(--steel);">⋮⋮</button>
          <h3>${ex.name} <button class="quiet diag-toggle" aria-label="Toggle diagram for ${ex.name}" style="padding:0 4px;font-size:14px;vertical-align:middle;">🖼️</button></h3>
        </div>
        <em>${finished} of ${ex.sets.length} ticked</em>
      </div>
      ${isExpanded ? `
        <div class="ex-diagram">
          <img src="img/exercises/${slug}.svg" alt="${ex.name} diagram" onerror="this.style.display='none'">
        </div>` : ''}
      ${prev?`<p class="note" style="margin:-2px 0 10px">Last time ${fmtDate(prev.date)}: ${prev.sets.map(s=>`${s.w}×${s.r}`).join(', ')}</p>`:''}
      <div class="controls">
        <div class="step" data-k="sets">
          <button data-d="-1" ${ex.sets.length<=1?'disabled':''} aria-label="One set fewer">−</button>
          <span>${ex.sets.length} sets</span>
          <button data-d="1" ${ex.sets.length>=12?'disabled':''} aria-label="One set more">+</button>
        </div>
        <div class="step" data-k="reps">
          <button data-d="-1" ${ex.target<=1?'disabled':''} aria-label="One rep fewer">−</button>
          <span>${ex.target} ${getExMeasurement(ex.name)}</span>
          <button data-d="1" ${ex.target>=50?'disabled':''} aria-label="One rep more">+</button>
        </div>
        <button class="mini dropex" aria-label="Remove ${ex.name} from this session">Drop</button>
      </div>
      <div class="units"><div></div><div>${db.unit}</div><div>${getExMeasurement(ex.name)}</div><div></div></div>
      <div class="sets"></div>`;

    const handle=card.querySelector('.drag-handle');

    card.querySelector('.exhead').onclick=(e)=>{
      if(e.target.closest('.drag-handle')) return;
      ex.showDiag = !ex.showDiag; save(); drawDraft();
    };

    // Desktop HTML5 Drag & Drop
    handle.ondragstart=(e)=>{
      dragSrcIdx=idx;
      if(e.dataTransfer){
        e.dataTransfer.effectAllowed='move';
        e.dataTransfer.setData('text/plain',String(idx));
      }
      card.classList.add('dragging');
    };
    handle.ondragend=()=>{
      dragSrcIdx=null;
      document.querySelectorAll('#exlist .card').forEach(c=>c.classList.remove('dragging','drag-over'));
    };
    card.ondragover=(e)=>{
      e.preventDefault();
      if(e.dataTransfer) e.dataTransfer.dropEffect='move';
      if(dragSrcIdx!==null && dragSrcIdx!==idx){
        card.classList.add('drag-over');
      }
    };
    card.ondragleave=()=>{
      card.classList.remove('drag-over');
    };
    card.ondrop=(e)=>{
      e.preventDefault();
      card.classList.remove('drag-over');
      if(dragSrcIdx!==null && dragSrcIdx!==idx){
        const fromIdx=dragSrcIdx;
        const toIdx=idx;
        dragSrcIdx=null;
        const [moved]=db.draft.ex.splice(fromIdx,1);
        db.draft.ex.splice(toIdx,0,moved);
        save(); drawDraft();
      }
    };

    // Mobile Touch Support
    handle.ontouchstart=()=>{
      touchSrcIdx=idx;
      touchTargetIdx=idx;
      card.classList.add('dragging');
    };
    handle.ontouchmove=(e)=>{
      if(touchSrcIdx===null) return;
      const touch=e.touches && e.touches[0];
      if(!touch) return;
      const elem=document.elementFromPoint(touch.clientX,touch.clientY);
      const targetCard=elem?elem.closest('#exlist .card'):null;
      document.querySelectorAll('#exlist .card').forEach(c=>c.classList.remove('drag-over'));
      if(targetCard && targetCard.dataset.idx!==undefined){
        const tIdx=parseInt(targetCard.dataset.idx,10);
        if(tIdx!==touchSrcIdx){
          touchTargetIdx=tIdx;
          targetCard.classList.add('drag-over');
        }else{
          touchTargetIdx=touchSrcIdx;
        }
      }
    };
    handle.ontouchend=()=>{
      if(touchSrcIdx!==null && touchTargetIdx!==null && touchSrcIdx!==touchTargetIdx){
        const fromIdx=touchSrcIdx;
        const toIdx=touchTargetIdx;
        touchSrcIdx=null;
        touchTargetIdx=null;
        const [moved]=db.draft.ex.splice(fromIdx,1);
        db.draft.ex.splice(toIdx,0,moved);
        save(); drawDraft();
      }else{
        touchSrcIdx=null;
        touchTargetIdx=null;
        document.querySelectorAll('#exlist .card').forEach(c=>c.classList.remove('dragging','drag-over'));
      }
    };
    handle.ontouchcancel=()=>{
      touchSrcIdx=null;
      touchTargetIdx=null;
      document.querySelectorAll('#exlist .card').forEach(c=>c.classList.remove('dragging','drag-over'));
    };
    card.querySelectorAll('.step button').forEach(b=>{
      b.onclick=()=>{
        const d=+b.dataset.d, kind=b.parentElement.dataset.k;
        if(kind==='sets'){
          if(d>0) ex.sets.push({w:ex.sets.at(-1)?.w||'', r:ex.target, done:false});
          else if(ex.sets.length>1) ex.sets.pop();
        } else {
          const cap=isTimed(ex.name)?600:50;
          ex.target=Math.min(cap,Math.max(1,ex.target+d));
          ex.sets.forEach(s=>{ if(!s.done) s.r=ex.target; });  // only reshape sets not yet logged
        }
        save(); drawDraft();
      };
    });
    card.querySelector('.dropex').onclick=()=>{
      if(finished && !confirm(`Drop ${ex.name}? ${finished} logged set${finished>1?'s':''} will be lost.`)) return;
      db.draft.ex=db.draft.ex.filter(x=>x!==ex); save(); drawDraft();
    };

    const sets=card.querySelector('.sets');
    ex.sets.forEach((s,si)=>{
      const r=document.createElement('div');
      r.className='setrow'+(s.done?' ok':'')+(si===nowIdx?' now':'');
      r.innerHTML=`<div class="setno">${si+1}</div>
        <input type="number" inputmode="decimal" step="0.5" value="${s.w}" placeholder="–" aria-label="Weight, set ${si+1}">
        <input type="number" inputmode="numeric" value="${s.r}" aria-label="Reps, set ${si+1}">
        <button class="tick" aria-pressed="${s.done}" aria-label="Set ${si+1} ${s.done?'logged':'not logged'}">✓</button>`;
      const [wIn,rIn]=r.querySelectorAll('input');
      wIn.oninput=e=>{s.w=e.target.value;save();};
      rIn.oninput=e=>{s.r=e.target.value;save();};
      r.querySelector('.tick').onclick=()=>{
        s.done=!s.done; save();
        if(s.done) startTimer(/squat|deadlift|bench|press|row/i.test(ex.name)?180:90);
        else stopTimer();          // untick = mistake, kill the rest clock
        drawDraft();
      };
      sets.appendChild(r);
    });
    list.appendChild(card);
  });
  document.getElementById('addex').onclick=()=>openLibrary(picked=>{
    picked.forEach(x=>db.draft.ex.push({name:x.n,target:x.r,sets:prefill(x.n,x.s,x.r)}));
    save(); drawDraft();
  });
  document.getElementById('finish').onclick=()=>{
    const s=JSON.parse(JSON.stringify(dr));
    delete s.isEdit;
    s.ex=s.ex.filter(e=>e.sets.length);
    if(!s.ex.length){
      if(isEditing){
        db.sessions=db.sessions.filter(x=>x.id!==s.id);
      }
      db.draft=null;save();render();return;
    }
    if(!s.id) s.id='s'+Date.now().toString(36)+Math.random().toString(36).slice(2,7);
    const existingIdx = db.sessions.findIndex(x=>x.id===s.id);
    if(existingIdx >= 0){
      db.sessions[existingIdx] = s;
    } else {
      db.sessions.unshift(s);
    }
    db.sessions.sort((a,b)=>b.date-a.date);     // backdated sessions slot into place
    db.draft=null; stopTimer(); save();
    const d=new Date(s.date);
    calMonth=new Date(d.getFullYear(),d.getMonth(),1);
    calSel=dayKey(s.date); tab='calendar'; render();
  };
  document.getElementById('scrap').onclick=()=>{
    db.draft=null;stopTimer();save();
    if(isEditing){ tab='calendar'; }
    render();
  };
}

function renderBodyweightCard(){
  const bw = db.bodyweight || [];
  let displayHTML = '';
  if(!bw.length){
    displayHTML = `<p class="note">Bodyweight tracking is optional. Log your weight to see your progress chart.</p>`;
  } else if(bw.length === 1){
    const entry = bw[0];
    displayHTML = `
      <div class="stat" style="margin:8px 0 10px">
        <div><b>${entry.w} ${hesc(db.unit)}</b><span>Current weight (${fmtDate(entry.date)})</span></div>
      </div>
      <p class="note">Log more entries to see your trend chart.</p>`;
  } else {
    const latest = bw[bw.length - 1];
    const prev = bw[bw.length - 2];
    const diff = latest.w - prev.w;
    const diffStr = (diff >= 0 ? '+' : '') + diff.toFixed(1) + ' ' + hesc(db.unit);
    
    const W=560, H=210, P={l:38, r:12, t:14, b:26};
    const weights = bw.map(b=>b.w);
    let minW = Math.min(...weights), maxW = Math.max(...weights);
    if(minW === maxW){ minW -= 1; maxW += 1; }
    else { const pad = (maxW - minW) * 0.05; minW -= pad; maxW += pad; }
    
    const x = i => P.l + i * (W - P.l - P.r) / (bw.length - 1);
    const y = w => P.t + (maxW - w) / (maxW - minW) * (H - P.t - P.b);
    const line = bw.map((b, i) => `${i ? 'L' : 'M'}${x(i).toFixed(1)},${y(b.w).toFixed(1)}`).join(' ');
    
    const midW = (minW + maxW) / 2;
    const gridVals = [minW, midW, maxW];

    displayHTML = `
      <div class="stat" style="margin:8px 0 10px;gap:22px">
        <div><b>${latest.w} ${hesc(db.unit)}</b><span>Latest weight (${fmtDate(latest.date)})</span></div>
        <div><b>${diffStr}</b><span>Net change</span></div>
      </div>
      <svg viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="Bodyweight trend over time">
        ${gridVals.map(v => `<line class="grid" x1="${P.l}" x2="${W - P.r}" y1="${y(v)}" y2="${y(v)}"/>
          <text x="4" y="${y(v) + 4}">${v.toFixed(1)}</text>`).join('')}
        <path class="plot" d="${line}"/>
        ${bw.map((b, i) => `<circle class="dot" cx="${x(i).toFixed(1)}" cy="${y(b.w).toFixed(1)}" r="3.5"/>`).join('')}
        <text x="${P.l}" y="${H - 6}">${fmtDate(bw[0].date)}</text>
        <text x="${W - P.r}" y="${H - 6}" text-anchor="end">${fmtDate(bw[bw.length - 1].date)}</text>
      </svg>`;
  }

  const historyHTML = bw.length ? `
    <div style="margin-top:14px;border-top:1px solid var(--line);padding-top:10px">
      <h4 style="font-size:13px;margin:0 0 8px;color:var(--steel);font-weight:700">History</h4>
      ${bw.slice().reverse().map(b => `
        <div class="histline" style="align-items:center">
          <div><b>${b.w} ${hesc(db.unit)}</b> <small>(${fmtDate(b.date)})</small></div>
          <button class="quiet bw-del" data-id="${b.id}" title="Delete entry" style="padding:2px 6px">×</button>
        </div>`).join('')}
    </div>` : '';

  return `
    <div class="card" id="bw-card">
      <div class="exhead">
        <h3>Bodyweight (Optional)</h3>
      </div>
      <form id="bw-form" style="margin:10px 0 14px">
        <div class="row">
          <input type="number" id="bw-val" placeholder="e.g. 75.5" step="0.1" tabindex="0" class="grow" style="max-width:140px">
          <span style="font-weight:600;color:var(--steel)">${hesc(db.unit)}</span>
          <button type="submit">Log weight</button>
        </div>
      </form>
      ${displayHTML}
      ${historyHTML}
    </div>`;
}

function getExercisePeak1RM(name, sessions = db.sessions){
  let peak = 0;
  for(const s of (sessions || [])){
    const matchingExs = (s.ex || []).filter(e => e.name === name);
    for(const ex of matchingExs){
      if(!ex.sets || !ex.sets.length) continue;
      const validSets = ex.sets.filter(x => (+x.w || 0) > 0 && (+x.r || 0) > 0);
      if(!validSets.length) continue;
      const heavySets = validSets.filter(x => (+x.r || 0) <= 5);
      const targetSets = heavySets.length ? heavySets : validSets;
      const best = Math.max(...targetSets.map(x => e1rm(+x.w || 0, +x.r || 0)));
      if(best > peak) peak = best;
    }
  }
  return peak;
}

function computeMuscularBalance(sessions = db.sessions){
  const groups = RADAR_GROUPS;
  const loggedNames = [...new Set((sessions || []).flatMap(s => (s.ex || []).map(e => e.name)))];

  const data = {};
  for(const g of groups){
    const idealRatio = BENCHMARK_BALANCE[g].ratio;
    const benchmark = BENCHMARK_BALANCE[g].benchmark;

    const exNamesInGroup = loggedNames.filter(name => {
      const meta = exMeta(name);
      return meta && meta.g === g;
    });

    let bestNorm1rm = 0;
    let bestRaw1rm = 0;
    let bestExName = null;

    for(const name of exNamesInGroup){
      const coeff = getExCoeff(name);
      if(!coeff || coeff <= 0) continue;

      const raw1rm = getExercisePeak1RM(name, sessions);
      if(raw1rm > 0){
        const norm = raw1rm / coeff;
        if(norm > bestNorm1rm){
          bestNorm1rm = norm;
          bestRaw1rm = raw1rm;
          bestExName = name;
        }
      }
    }

    data[g] = {
      group: g,
      idealRatio,
      ratio: idealRatio,
      benchmark,
      norm1rm: bestNorm1rm,
      raw1rm: bestRaw1rm,
      exercise: bestExName,
      hasData: bestNorm1rm > 0
    };
  }

  const groupsWithData = groups.filter(g => data[g].hasData);
  let scaleFactor = 0;
  if(groupsWithData.length > 0){
    scaleFactor = Math.max(...groupsWithData.map(g => data[g].norm1rm / data[g].idealRatio));
  }

  for(const g of groups){
    const item = data[g];
    item.target1rm = scaleFactor > 0 ? scaleFactor * item.idealRatio : 0;
    item.pct = (item.hasData && item.target1rm > 0)
      ? (item.norm1rm / item.target1rm) * 100
      : 0;
  }

  return {
    groups,
    data,
    scaleFactor,
    groupsWithDataCount: groupsWithData.length
  };
}

function renderRadarSvg(balance, mode, selGroup){
  const W = 360, H = 290, cx = 180, cy = 142, R = 90;
  const groups = balance.groups;
  const n = groups.length;
  const isRel = mode === 'relative';

  const angles = groups.map((_, i) => -Math.PI / 2 + i * (2 * Math.PI / n));

  let levels = [];
  let userR = [];
  let refR = [];

  if(isRel){
    levels = [0.25, 0.50, 0.75, 1.00, 1.25];
    const maxPct = 125;
    userR = groups.map(g => {
      const pct = balance.data[g]?.pct || 0;
      return (Math.min(pct, maxPct) / maxPct) * R;
    });
    refR = groups.map(() => (100 / maxPct) * R);
  } else {
    const maxVal = Math.max(...groups.map(g => Math.max(balance.data[g]?.norm1rm || 0, balance.data[g]?.target1rm || 0)), 10);
    const niceMax = Math.ceil(maxVal / 25) * 25 || 100;
    levels = [0.25, 0.50, 0.75, 1.00].map(lvl => ({ lvl, val: Math.round(niceMax * lvl) }));

    userR = groups.map(g => {
      const val = balance.data[g]?.norm1rm || 0;
      return (Math.min(val, niceMax) / niceMax) * R;
    });

    refR = groups.map(g => {
      const val = balance.data[g]?.target1rm || 0;
      return (Math.min(val, niceMax) / niceMax) * R;
    });
  }

  let svg = `<svg id="radar-chart" viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="Muscular balance radar chart" style="overflow:visible">`;

  // Concentric grid hexagons
  if(isRel){
    levels.forEach(lvl => {
      const r = (lvl / 1.25) * R;
      const pts = angles.map(a => `${(cx + r * Math.cos(a)).toFixed(1)},${(cy + r * Math.sin(a)).toFixed(1)}`).join(' ');
      const isRef = lvl === 1.00;
      svg += `<polygon ${isRef ? 'class="radar-ref-poly"' : ''} points="${pts}" fill="none" stroke="${isRef ? 'var(--steel)' : 'var(--line)'}" stroke-width="${isRef ? '1.5' : '1'}" stroke-dasharray="${isRef ? '4 3' : 'none'}"/>`;
      svg += `<text x="${cx + 4}" y="${(cy - r + 3).toFixed(1)}" font-size="9" fill="var(--steel)">${Math.round(lvl * 100)}%</text>`;
    });
  } else {
    levels.forEach(({ lvl, val }) => {
      const r = lvl * R;
      const pts = angles.map(a => `${(cx + r * Math.cos(a)).toFixed(1)},${(cy + r * Math.sin(a)).toFixed(1)}`).join(' ');
      svg += `<polygon points="${pts}" fill="none" stroke="var(--line)" stroke-width="1"/>`;
      svg += `<text x="${cx + 4}" y="${(cy - r + 3).toFixed(1)}" font-size="9" fill="var(--steel)">${val}</text>`;
    });

    if(balance.scaleFactor > 0){
      const targetPts = groups.map((_, i) => `${(cx + refR[i] * Math.cos(angles[i])).toFixed(1)},${(cy + refR[i] * Math.sin(angles[i])).toFixed(1)}`).join(' ');
      svg += `<polygon class="radar-target-poly" points="${targetPts}" fill="none" stroke="var(--steel)" stroke-width="1.5" stroke-dasharray="4 3" stroke-linejoin="round"/>`;
    }
  }

  // 6 radial axes
  angles.forEach(a => {
    const x2 = cx + R * Math.cos(a);
    const y2 = cy + R * Math.sin(a);
    svg += `<line class="grid" x1="${cx}" y1="${cy}" x2="${x2.toFixed(1)}" y2="${y2.toFixed(1)}" stroke="var(--line)" stroke-width="1"/>`;
  });

  // User polygon
  const hasAnyData = groups.some(g => balance.data[g]?.hasData);
  if(hasAnyData){
    const userPts = groups.map((_, i) => `${(cx + userR[i] * Math.cos(angles[i])).toFixed(1)},${(cy + userR[i] * Math.sin(angles[i])).toFixed(1)}`).join(' ');
    svg += `<polygon class="radar-user-poly" points="${userPts}" fill="rgba(163, 59, 40, 0.22)" stroke="var(--rust)" stroke-width="2.5" stroke-linejoin="round"/>`;
  }

  // Dots and labels
  groups.forEach((g, i) => {
    const a = angles[i];
    const item = balance.data[g];
    const dotX = cx + userR[i] * Math.cos(a);
    const dotY = cy + userR[i] * Math.sin(a);
    const isSel = selGroup === g;

    if(item?.hasData){
      svg += `<circle class="radar-dot" data-group="${hesc(g)}" cx="${dotX.toFixed(1)}" cy="${dotY.toFixed(1)}" r="${isSel ? 6 : 4}" fill="${isSel ? 'var(--ink)' : 'var(--rust)'}" stroke="var(--paper)" stroke-width="1.5" style="cursor:pointer"/>`;
    }

    const rLbl = R + 14;
    let lx = cx + rLbl * Math.cos(a);
    let ly = cy + rLbl * Math.sin(a);
    let anchor = 'middle';

    if(i === 0){ lx = cx; ly = cy - R - 10; anchor = 'middle'; }
    else if(i === 1){ lx = cx + rLbl * Math.cos(a); ly = cy + rLbl * Math.sin(a) + 3; anchor = 'start'; }
    else if(i === 2){ lx = cx + rLbl * Math.cos(a); ly = cy + rLbl * Math.sin(a) + 3; anchor = 'start'; }
    else if(i === 3){ lx = cx; ly = cy + R + 18; anchor = 'middle'; }
    else if(i === 4){ lx = cx + rLbl * Math.cos(a); ly = cy + rLbl * Math.sin(a) + 3; anchor = 'end'; }
    else if(i === 5){ lx = cx + rLbl * Math.cos(a); ly = cy + rLbl * Math.sin(a) + 3; anchor = 'end'; }

    svg += `<text class="radar-label" data-group="${hesc(g)}" x="${lx.toFixed(1)}" y="${ly.toFixed(1)}" text-anchor="${anchor}" font-size="12" font-weight="${isSel ? '800' : '600'}" fill="${isSel ? 'var(--rust)' : 'var(--ink)'}" style="cursor:pointer">${hesc(g)}</text>`;

    const outerX = cx + R * Math.cos(a);
    const outerY = cy + R * Math.sin(a);
    svg += `<circle class="radar-hit" data-group="${hesc(g)}" cx="${outerX.toFixed(1)}" cy="${outerY.toFixed(1)}" r="18" fill="transparent" style="cursor:pointer"/>`;
    if(item?.hasData && (Math.abs(dotX - outerX) > 10 || Math.abs(dotY - outerY) > 10)){
      svg += `<circle class="radar-hit" data-group="${hesc(g)}" cx="${dotX.toFixed(1)}" cy="${dotY.toFixed(1)}" r="18" fill="transparent" style="cursor:pointer"/>`;
    }
  });

  svg += `</svg>`;
  return svg;
}

function renderMuscularBalanceCard(){

  const isRel = progressRadarMode === 'relative';
  const unit = hesc(db.unit);

  let detailHtml = '';
  if(progressRadarSel){
    const item = balance.data[progressRadarSel];
    if(item && item.hasData){
      const pct = Math.round(item.pct);
      const pctNote = (pct === 100) ? '100% balanced' : `${pct}% of balance`;
      const normExtra = (item.norm1rm !== item.raw1rm)
        ? `<span style="color:var(--steel);font-size:12px"> · norm: ${Math.round(item.norm1rm)} ${unit}</span>`
        : '';
      const targetExtra = !isRel
        ? `<span style="color:var(--steel);font-size:12px"> · target: ${Math.round(item.target1rm)} ${unit}</span>`
        : '';
      detailHtml = `<div><b>${item.group}</b>: ${Math.round(item.raw1rm)} ${unit} via ${hesc(item.exercise)} (${pctNote})${normExtra}${targetExtra}</div>`;
    } else if(item){
      const targetStr = item.target1rm > 0 ? ` (target: ${Math.round(item.target1rm)} ${unit})` : '';
      detailHtml = `<div><b>${item.group}</b>: No logged exercises${targetStr} · Benchmark: ${hesc(item.benchmark)}</div>`;
    }
  } else {
    detailHtml = `<span style="color:var(--steel)">Tap any vertex or label to inspect normalized lift &amp; symmetry</span>`;
  }

  let summaryHtml = '';
  const benchPeak1rm = getExercisePeak1RM('Bench press', db.sessions) || getExercisePeak1RM('Barbell Bench Press', db.sessions);
  const rowPeak1rm = getExercisePeak1RM('Barbell row', db.sessions) || getExercisePeak1RM('Pendlay row', db.sessions);

  let pushPullHtml = '';
  if (benchPeak1rm > 0 || rowPeak1rm > 0) {
    let ratioStr = 'N/A';
    let pushPullNote = 'Log both Bench Press and Barbell Row to compare 1:1 push/pull strength.';
    if (benchPeak1rm > 0 && rowPeak1rm > 0) {
      const ratio = rowPeak1rm / benchPeak1rm;
      ratioStr = `1:${ratio.toFixed(1)}`;
      if (ratio >= 0.95 && ratio <= 1.05) {
        pushPullNote = '1:1 optimal shoulder health balance';
      } else if (ratio < 0.95) {
        const defPct = Math.round((1 - ratio) * 100);
        pushPullNote = `${defPct}% pull deficit · increase rowing strength for shoulder health`;
      } else {
        const defPct = Math.round((ratio - 1) * 100);
        pushPullNote = `${defPct}% push deficit · increase bench press strength relative to row`;
      }
    } else if (benchPeak1rm > 0) {
      ratioStr = `Bench: ${Math.round(benchPeak1rm)} ${unit}`;
      pushPullNote = 'Log Barbell Row to assess 1:1 horizontal push/pull balance.';
    } else {
      ratioStr = `Row: ${Math.round(rowPeak1rm)} ${unit}`;
      pushPullNote = 'Log Bench Press to assess 1:1 horizontal push/pull balance.';
    }

    pushPullHtml = `<div class="push-pull-diag" style="margin-top:10px;padding:8px 10px;background:var(--concrete);border-radius:var(--r)">
      <small style="color:var(--steel);text-transform:uppercase;font-size:11px;font-weight:700;letter-spacing:.04em">Horizontal Push/Pull Balance</small>
      <div style="display:flex;justify-content:space-between;align-items:center;margin-top:2px">
        <span style="font-size:13px;font-weight:600">Bench Press vs Barbell Row</span>
        <span style="font-size:13px;font-weight:700;color:var(--ink)">${ratioStr}</span>
      </div>
      <p class="note" style="margin-top:3px">${pushPullNote}</p>
    </div>`;
  }

  if(balance.groupsWithDataCount < 2){
    summaryHtml = `<p class="note" style="text-align:center;margin:6px 0">Log workouts with at least 2 different muscle groups to see symmetry analytics.</p>${pushPullHtml}`;
  } else {
    const groupsWithData = balance.groups.filter(g => balance.data[g].hasData);
    const dominant = groupsWithData.reduce((best, g) => (!best || balance.data[g].pct > best.pct ? balance.data[g] : best), null);
    const lagging = groupsWithData.reduce((worst, g) => (!worst || balance.data[g].pct < worst.pct ? balance.data[g] : worst), null);
    const allBalanced = groupsWithData.every(g => balance.data[g].pct >= 90);

    const domHtml = `<div style="margin-bottom:8px">
      <small style="color:var(--steel);text-transform:uppercase;font-size:11px;font-weight:700;letter-spacing:.04em">Dominant Group</small>
      <div style="font-size:14px;font-weight:600;margin-top:2px">${dominant.group}: ${Math.round(dominant.norm1rm)} ${unit} (${Math.round(dominant.pct)}% balance)</div>
    </div>`;

    if(allBalanced){
      summaryHtml = `<div style="display:flex;flex-direction:column;gap:8px">
        ${domHtml}
        <p class="note" style="color:var(--slate);font-weight:600;margin:4px 0 2px">Well-balanced physique! All muscle groups are within 10% of ideal biomechanical ratios.</p>
      </div>${pushPullHtml}`;
    } else {
      const deficit = Math.max(0, 100 - Math.round(lagging.pct));
      const hint = GROUP_HINTS[lagging.group] || 'Focus on progressive overload for this muscle group.';
      summaryHtml = `<div style="display:flex;flex-direction:column;gap:8px">
        ${domHtml}
        <div>
          <small style="color:var(--rust);text-transform:uppercase;font-size:11px;font-weight:700;letter-spacing:.04em">Lagging Group / Imbalance Alert</small>
          <div style="font-size:14px;font-weight:600;margin-top:2px">${lagging.group}: ${Math.round(lagging.norm1rm)} ${unit} (${Math.round(lagging.pct)}% balance · ${deficit}% deficit)</div>
          <p class="note" style="margin-top:3px">${hint}</p>
        </div>
      </div>${pushPullHtml}`;
    }
  }

  return `<div class="card" id="radar-card">
    <div class="exhead" style="flex-wrap:wrap">
      <h3>Muscular Balance &amp; Symmetry</h3>
      <div style="display:flex;gap:4px">
        <button class="${isRel ? '' : 'ghost'} mini" id="radar-mode-rel" aria-pressed="${isRel}">Relative (% Balance)</button>
        <button class="${!isRel ? '' : 'ghost'} mini" id="radar-mode-abs" aria-pressed="${!isRel}">Absolute (${unit})</button>
      </div>
    </div>
    <p class="note" style="margin-bottom:8px">${isRel ? 'Symmetry relative to your strongest compound lift (ideal balanced = 100%)' : 'Normalized compound 1RM vs biomechanically balanced targets in ' + unit}</p>
    <div id="radar-chart-wrap" style="text-align:center;margin:6px 0">
      ${renderRadarSvg(balance, progressRadarMode, progressRadarSel)}
    </div>
    <div style="display:flex;justify-content:center;gap:18px;margin:2px 0 8px;font-size:12px;color:var(--steel)">
      <span style="display:inline-flex;align-items:center;gap:6px">
        <span style="display:inline-block;width:14px;height:3px;background:var(--rust);border-radius:1px"></span>
        ${isRel ? 'Actual balance' : 'Actual 1RM'}
      </span>
      <span style="display:inline-flex;align-items:center;gap:6px">
        <span style="display:inline-block;width:14px;height:0;border-top:2px dashed var(--steel)"></span>
        ${isRel ? 'Balanced reference (100%)' : 'Balanced target'}
      </span>
    </div>
    <div id="radar-detail" style="margin:8px 0;padding:7px 10px;background:var(--concrete);border-radius:var(--r);font-size:13px;text-align:center;min-height:36px;display:flex;flex-direction:column;justify-content:center">
      ${detailHtml}
    </div>
    <div id="radar-summary" style="margin-top:10px;padding-top:10px;border-top:1px solid var(--line)">
      ${summaryHtml}
    </div>
  </div>`;
}

function bindRadarEvents(){
  const rcEl = document.getElementById('radar-card');
  if(!rcEl) return;

  const relBtn = document.getElementById('radar-mode-rel');
  const absBtn = document.getElementById('radar-mode-abs');
  if(relBtn) relBtn.onclick = () => { progressRadarMode = 'relative'; vProgress(); };
  if(absBtn) absBtn.onclick = () => { progressRadarMode = 'absolute'; vProgress(); };

  const balance = computeMuscularBalance(db.sessions);
  const isRel = progressRadarMode === 'relative';
  const unit = hesc(db.unit);

  const setRadarSelection = (g) => {
    progressRadarSel = (progressRadarSel === g) ? null : g;
    const detEl = rcEl.querySelector('#radar-detail');
    if(detEl){
      if(!progressRadarSel){
        detEl.innerHTML = `<span style="color:var(--steel)">Tap any vertex or label to inspect normalized lift &amp; symmetry</span>`;
      } else {
        const item = balance.data[progressRadarSel];
        if(item && item.hasData){
          const pct = Math.round(item.pct);
          const pctNote = (pct === 100) ? '100% balanced' : `${pct}% of balance`;
          const normExtra = (item.norm1rm !== item.raw1rm)
            ? `<span style="color:var(--steel);font-size:12px"> · norm: ${Math.round(item.norm1rm)} ${unit}</span>`
            : '';
          const targetExtra = !isRel
            ? `<span style="color:var(--steel);font-size:12px"> · target: ${Math.round(item.target1rm)} ${unit}</span>`
            : '';
          detEl.innerHTML = `<div><b>${item.group}</b>: ${Math.round(item.raw1rm)} ${unit} via ${hesc(item.exercise)} (${pctNote})${normExtra}${targetExtra}</div>`;
        } else if(item){
          const targetStr = item.target1rm > 0 ? ` (target: ${Math.round(item.target1rm)} ${unit})` : '';
          detEl.innerHTML = `<div><b>${item.group}</b>: No logged exercises${targetStr} · Benchmark: ${hesc(item.benchmark)}</div>`;
        }
      }
    }
    rcEl.querySelectorAll('.radar-dot').forEach(dot => {
      const sel = dot.dataset.group === progressRadarSel;
      dot.setAttribute('r', sel ? '6' : '4');
      dot.setAttribute('fill', sel ? 'var(--ink)' : 'var(--rust)');
    });
    rcEl.querySelectorAll('.radar-label').forEach(lbl => {
      const sel = lbl.dataset.group === progressRadarSel;
      lbl.setAttribute('font-weight', sel ? '800' : '600');
      lbl.setAttribute('fill', sel ? 'var(--rust)' : 'var(--ink)');
    });
  };

  rcEl.querySelectorAll('.radar-dot, .radar-label, .radar-hit').forEach(el => {
    el.onclick = (e) => {
      e.stopPropagation();
      const g = el.dataset.group;
      if(g) setRadarSelection(g);
    };
  });
}

    return;
  }

  const isWeekly = progressTimeframe === 'weekly';
  const buckets = isWeekly ? getWeeklyBuckets(db.sessions, 8) : getMonthlyBuckets(db.sessions, 6);
  const curr = buckets[buckets.length - 1] || { weightVol: 0, repsVol: 0, workouts: 0, sessions: [] };

  if(!progressEx || !names.includes(progressEx)){

  }

  view().innerHTML=`<h2>Progress</h2>
    ${renderBodyweightCard()}
    <div class="controls" style="margin-bottom:14px">
      <button class="${isWeekly ? '' : 'ghost'}" id="tf-weekly" aria-pressed="${isWeekly}">Weekly</button>
      <button class="${!isWeekly ? '' : 'ghost'}" id="tf-monthly" aria-pressed="${!isWeekly}">Monthly</button>

      <div class="exhead">

        <div style="display:flex;gap:4px">
          <button class="${progressMetric === 'weight' ? '' : 'ghost'} mini" id="m-weight" title="Weight volume">${hesc(db.unit)}</button>
          <button class="${progressMetric === 'reps' ? '' : 'ghost'} mini" id="m-reps" title="Reps volume">Reps</button>
        </div>
      </div>
      <div class="stat" style="gap:16px;flex-wrap:wrap;margin:10px 0 14px">
        <div><b>${Math.round(curr.weightVol).toLocaleString()} ${hesc(db.unit)}</b><span>Weight volume</span></div>
        <div><b>${curr.repsVol.toLocaleString()}</b><span>Total reps</span></div>
        <div><b>${curr.workouts}</b><span>Workouts</span></div>

      <p class="note" style="margin-bottom:12px">Distribution for ${isWeekly ? 'past 8 weeks' : 'past 6 months'}</p>

        ${renderMuscleBreakdown(buckets)}
      </div>
    </div>

    ${renderMuscularBalanceCard()}

    <h2 style="margin-top:22px">Exercise History & 1RM</h2>
    <select id="pick" style="margin:4px 0 14px">${names.map(n=>`<option ${n===progressEx?'selected':''}>${hesc(n)}</option>`).join('')}</select>
    <div id="chart"></div>`;

  bindBodyweightEvents();
  bindRadarEvents();

  document.getElementById('tf-weekly').onclick = () => { progressTimeframe = 'weekly'; vProgress(); };
  document.getElementById('tf-monthly').onclick = () => { progressTimeframe = 'monthly'; vProgress(); };
  document.getElementById('m-weight').onclick = () => { progressMetric = 'weight'; vProgress(); };
  document.getElementById('m-reps').onclick = () => { progressMetric = 'reps'; vProgress(); };

  const pickEl = document.getElementById('pick');
  if (pickEl) {
    pickEl.onchange = () => { progressEx = pickEl.value; chartFor(progressEx); };
    chartFor(pickEl.value);
  }

  // Interactive Pie Chart handling
  const mbEl = document.getElementById('muscle-breakdown');
  if (mbEl) {
    let selectedGroup = null;

    const resetPie = () => {
      selectedGroup = null;
      const pieVal = mbEl.querySelector('#pie-val');
      const pieLbl = mbEl.querySelector('#pie-lbl');
      const pieTextGroup = mbEl.querySelector('#pie-center-text');
      const totalSets = pieTextGroup ? pieTextGroup.dataset.totalSets : '';

      if (pieVal) pieVal.textContent = totalSets;
      if (pieLbl) pieLbl.textContent = 'total sets';

      mbEl.querySelectorAll('.pie-slice').forEach(el => {
        el.classList.remove('selected');
        el.style.opacity = '1';
        el.style.stroke = el.tagName.toLowerCase() === 'circle' ? '' : 'var(--paper)';
        el.style.strokeWidth = el.tagName.toLowerCase() === 'circle' ? '' : '1.5';
      });

      mbEl.querySelectorAll('.mg-row').forEach(row => {
        row.classList.remove('selected');
        row.style.opacity = '1';
        row.style.fontWeight = '';
      });
    };

    mbEl.querySelectorAll('.pie-slice').forEach(slice => {
      slice.onclick = (e) => {
        e.stopPropagation();
        const g = slice.dataset.group;
        const pct = slice.dataset.pct;
        const sets = +slice.dataset.sets;

        if (selectedGroup === g) {
          resetPie();
        } else {
          selectedGroup = g;
          const pieVal = mbEl.querySelector('#pie-val');
          const pieLbl = mbEl.querySelector('#pie-lbl');
          if (pieVal) pieVal.textContent = `${pct}%`;
          if (pieLbl) pieLbl.textContent = `${g} · ${sets} set${sets === 1 ? '' : 's'}`;

          mbEl.querySelectorAll('.pie-slice').forEach(el => {
            if (el.dataset.group === g) {
              el.classList.add('selected');
              el.style.opacity = '1';
              el.style.stroke = 'var(--ink)';
              el.style.strokeWidth = '3';
            } else {
              el.classList.remove('selected');
              el.style.opacity = '0.35';
              el.style.stroke = el.tagName.toLowerCase() === 'circle' ? '' : 'var(--paper)';
              el.style.strokeWidth = el.tagName.toLowerCase() === 'circle' ? '' : '1.5';
            }
          });

          mbEl.querySelectorAll('.mg-row').forEach(row => {
            if (row.dataset.group === g) {
              row.classList.add('selected');
              row.style.opacity = '1';
              row.style.fontWeight = '600';
            } else {
              row.classList.remove('selected');
              row.style.opacity = '0.4';
              row.style.fontWeight = '';
            }
          });
        }
      };
    });

    const centerHit = mbEl.querySelector('#pie-center-hit');
    const centerText = mbEl.querySelector('#pie-center-text');
    if (centerHit) centerHit.onclick = (e) => { e.stopPropagation(); resetPie(); };
    if (centerText) centerText.onclick = (e) => { e.stopPropagation(); resetPie(); };
  }
}

function chartFor(name){
  const pts=db.sessions.slice().reverse().flatMap(s=>{
    const ex=(s.ex||[]).find(e=>e.name===name); if(!ex || !ex.sets || !ex.sets.length) return [];
    const validSets=ex.sets.filter(x=> (+x.w||0) > 0 && (+x.r||0) > 0);
    if(!validSets.length) return [];
    const heavySets=validSets.filter(x=> (+x.r||0) <= 5);
    const targetSets=heavySets.length ? heavySets : validSets;
    const best=Math.max(...targetSets.map(x=>e1rm(+x.w||0,+x.r||0)));
    const isHeavyPeak=heavySets.length > 0;
    const vol=isTimed(name) ? 0 : ex.sets.reduce((a,x)=>a+(+x.w||0)*(+x.r||0),0);
    return [{d:s.date,v:best,vol,isHeavyPeak}];
  });
  const box=document.getElementById('chart');
  if(!box) return;

  if(!pts.length){
    box.innerHTML=`<div class="empty">No logged sessions found for ${hesc(name)}.</div>`;
    return;
  }

  const noteHTML = `<p class="note">Estimated 1RM: Epley & Brzycki average with heavy-set priority (sets ≤5 reps prioritized over higher reps), best set of each session, in ${hesc(db.unit)}.</p>`;

  if(pts.length===1){
    const p=pts[0];
    box.innerHTML=`<div class="card">
      <div class="exhead"><h3>Estimated 1-rep max</h3><em>1 session logged</em></div>
      <div class="stat" style="margin:8px 0 10px">
        <div><b>${Math.round(p.v)} ${hesc(db.unit)}</b><span>Best 1RM (Epley + Brzycki)</span></div>
      </div>
      <p class="note">Trend line will appear once you log a second session with this exercise.</p>
    </div>
    <div class="card"><h3 style="margin-bottom:8px">Session volume</h3>
      <div class="histline">
        <span>${fmtDate(p.d)}</span><small>${Math.round(p.vol).toLocaleString()} ${hesc(db.unit)}</small>
      </div>
    </div>`;
    return;
  }

  const overallPeak = pts.reduce((max, p) => p.v > max.v ? p : max, pts[0]);

  const W=560,H=210,P={l:38,r:12,t:14,b:26};
  const vs=pts.map(p=>p.v), lo=Math.min(...vs)*0.94, hi=Math.max(...vs)*1.04||1;
  const x=i=>P.l+i*(W-P.l-P.r)/(pts.length-1);
  const y=v=>P.t+(hi-v)/((hi-lo)||1)*(H-P.t-P.b);
  const line=pts.map((p,i)=>`${i?'L':'M'}${x(i).toFixed(1)},${y(p.v).toFixed(1)}`).join(' ');
  const gain=pts[0].v>0 ? (pts.at(-1).v/pts[0].v-1)*100 : 0;
  box.innerHTML=`<div class="card">
      <div class="exhead"><h3>Estimated 1-rep max</h3>
        <em style="color:${gain>=0?'var(--slate)':'var(--steel)'}">${gain>=0?'+':''}${gain.toFixed(1)}% overall</em></div>
      <div class="stat" style="margin:8px 0 10px">
        <div><b>${Math.round(overallPeak.v)} ${hesc(db.unit)}</b><span>Peak 1RM (${overallPeak.isHeavyPeak ? '≤5 reps' : '>5 reps'})</span></div>
      </div>
      <svg viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="Estimated one-rep max over time">
        ${[lo,(lo+hi)/2,hi].map(t=>`<line class="grid" x1="${P.l}" x2="${W-P.r}" y1="${y(t)}" y2="${y(t)}"/>
          <text x="4" y="${y(t)+4}">${Math.round(t)}</text>`).join('')}
        <path class="plot" d="${line}"/>
        ${pts.map((p,i)=>`<circle class="dot" cx="${x(i).toFixed(1)}" cy="${y(p.v).toFixed(1)}" r="3.5"/>`).join('')}
        <text x="${P.l}" y="${H-6}">${fmtDate(pts[0].d)}</text>
        <text x="${W-P.r}" y="${H-6}" text-anchor="end">${fmtDate(pts.at(-1).d)}</text>
      </svg>
      ${noteHTML}
    </div>
    <div class="card"><h3 style="margin-bottom:8px">Session volume</h3>
      ${pts.slice().reverse().slice(0,6).map(p=>`<div class="histline">
        <span>${fmtDate(p.d)}</span><small>${Math.round(p.vol).toLocaleString()} ${hesc(db.unit)}</small></div>`).join('')}
    </div>`;
}

  document.getElementById('exp').onclick=()=>{
    const name=profiles.find(p=>p.id===me).name;
    const blob=new Blob([JSON.stringify({profile:name,exported:Date.now(),data:db},null,2)],{type:'application/json'});
    const a=document.createElement('a');
    a.href=URL.createObjectURL(blob);
    a.download=`ferrodastiro-${name.toLowerCase()}-${new Date().toISOString().slice(0,10)}.json`;
    a.click(); URL.revokeObjectURL(a.href);
  };
  document.getElementById('imp').onclick=()=>document.getElementById('file').click();
  document.getElementById('file').onchange=async e=>{
    const f=e.target.files[0]; if(!f) return;
    try{
      const parsed=JSON.parse(await f.text());
      const incoming=parsed.data||parsed;
      if(!Array.isArray(incoming.sessions)) throw new Error('shape');
      if(confirm(`Replace this profile's log with ${incoming.sessions.length} imported sessions?`)){
        db=Object.assign(BLANK(),incoming);
        db.sessions.forEach(s=>{ if(!s.id) s.id='s'+Math.random().toString(36).slice(2,9); });
        save(); render();
      }
    }catch(err){ alert("That file isn't a FerroDaStiro export."); }
  };
  document.getElementById('del').onclick=()=>{
    const name=profiles.find(p=>p.id===me).name;
    if(!confirm(`Delete ${name} and all their sessions? This cannot be undone.`)) return;
    localStorage.removeItem(dkey(me));
    idbDel(dkey(me));
    profiles=profiles.filter(p=>p.id!==me); writeJSON(PKEY,profiles);
    localStorage.removeItem(AKEY); idbDel(AKEY); loadProfiles();
    if(me){loadData();} else {db=BLANK();}
    tab='train'; render();
  };
}

/* --- Program editor --- */
function vEditor(){
  const ed=editing;
  const mine=!!db.custom[ed.id];
  view().innerHTML=`
    <h2 style="margin-top:20px">${mine?'Edit program':'New program'}</h2>
    <div class="card">
      <input id="pname" placeholder="Program name" value="${ed.name.replace(/"/g,'&quot;')}" maxlength="34">
      <input id="pnote" placeholder="Short description (optional)" value="${(ed.note||'').replace(/"/g,'&quot;')}"
        maxlength="46" style="margin-top:8px">
    </div>
    <div id="days"></div>
    <button class="ghost" id="addday" style="width:100%;margin-bottom:14px">Add a day</button>
    <div class="row">
      <button class="rust grow" id="savep">Save program</button>
      <button class="ghost" id="cancelp">Cancel</button>
    </div>
    ${mine?`<button class="danger" id="delp" style="margin-top:10px">Delete this program</button>`:''}`;

  document.getElementById('pname').oninput=e=>ed.name=e.target.value;
  document.getElementById('pnote').oninput=e=>ed.note=e.target.value;

  const box=document.getElementById('days');
  ed.days.forEach((day,di)=>{
    const card=document.createElement('div'); card.className='card';
    card.innerHTML=`
      <div class="row" style="margin-bottom:8px">
        <input class="dayname grow" value="${day.name.replace(/"/g,'&quot;')}" maxlength="24" aria-label="Day name">
        <button class="mini rmday" aria-label="Remove day">Remove</button>
      </div>
      <div class="exlines"></div>
      <button class="quiet addex" style="margin-top:6px">+ Add exercise</button>`;

    card.querySelector('.dayname').oninput=e=>day.name=e.target.value;
    card.querySelector('.rmday').onclick=()=>{
      if(ed.days.length<=1){ alert('A program needs at least one day.'); return; }
      ed.days.splice(di,1); vEditor(); };

    const lines=card.querySelector('.exlines');
    if(!day.ex.length) lines.innerHTML=`<div class="empty" style="padding:14px">No exercises yet.</div>`;
    day.ex.forEach((e,ei)=>{
      const [name,sets,reps]=e;
      const row=document.createElement('div'); row.className='exline';
      const mUnit=getExMeasurement(name);
      const unitLabel=mUnit==='min'?'Minutes':(mUnit==='sec'?'Seconds':'Reps');
      const unitAbbr=mUnit==='min'?'min':(mUnit==='sec'?'s':'reps');
      row.innerHTML=`<span class="nm">${name}</span>
        <input type="number" min="1" max="12" value="${sets}" aria-label="Sets">
        <span class="x">×</span>
        <input type="number" min="1" max="600" value="${reps}" aria-label="${unitLabel}">
        <span class="x">${unitAbbr}</span>
        <button class="mini up" aria-label="Move up" ${ei===0?'disabled':''}>↑</button>
        <button class="mini rm" aria-label="Remove exercise">×</button>`;
      const [sIn,rIn]=row.querySelectorAll('input');
      sIn.oninput=ev=>e[1]=Math.min(12,Math.max(1,+ev.target.value||1));
      rIn.oninput=ev=>e[2]=Math.min(600,Math.max(1,+ev.target.value||1));
      row.querySelector('.up').onclick=()=>{ [day.ex[ei-1],day.ex[ei]]=[day.ex[ei],day.ex[ei-1]]; vEditor(); };
      row.querySelector('.rm').onclick=()=>{ day.ex.splice(ei,1); vEditor(); };
      lines.appendChild(row);
    });

    card.querySelector('.addex').onclick=()=>openLibrary(picked=>{
      picked.forEach(x=>day.ex.push([x.n,x.s,x.r])); vEditor(); });
    box.appendChild(card);
  });

  document.getElementById('addday').onclick=()=>{
    ed.days.push({name:'Day '+(ed.days.length+1),ex:[]}); vEditor(); };

  document.getElementById('savep').onclick=()=>{
    if(!ed.name.trim()){ alert('Give the program a name first.'); return; }
    if(ed.days.every(d=>!d.ex.length)){ alert('Add at least one exercise before saving.'); return; }
    const clean={name:ed.name.trim(), note:ed.note?.trim()||ed.days.length+' days',
      days:ed.days.filter(d=>d.ex.length).map(d=>({name:d.name.trim()||'Day',ex:d.ex}))};
    db.custom[ed.id]=clean; db.programId=ed.id; editing=null; save();
    calMonth=(()=>{const d=new Date();d.setDate(1);d.setHours(0,0,0,0);return d;})();
    calSel=dayKey(new Date()); tab='calendar'; render();
  };
  document.getElementById('cancelp').onclick=()=>{ editing=null; render(); };
  const dp=document.getElementById('delp');
  if(dp) dp.onclick=()=>{
    if(!confirm(`Delete "${ed.name}"? Sessions you already logged with it are kept.`)) return;
    delete db.custom[ed.id];
    if(db.programId===ed.id) db.programId='ul';
    editing=null; save(); render();
  };
}

/* --- Exercise library --- */
function openLibrary(onAdd, extra){
  screen=Object.assign({type:'lib', onAdd, group:'All', q:'', picked:[]}, extra||{});
  render(); window.scrollTo(0,0);
}

function sLibrary(){
  const st=screen;
  // If creating or editing mode, show exercise form inline
  if(st.creating || st.editingEx){
    const isEdit = !!st.editingEx;
    const isCustom = isEdit && !!(db.customEx||[]).find(c=>c.n===st.editingEx);
    const mType = st.cxm || 'reps';
    view().innerHTML=`
      <h2>${isEdit ? 'Edit exercise' : 'New exercise'}</h2>
      <div class="card" style="margin-top:10px">
        <div style="margin-bottom:12px">
          <label style="font-size:13px;font-weight:600;display:block;margin-bottom:4px">Exercise name</label>
          <input id="cxname" placeholder="e.g. Kettlebell press" maxlength="60" autocomplete="off"
            value="${(st.cxname||'').replace(/"/g,'&quot;')}">
        </div>
        <div style="margin-bottom:12px">
          <label style="font-size:13px;font-weight:600;display:block;margin-bottom:6px">Muscle group</label>
          <div class="chips" id="cxchips" style="flex-wrap:wrap"></div>
        </div>
        <div style="margin-bottom:12px">
          <label style="font-size:13px;font-weight:600;display:block;margin-bottom:6px">Measurement</label>
          <div style="display:flex;gap:8px">
            <button id="cxreps" class="${mType==='reps'?'rust':'ghost'}" style="flex:1">Reps</button>
            <button id="cxsecs" class="${mType==='sec'?'rust':'ghost'}" style="flex:1">Seconds</button>
            <button id="cxmin" class="${mType==='min'?'rust':'ghost'}" style="flex:1">Minutes</button>
          </div>
        </div>
        <div style="margin-bottom:14px;display:flex;align-items:center;gap:10px">
          <div style="flex:1">
            <label style="font-size:13px;font-weight:600;display:block;margin-bottom:4px">Default sets</label>
            <input id="cxsets" type="number" inputmode="numeric" min="1" max="12" value="${st.cxsets||3}">
          </div>
          <div style="flex:1">
            <label style="font-size:13px;font-weight:600;display:block;margin-bottom:4px">${mType==='min'?'Minutes':(mType==='sec'?'Seconds':'Reps')}</label>
            <input id="cxrepsv" type="number" inputmode="numeric" min="1" max="600" value="${st.cxrepsv||10}">
          </div>
        </div>
        <div class="row" style="gap:8px">
          <button class="rust grow" id="cxsave">${isEdit ? 'Save exercise' : 'Create exercise'}</button>
          <button class="ghost" id="cxcancel">Cancel</button>
          ${isCustom ? '<button class="danger" id="cxdel">Delete exercise</button>' : ''}
        </div>
      </div>`;

    const cxChips=document.getElementById('cxchips');
    GROUPS.forEach(g=>{
      const c=document.createElement('button'); c.className='chip'; c.textContent=g;
      c.setAttribute('aria-pressed',String(g===(st.cxgroup||GROUPS[0])));
      c.onclick=()=>{ st.cxgroup=g; sLibrary(); };
      cxChips.appendChild(c);
    });

    document.getElementById('cxname').oninput=e=>{ st.cxname=e.target.value; };
    document.getElementById('cxsets').oninput=e=>{ st.cxsets=Math.min(12,Math.max(1,+e.target.value||1)); };
    document.getElementById('cxrepsv').oninput=e=>{ st.cxrepsv=Math.min(600,Math.max(1,+e.target.value||1)); };
    document.getElementById('cxreps').onclick=()=>{ st.cxm='reps'; sLibrary(); };
    document.getElementById('cxsecs').onclick=()=>{ st.cxm='sec'; sLibrary(); };
    document.getElementById('cxmin').onclick=()=>{ st.cxm='min'; sLibrary(); };
    document.getElementById('cxcancel').onclick=()=>{ st.creating=false; st.editingEx=null; sLibrary(); };

    const delBtn = document.getElementById('cxdel');
    if (delBtn) {
      delBtn.onclick = () => {
        const oldName = st.editingEx;
        db.customEx = (db.customEx || []).filter(c => c.n !== oldName);
        save();
        st.editingEx = null;
        st.creating = false;
        sLibrary();
      };
    }

    document.getElementById('cxsave').onclick=()=>{
      const name=(st.cxname||'').trim();
      if(!name){ alert('Please enter an exercise name.'); document.getElementById('cxname').focus(); return; }

      const oldName = st.editingEx;
      const isEditEx = !!oldName;

      if(!isEditEx || oldName.toLowerCase() !== name.toLowerCase()){
        if(allExercises().some(e=>e.n.toLowerCase()===name.toLowerCase() && e.n !== oldName)){
          alert('An exercise with that name already exists.'); document.getElementById('cxname').focus(); return;
        }
      }

      const mTypeSel = st.cxm || 'reps';
      const meta = isEditEx ? exMeta(oldName) : null;
      const updated = {
        n: name,
        g: st.cxgroup || GROUPS[0],
        s: +(st.cxsets || 3),
        r: +(st.cxrepsv || 10),
        m: mTypeSel
      };
      if (mTypeSel === 'sec') updated.t = 1;
      else if (mTypeSel === 'min') updated.t = 'min';
      if (meta && meta.coeff !== undefined) updated.coeff = meta.coeff;

      if(isEditEx){
        const customIdx = (db.customEx||[]).findIndex(c => c.n === oldName);
        if(customIdx >= 0){
          db.customEx[customIdx] = updated;
        } else {
          const origName = EXERCISES.find(b => b.n === oldName || (db.exEdits && db.exEdits[b.n] && db.exEdits[b.n].n === oldName))?.n || oldName;
          db.exEdits = db.exEdits || {};
          db.exEdits[origName] = updated;
        }

        if(oldName !== name){
          if(db.custom){
            Object.values(db.custom).forEach(p => {
              (p.days||[]).forEach(d => {
                (d.ex||[]).forEach(tuple => {
                  if(tuple[0] === oldName) tuple[0] = name;
                });
              });
            });
          }
          if(db.draft && db.draft.ex){
            db.draft.ex.forEach(e => {
              if(e.name === oldName) e.name = name;
            });
          }
          if(db.sessions){
            db.sessions.forEach(s => {
              (s.ex||[]).forEach(e => {
                if(e.name === oldName) e.name = name;
              });
            });
          }
          if(st.picked){
            const pIdx = st.picked.indexOf(oldName);
            if(pIdx >= 0) st.picked[pIdx] = name;
          }
          if(progressEx === oldName) progressEx = name;
        }
      } else {
        db.customEx = db.customEx || [];
        db.customEx.push(updated);
      }

      save();
      st.creating = false;
      st.editingEx = null;
      st.cxname = '';
      st.q = name.toLowerCase();
      sLibrary();
    };
    // Focus name input
    const ni=document.getElementById('cxname'); if(ni && !ni.value) ni.focus();
    return;
  }

  const allEx=allExercises();
  view().innerHTML=`
    <h2>Exercise library</h2>
    <div class="row" style="margin-top:6px;gap:8px">
      <input id="q" placeholder="Search ${allEx.length} exercises" autocomplete="off"
        value="${st.q.replace(/"/g,'&quot;')}" style="margin-top:0;flex:1">
      <button class="ghost" id="newex" style="white-space:nowrap;padding:9px 12px">+ New</button>
    </div>
    <div class="chips" id="chips" style="margin-top:10px"></div>
    <div class="row" style="margin:10px 0 6px;position:sticky;top:0;z-index:5;background:var(--concrete);padding:6px 0">
      <button class="rust grow" id="addsel" ${st.picked.length?'':'disabled'}>${
        st.picked.length?'Add '+st.picked.length:'Add'}</button>
      <button class="ghost" id="cancel">Cancel</button>
    </div>
    <div id="lib"></div>`;

  const chips=document.getElementById('chips');
  ['All',...GROUPS].forEach(g=>{
    const c=document.createElement('button'); c.className='chip'; c.textContent=g;
    c.setAttribute('aria-pressed',String(g===st.group));
    c.onclick=()=>{ st.group=g; sLibrary(); };
    chips.appendChild(c);
  });

  const lib=document.getElementById('lib');
  const qTokens=(st.q||'').toLowerCase().trim().split(/\s+/).filter(Boolean);
  const list=allEx.filter(e=>(st.group==='All'||e.g===st.group) && (!qTokens.length||qTokens.every(t=>e.n.toLowerCase().includes(t))));
  if(!list.length){
    lib.innerHTML=`<div class="empty">Nothing matches that search.</div>`;
  }
  st.showDiag = st.showDiag || {};
  list.forEach(e=>{
    const on=st.picked.includes(e.n);
    const slug=exSlug(e.n);
    const isExpanded=!!st.showDiag[e.n];
    const isCustom=!!(db.customEx||[]).find(c=>c.n===e.n);
    const mUnit=getExMeasurement(e);
    const unitStr=mUnit==='min'?' min':(mUnit==='sec'?' sec':'');
    const row=document.createElement('div');
    row.className='libitem-row';
    row.style.borderBottom='1px solid var(--line)';
    row.innerHTML=`
      <div style="display:flex;align-items:center;gap:6px;width:100%;">
        <button class="libitem" aria-pressed="${on}" style="border-bottom:none;flex:1;display:flex;align-items:center;gap:10px;text-align:left;padding:10px 2px;">
          <img src="img/exercises/${slug}.svg" alt="${hesc(e.n)} diagram" onerror="this.style.display='none'" class="ex-thumb">
          <span style="flex:1;min-width:0">${hesc(e.n)}${isCustom?' <span style="font-size:10px;color:var(--steel);background:var(--line);border-radius:3px;padding:1px 5px;font-weight:600">custom</span>':''}<small style="color:var(--steel);font-size:12px;display:block;font-weight:400">${hesc(e.g)} · ${hesc(e.s)}×${hesc(e.r)}${unitStr}</small></span>
          <span style="font-size:15px">${on?'✓':'+'}</span>
        </button>
        <button class="quiet ex-edit" aria-label="Edit ${hesc(e.n)}" style="padding:6px 8px;flex-shrink:0;font-size:14px;">✏️</button>
        <button class="quiet diag-toggle" aria-label="Toggle diagram for ${hesc(e.n)}" style="padding:6px 8px;flex-shrink:0;font-size:14px;">🖼️</button>
      </div>
      ${isExpanded ? `
        <div class="ex-diagram">
          <img src="img/exercises/${slug}.svg" alt="${hesc(e.n)} diagram" onerror="this.style.display='none'">
        </div>` : ''}
    `;
    row.querySelector('.libitem').onclick=()=>{ on ? st.picked.splice(st.picked.indexOf(e.n),1) : st.picked.push(e.n); sLibrary(); };
    row.querySelector('.ex-edit').onclick=(ev)=>{
      ev.stopPropagation();
      const meta = exMeta(e.n);
      st.creating = false;
      st.editingEx = e.n;
      st.cxname = e.n;
      st.cxgroup = meta?.g || e.g;
      st.cxm = getExMeasurement(meta || e);
      st.cxsets = meta?.s || e.s || 3;
      st.cxrepsv = meta?.r || e.r || 10;
      sLibrary();
    };
    row.querySelector('.diag-toggle').onclick=()=>{ st.showDiag[e.n] = !st.showDiag[e.n]; sLibrary(); };
    lib.appendChild(row);
  });

  const q=document.getElementById('q');
  q.oninput=ev=>{ st.q=ev.target.value; const pos=ev.target.selectionStart;
    sLibrary(); const nq=document.getElementById('q'); if(nq){ nq.focus(); nq.setSelectionRange(pos,pos); } };
  document.getElementById('newex').onclick=()=>{ st.creating=true; st.editingEx=null; st.cxname=st.q?st.q:''; st.cxgroup=GROUPS[0]; st.cxm='reps'; st.cxsets=3; st.cxrepsv=10; sLibrary(); };
  document.getElementById('cancel').onclick=closeScreen;
  document.getElementById('addsel').onclick=()=>{
    const chosen=st.picked.map(n=>allExercises().find(e=>e.n===n)).filter(Boolean);
    const cb=st.onAdd; screen=null; cb(chosen);
  };
}

/* --- Calendar --- */
function vCalendar(){
  const byDay={};
  db.sessions.forEach(s=>{ const k=dayKey(s.date); (byDay[k]=byDay[k]||[]).push(s); });

  const y=calMonth.getFullYear(), m=calMonth.getMonth();
  const first=new Date(y,m,1), daysIn=new Date(y,m+1,0).getDate();
  const lead=(first.getDay()+6)%7;                       // Monday-first week
  const todayK=dayKey(new Date());
  const monthSessions=db.sessions.filter(s=>{const d=new Date(s.date);return d.getFullYear()===y&&d.getMonth()===m;});
  const monthVol=monthSessions.reduce((a,s)=>a+s.ex.reduce((b,e)=>b+(isTimed(e.name)?0:e.sets.reduce((c,x)=>c+(+x.w||0)*(+x.r||0),0)),0),0);

  view().innerHTML=`
    <div class="monthbar">
      <button id="prev" aria-label="Previous month">‹</button>
      <b>${calMonth.toLocaleDateString(undefined,{month:'long',year:'numeric'})}</b>
      <button id="next" aria-label="Next month">›</button>
    </div>
    <div class="cal" id="grid"></div>
    <div class="stat" style="margin-top:18px">
      <div><b>${monthSessions.length}</b><span>sessions this month</span></div>
      <div><b>${Math.round(monthVol).toLocaleString()}</b><span>${db.unit} lifted</span></div>
    </div>
    <div id="daydetail"></div>`;

  const grid=document.getElementById('grid');
  document.getElementById('prev').onclick=()=>{calMonth=new Date(y,m-1,1);calSel=null;vCalendar();};
  document.getElementById('next').onclick=()=>{calMonth=new Date(y,m+1,1);calSel=null;vCalendar();};
  ['M','T','W','T','F','S','S'].forEach(d=>{
    const h=document.createElement('div'); h.className='dow'; h.textContent=d; grid.appendChild(h); });
  for(let i=0;i<lead;i++){ const b=document.createElement('div'); b.className='cell blank'; grid.appendChild(b); }
  for(let d=1;d<=daysIn;d++){
    const k=dayKey(new Date(y,m,d)), ss=byDay[k];
    const c=document.createElement('button');
    c.className='cell'+(ss?' has':'')+(k===todayK?' today':'')+(k===calSel?' sel':'');
    c.innerHTML=`<span>${d}</span>${ss?`<small>${ss[0].day}</small>`:''}`;
    c.onclick=()=>{ calSel=k; vCalendar(); };
    grid.appendChild(c);
  }

  const box=document.getElementById('daydetail');
  const selMs = calSel ? noon(new Date(calSel+'T12:00:00')) : null;
  const shown = calSel ? (byDay[calSel]||[]) : monthSessions;

  let out='';
  if(calSel){
    const label=new Date(selMs).toLocaleDateString(undefined,{weekday:'long',day:'numeric',month:'long'});
    const draftHere = db.draft && dayKey(db.draft.date)===calSel;
    const future = selMs > noon(new Date());
    out += `<div class="card">
      <h3 style="margin-bottom:2px">${label}</h3>
      <p class="note" style="margin-bottom:12px">${
        draftHere ? 'A workout is open for this day.'
        : shown.length ? `${shown.length} session${shown.length>1?'s':''} logged.`
        : future ? 'Nothing logged. You can plan this day ahead.'
        : 'Nothing logged.'}</p>
      <button class="${draftHere?'rust':'ghost'}" id="startHere" style="width:100%">${
        draftHere ? 'Continue this workout' : shown.length ? 'Log another workout' : 'Start a workout'}</button>
    </div>`;
  }
  out += shown.map(s=>sessionCard(s)).join('');
  if(!calSel && !shown.length) out=`<div class="empty">No sessions this month yet.</div>`;

  /* One assignment, then wire everything. Writing to innerHTML a second
     time would re-parse the panel and throw away its click handler. */
  box.innerHTML=out;

  const startBtn=document.getElementById('startHere');
  if(startBtn) startBtn.onclick=()=>{
    if(db.draft && dayKey(db.draft.date)===calSel){ tab='train'; render(); }
    else openStart(selMs);
  };
  box.querySelectorAll('[data-edit]').forEach(b=>{
    b.onclick=()=>{
      const id=b.dataset.edit;
      const s=db.sessions.find(x=>x.id===id);
      if(!s) return;
      if(db.draft && !confirm('A workout is already open. Discard it and edit this one?')) return;
      db.draft={ ...JSON.parse(JSON.stringify(s)), isEdit:true };
      save(); tab='train'; render();
    };
  });
  box.querySelectorAll('[data-del]').forEach(b=>{
    b.onclick=()=>{
      const id=b.dataset.del;
      if(!confirm('Delete this logged session? This cannot be undone.')) return;
      db.sessions=db.sessions.filter(s=>s.id!==id); save(); vCalendar();
    };
  });
}

function sessionCard(s){
  if(!s.id) s.id='s'+Math.random().toString(36).slice(2,9);
  const vol=s.ex.reduce((a,e)=>a+(isTimed(e.name)?0:e.sets.reduce((b,x)=>b+(+x.w||0)*(+x.r||0),0)),0);
  return `<div class="card">
    <div class="exhead"><h3>${s.day}</h3>
      <em>${new Date(s.date).toLocaleDateString(undefined,{weekday:'short',day:'numeric',month:'short'})}</em></div>
    ${s.ex.map(e=>`<div class="histline"><span>${e.name}</span>
      <small>${e.sets.map(x=>`${x.w}×${x.r}`).join('  ')}</small></div>`).join('')}
    <div class="row" style="margin-top:10px">
      <p class="note grow" style="margin:0">${s.program||''}${s.program?' · ':''}${Math.round(vol).toLocaleString()} ${db.unit} volume</p>
      <button class="mini" data-edit="${s.id}">Edit</button>
      <button class="mini" data-del="${s.id}">Delete</button>
    </div>
  </div>`;
}

// Export storage & IndexedDB helpers for testability and inspection
window.getIDB = getIDB;
window.idbPut = idbPut;
window.idbDel = idbDel;
window.idbGetAll = idbGetAll;
window.autoResurrect = autoResurrect;
window.checkPersistence = checkPersistence;
window.requestPersistence = requestPersistence;
window.storageStatus = storageStatus;

/* ---------- boot ---------- */
document.querySelectorAll('nav button').forEach(b=>
  b.onclick=()=>{tab=b.dataset.tab;editing=null;screen=null;render();window.scrollTo(0,0);});

// User interactions trigger persistent storage request
window.addEventListener('click', ()=>{ requestPersistence(); }, {once:true});
window.addEventListener('touchstart', ()=>{ requestPersistence(); }, {once:true});

// Boot sequence: check auto-resurrection from IndexedDB if localStorage is empty, then render
(async function bootApp(){
  try{
    if(!localStorage.getItem(PKEY)){
      const resurrected = await autoResurrect();
      if(resurrected){
        loadProfiles();
        if(me) loadData();
        render();
      }
    }
  }catch(e){}
  requestPersistence();
})();

loadProfiles(); if(me) loadData(); render();

if('serviceWorker' in navigator)
  window.addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));
</script>
</body>
</html>
