<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 150" width="100%" height="100%">
  <!-- Divider -->
  <line x1="150" y1="15" x2="150" y2="135" stroke="#E4E4E7" stroke-dasharray="3 3" />
  
  <!-- Labels -->
  <text x="75" y="142" text-anchor="middle" font-size="10" font-family="system-ui, sans-serif" font-weight="600" fill="#71717A">START</text>
  <text x="225" y="142" text-anchor="middle" font-size="10" font-family="system-ui, sans-serif" font-weight="600" fill="#71717A">MID</text>

  <!-- Ground line -->
  <line x1="20" y1="125" x2="130" y2="125" stroke="#E4E4E7" stroke-width="1.5" stroke-dasharray="2 2"/>
  <line x1="170" y1="125" x2="280" y2="125" stroke="#E4E4E7" stroke-width="1.5" stroke-dasharray="2 2"/>

  <!-- START -->
  <g>
    <!-- Barbell on shoulders -->
    <line x1="50" y1="42" x2="100" y2="42" stroke="#52525B" stroke-width="3.5" stroke-linecap="round"/>
    <rect x="49" y="32" width="4" height="20" rx="1" fill="#71717A"/>
    <rect x="97" y="32" width="4" height="20" rx="1" fill="#71717A"/>
    <!-- Head -->
    <circle cx="75" cy="28" r="6" fill="#18181B"/>
    <!-- Body upright -->
    <path d="M 75 34 L 75 75 L 75 125" fill="none" stroke="#18181B" stroke-width="2.8" stroke-linecap="round"/>
    <!-- Feet -->
    <path d="M 75 125 L 83 125" fill="none" stroke="#18181B" stroke-width="2.8" stroke-linecap="round"/>
    <!-- Arms holding bar -->
    <path d="M 75 44 L 66 54 L 66 42" fill="none" stroke="#18181B" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- MID -->
  <g>
    <!-- Barbell on upper back -->
    <line x1="215" y1="68" x2="265" y2="68" stroke="#52525B" stroke-width="3.5" stroke-linecap="round"/>
    <rect x="214" y="58" width="4" height="20" rx="1" fill="#71717A"/>
    <rect x="262" y="58" width="4" height="20" rx="1" fill="#71717A"/>
    <!-- Head -->
    <circle cx="256" cy="68" r="6" fill="#18181B"/>
    <!-- Torso hinged near horizontal -->
    <path d="M 250 74 L 202 74" fill="none" stroke="#18181B" stroke-width="2.8" stroke-linecap="round"/>
    <!-- Soft knee bend, hips pushed back -->
    <path d="M 202 74 L 208 98 L 215 125" fill="none" stroke="#18181B" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- Feet -->
    <path d="M 215 125 L 223 125" fill="none" stroke="#18181B" stroke-width="2.8" stroke-linecap="round"/>
    <!-- Arms holding bar -->
    <path d="M 240 74 L 235 84 L 240 68" fill="none" stroke="#18181B" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- Posterior Chain Accent -->
    <path d="M 200 76 Q 206 90 211 96" fill="none" stroke="#C25E3E" stroke-width="2.2" stroke-linecap="round"/>
  </g>
</svg>
