<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 150" width="100%" height="100%">
  <defs>
    <marker id="arrow" viewBox="0 0 6 6" refX="5" refY="3" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 6 3 L 0 6 Z" fill="#C25E3E" />
    </marker>
  </defs>
  <!-- Divider -->
  <line x1="150" y1="15" x2="150" y2="135" stroke="#E4E4E7" stroke-dasharray="3 3" />
  <!-- Labels -->
  <text x="75" y="142" text-anchor="middle" font-size="10" font-family="system-ui, sans-serif" font-weight="600" fill="#71717A">START</text>
  <text x="225" y="142" text-anchor="middle" font-size="10" font-family="system-ui, sans-serif" font-weight="600" fill="#71717A">MID</text>

  <!-- START -->
  <line x1="25" y1="122" x2="125" y2="122" stroke="#E4E4E7" stroke-width="1.5" />
  <!-- Rack Post & Pin -->
  <line x1="30" y1="40" x2="30" y2="122" stroke="#A1A1AA" stroke-width="2" />
  <line x1="26" y1="88" x2="85" y2="88" stroke="#71717A" stroke-width="3" stroke-linecap="round" />
  <!-- Barbell on Pin -->
  <line x1="50" y1="88" x2="100" y2="88" stroke="#71717A" stroke-width="2.5" />
  <circle cx="75" cy="88" r="10" fill="none" stroke="#52525B" stroke-width="2.5" />
  <circle cx="75" cy="88" r="3" fill="#52525B" />
  <!-- Lifter -->
  <path d="M 64 122 L 68 102 L 56 82 L 73 62" fill="none" stroke="#18181B" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round" />
  <line x1="73" y1="62" x2="75" y2="88" stroke="#18181B" stroke-width="2.8" stroke-linecap="round" />
  <circle cx="78" cy="55" r="6" fill="#18181B" />
  <path d="M 88 80 L 88 64" fill="none" stroke="#C25E3E" stroke-width="1.5" marker-end="url(#arrow)" />

  <!-- MID -->
  <line x1="175" y1="122" x2="275" y2="122" stroke="#E4E4E7" stroke-width="1.5" />
  <line x1="180" y1="40" x2="180" y2="122" stroke="#A1A1AA" stroke-width="2" />
  <line x1="176" y1="88" x2="210" y2="88" stroke="#71717A" stroke-width="3" stroke-linecap="round" />
  <!-- Lifter Upright -->
  <path d="M 225 122 L 225 102 L 225 82 L 225 52" fill="none" stroke="#18181B" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round" />
  <line x1="225" y1="52" x2="225" y2="82" stroke="#18181B" stroke-width="2.8" stroke-linecap="round" />
  <circle cx="225" cy="44" r="6" fill="#18181B" />
  <line x1="200" y1="82" x2="250" y2="82" stroke="#71717A" stroke-width="2.5" />
  <circle cx="225" cy="82" r="10" fill="none" stroke="#52525B" stroke-width="2.5" />
  <circle cx="225" cy="82" r="3" fill="#52525B" />
  <path d="M 220 56 Q 215 67 220 78" fill="none" stroke="#C25E3E" stroke-width="2" stroke-linecap="round" />
</svg>
