<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 150" width="100%" height="100%">
  <defs>
    <marker id="arrow" viewBox="0 0 6 6" refX="5" refY="3" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 6 3 L 0 6 Z" fill="#C25E3E" />
    </marker>
  </defs>
  <!-- Divider -->
  <line x1="150" y1="15" x2="150" y2="135" stroke="#E4E4E7" stroke-dasharray="3 3" />
  <!-- Labels -->
  <text x="75" y="142" text-anchor="middle" font-size="10" font-family="system-ui, sans-serif" font-weight="600" fill="#71717A">START</text>
  <text x="225" y="142" text-anchor="middle" font-size="10" font-family="system-ui, sans-serif" font-weight="600" fill="#71717A">MID</text>

  <!-- START -->
  <line x1="25" y1="122" x2="125" y2="122" stroke="#E4E4E7" stroke-width="1.5" />
  <!-- Flat Bench -->
  <rect x="30" y="88" width="80" height="5" rx="2" fill="#52525B" />
  <line x1="38" y1="93" x2="38" y2="122" stroke="#71717A" stroke-width="2" />
  <line x1="102" y1="93" x2="102" y2="122" stroke="#71717A" stroke-width="2" />
  <!-- Lifter Stance -->
  <path d="M 55 122 L 45 88 L 45 64 L 100 64 L 100 88" fill="none" stroke="#18181B" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round" />
  <line x1="88" y1="64" x2="88" y2="108" stroke="#18181B" stroke-width="2.8" stroke-linecap="round" />
  <circle cx="108" cy="59" r="6" fill="#18181B" />
  <!-- Dumbbell -->
  <rect x="80" y="105" width="16" height="6" rx="2" fill="#52525B" />
  <path d="M 96 100 L 96 78" fill="none" stroke="#C25E3E" stroke-width="1.5" marker-end="url(#arrow)" />

  <!-- MID -->
  <line x1="175" y1="122" x2="275" y2="122" stroke="#E4E4E7" stroke-width="1.5" />
  <rect x="180" y="88" width="80" height="5" rx="2" fill="#52525B" />
  <line x1="188" y1="93" x2="188" y2="122" stroke="#71717A" stroke-width="2" />
  <line x1="252" y1="93" x2="252" y2="122" stroke="#71717A" stroke-width="2" />
  <path d="M 205 122 L 195 88 L 195 64 L 250 64 L 250 88" fill="none" stroke="#18181B" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round" />
  <!-- Arm Pulled High -->
  <path d="M 250 64 L 236 44 L 240 64" fill="none" stroke="#18181B" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round" />
  <circle cx="258" cy="59" r="6" fill="#18181B" />
  <rect x="232" y="61" width="16" height="6" rx="2" fill="#52525B" />
  <path d="M 205 56 Q 220 54 230 64" fill="none" stroke="#C25E3E" stroke-width="2" stroke-linecap="round" />
</svg>
