<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 150" width="100%" height="100%">
  <!-- Divider -->
  <line x1="150" y1="15" x2="150" y2="135" stroke="#E4E4E7" stroke-dasharray="3 3" />
  
  <!-- Labels -->
  <text x="75" y="142" text-anchor="middle" font-size="10" font-family="system-ui, sans-serif" font-weight="600" fill="#71717A">START</text>
  <text x="225" y="142" text-anchor="middle" font-size="10" font-family="system-ui, sans-serif" font-weight="600" fill="#71717A">MID</text>

  <!-- Ground line -->
  <line x1="20" y1="125" x2="130" y2="125" stroke="#E4E4E7" stroke-width="1.5" stroke-dasharray="2 2"/>
  <line x1="170" y1="125" x2="280" y2="125" stroke="#E4E4E7" stroke-width="1.5" stroke-dasharray="2 2"/>

  <!-- START -->
  <g>
    <!-- Lying flat on ground -->
    <circle cx="32" cy="119" r="6" fill="#18181B"/>
    <!-- Torso and hips flat -->
    <path d="M 38 123 L 72 123" fill="none" stroke="#18181B" stroke-width="2.8" stroke-linecap="round"/>
    <!-- Knees bent -->
    <path d="M 72 123 L 90 95 L 98 125" fill="none" stroke="#18181B" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M 98 125 L 106 125" fill="none" stroke="#18181B" stroke-width="2.8" stroke-linecap="round"/>
    <!-- Arms flat on floor -->
    <line x1="42" y1="123" x2="68" y2="123" stroke="#18181B" stroke-width="2" stroke-linecap="round"/>
  </g>

  <!-- MID -->
  <g>
    <!-- Head on ground -->
    <circle cx="182" cy="119" r="6" fill="#18181B"/>
    <!-- Straight line from shoulders to hips to knees -->
    <path d="M 188 123 L 218 95 L 244 95" fill="none" stroke="#18181B" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- Lower legs vertical -->
    <path d="M 244 95 L 248 125" fill="none" stroke="#18181B" stroke-width="2.8" stroke-linecap="round"/>
    <path d="M 248 125 L 256 125" fill="none" stroke="#18181B" stroke-width="2.8" stroke-linecap="round"/>
    <!-- Arms on floor -->
    <line x1="192" y1="123" x2="215" y2="123" stroke="#18181B" stroke-width="2" stroke-linecap="round"/>
    <!-- Glute Lift Accent & Arrow -->
    <path d="M 210 100 Q 218 92 226 100" fill="none" stroke="#C25E3E" stroke-width="2.2" stroke-linecap="round"/>
    <path d="M 218 118 L 218 104 M 214 109 L 218 103 L 222 109" fill="none" stroke="#C25E3E" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>
