<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 150" width="100%" height="100%">
  <line x1="150" y1="15" x2="150" y2="135" stroke="#E4E4E7" stroke-dasharray="3 3" />
  <text x="75" y="142" text-anchor="middle" font-size="10" font-family="system-ui, sans-serif" font-weight="600" fill="#71717A">START</text>
  <text x="225" y="142" text-anchor="middle" font-size="10" font-family="system-ui, sans-serif" font-weight="600" fill="#71717A">MID</text>
  <!-- START -->
  <g>
    <!-- Treadmill Frame -->
    <line x1="25" y1="115" x2="125" y2="115" stroke="#71717A" stroke-width="4" stroke-linecap="round" />
    <path d="M35,115 L35,65 L48,65" stroke="#71717A" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" fill="none" />
    <!-- Runner contact phase -->
    <circle cx="68" cy="45" r="6" fill="#18181B" />
    <line x1="68" y1="51" x2="65" y2="82" stroke="#18181B" stroke-width="2.5" stroke-linecap="round" />
    <path d="M65,82 L65,114 M65,82 L88,98 L98,110" stroke="#18181B" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" fill="none" />
    <path d="M68,58 L54,72 M68,58 L82,68" stroke="#18181B" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" fill="none" />
  </g>
  <!-- MID -->
  <g>
    <!-- Treadmill Frame -->
    <line x1="175" y1="115" x2="275" y2="115" stroke="#71717A" stroke-width="4" stroke-linecap="round" />
    <path d="M185,115 L185,65 L198,65" stroke="#71717A" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" fill="none" />
    <!-- Runner push-off / knee drive phase -->
    <circle cx="218" cy="42" r="6" fill="#18181B" />
    <line x1="218" y1="48" x2="215" y2="78" stroke="#18181B" stroke-width="2.5" stroke-linecap="round" />
    <path d="M215,78 L232,78 L226,98 M215,78 L194,98 L186,112" stroke="#18181B" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" fill="none" />
    <path d="M218,55 L232,68 M218,55 L204,68" stroke="#18181B" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" fill="none" />
    <line x1="242" y1="70" x2="252" y2="70" stroke="#C25E3E" stroke-width="1.5" stroke-dasharray="2 2" stroke-linecap="round" />
    <line x1="240" y1="78" x2="255" y2="78" stroke="#C25E3E" stroke-width="1.5" stroke-dasharray="2 2" stroke-linecap="round" />
  </g>
</svg>