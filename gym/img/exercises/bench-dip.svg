<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 150" width="100%" height="100%">
  <line x1="150" y1="15" x2="150" y2="135" stroke="#E4E4E7" stroke-dasharray="3 3" />
  <text x="75" y="142" text-anchor="middle" font-size="10" font-family="system-ui, sans-serif" font-weight="600" fill="#71717A">START</text>
  <text x="225" y="142" text-anchor="middle" font-size="10" font-family="system-ui, sans-serif" font-weight="600" fill="#71717A">MID</text>
  <!-- START -->
  <g>
    <!-- Bench -->
    <line x1="35" y1="85" x2="65" y2="85" stroke="#71717A" stroke-width="3" stroke-linecap="round" />
    <line x1="40" y1="85" x2="40" y2="125" stroke="#71717A" stroke-width="2" />
    <line x1="60" y1="85" x2="60" y2="125" stroke="#71717A" stroke-width="2" />
    <!-- Person up high locked out -->
    <circle cx="62" cy="38" r="6" fill="#18181B" />
    <line x1="62" y1="44" x2="62" y2="80" stroke="#18181B" stroke-width="2.5" stroke-linecap="round" />
    <path d="M62,80 L92,92 L92,120" stroke="#18181B" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" fill="none" />
    <path d="M62,50 L62,85" stroke="#18181B" stroke-width="2.5" stroke-linecap="round" />
  </g>
  <!-- MID -->
  <g>
    <!-- Bench -->
    <line x1="185" y1="85" x2="215" y2="85" stroke="#71717A" stroke-width="3" stroke-linecap="round" />
    <line x1="190" y1="85" x2="190" y2="125" stroke="#71717A" stroke-width="2" />
    <line x1="210" y1="85" x2="210" y2="125" stroke="#71717A" stroke-width="2" />
    <!-- Person lowered down (dipped) -->
    <circle cx="205" cy="55" r="6" fill="#18181B" />
    <line x1="205" y1="61" x2="205" y2="95" stroke="#18181B" stroke-width="2.5" stroke-linecap="round" />
    <path d="M205,95 L235,102 L235,120" stroke="#18181B" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" fill="none" />
    <!-- Elbow 90 deg bent -->
    <path d="M205,65 L195,65 L210,85" stroke="#18181B" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" fill="none" />
    <path d="M198,48 L198,72" stroke="#C25E3E" stroke-width="1.5" stroke-dasharray="2 2" fill="none" />
    <polygon points="195,70 198,76 201,70" fill="#C25E3E" />
  </g>
</svg>