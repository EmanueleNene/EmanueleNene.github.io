<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 150" width="100%" height="100%">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#C25E3E" />
    </marker>
  </defs>
  <!-- Divider -->
  <line x1="150" y1="15" x2="150" y2="135" stroke="#E4E4E7" stroke-dasharray="3 3" />

  <!-- Left Frame: START -->
  <g id="start-frame">
    <rect x="25" y="92" width="100" height="6" rx="2" fill="#52525B" />
    <line x1="35" y1="98" x2="35" y2="122" stroke="#71717A" stroke-width="2" stroke-linecap="round" />
    <line x1="115" y1="98" x2="115" y2="122" stroke="#71717A" stroke-width="2" stroke-linecap="round" />
    <line x1="40" y1="50" x2="40" y2="92" stroke="#71717A" stroke-width="2.5" stroke-linecap="round" />
    <circle cx="35" cy="85" r="6.5" fill="#18181B" />
    <line x1="41" y1="88" x2="85" y2="88" stroke="#18181B" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" />
    <path d="M 85 88 L 100 88 L 100 120" stroke="#18181B" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" fill="none" />
    <path d="M 55 88 L 55 98 L 55 70" stroke="#18181B" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" fill="none" />
<circle cx="55" cy="70" r="3.5" fill="#52525B" />
    <rect x="52" y="58" width="6" height="24" rx="1" fill="#71717A" />
    <path d="M 55 64 L 55 48" stroke="#C25E3E" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" fill="none" marker-end="url(#arrow)" />
    <text x="75" y="142" text-anchor="middle" font-size="10" font-family="system-ui, sans-serif" font-weight="600" fill="#71717A">START</text>
  </g>

  <!-- Right Frame: MID -->
  <g id="mid-frame">
    <rect x="175" y="92" width="100" height="6" rx="2" fill="#52525B" />
    <line x1="185" y1="98" x2="185" y2="122" stroke="#71717A" stroke-width="2" stroke-linecap="round" />
    <line x1="265" y1="98" x2="265" y2="122" stroke="#71717A" stroke-width="2" stroke-linecap="round" />
    <line x1="190" y1="50" x2="190" y2="92" stroke="#71717A" stroke-width="2.5" stroke-linecap="round" />
    <circle cx="185" cy="85" r="6.5" fill="#18181B" />
    <line x1="191" y1="88" x2="235" y2="88" stroke="#18181B" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" />
    <path d="M 235 88 L 250 88 L 250 120" stroke="#18181B" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" fill="none" />
    <line x1="205" y1="88" x2="205" y2="44" stroke="#18181B" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" />
<circle cx="205" cy="44" r="3.5" fill="#52525B" />
    <rect x="202" y="32" width="6" height="24" rx="1" fill="#71717A" />
<circle cx="205" cy="88" r="4" fill="#C25E3E" opacity="0.6" />
    <text x="225" y="142" text-anchor="middle" font-size="10" font-family="system-ui, sans-serif" font-weight="600" fill="#71717A">MID</text>
