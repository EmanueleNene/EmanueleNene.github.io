<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 150" width="100%" height="100%">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#C25E3E" />
    </marker>
  </defs>
  <!-- Divider -->
  <line x1="150" y1="15" x2="150" y2="135" stroke="#E4E4E7" stroke-dasharray="3 3" />

  <!-- Left Frame: START -->
  <g id="start-frame">
    <line x1="20" y1="130" x2="130" y2="130" stroke="#71717A" stroke-width="1" stroke-linecap="round" />
    <circle cx="75" cy="40" r="6.5" fill="#18181B" />
    <line x1="75" y1="47" x2="75" y2="85" stroke="#18181B" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" />
    <line x1="75" y1="85" x2="75" y2="128" stroke="#18181B" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" />
    <path d="M 75 52 L 82 66 L 78 50" stroke="#18181B" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" fill="none" />
<circle cx="78" cy="50" r="3.5" fill="#52525B" />
    <rect x="75" y="38" width="6" height="24" rx="1" fill="#71717A" />
    <path d="M 78 44 L 78 24" stroke="#C25E3E" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" fill="none" marker-end="url(#arrow)" />
    <text x="75" y="142" text-anchor="middle" font-size="10" font-family="system-ui, sans-serif" font-weight="600" fill="#71717A">START</text>
  </g>

  <!-- Right Frame: MID -->
  <g id="mid-frame">
    <line x1="170" y1="130" x2="280" y2="130" stroke="#71717A" stroke-width="1" stroke-linecap="round" />
    <circle cx="223" cy="40" r="6.5" fill="#18181B" />
    <line x1="225" y1="47" x2="225" y2="85" stroke="#18181B" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" />
    <line x1="225" y1="85" x2="225" y2="128" stroke="#18181B" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" />
    <line x1="225" y1="52" x2="225" y2="20" stroke="#18181B" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" />
<circle cx="225" cy="20" r="3.5" fill="#52525B" />
    <rect x="222" y="8" width="6" height="24" rx="1" fill="#71717A" />
<circle cx="225" cy="50" r="4" fill="#C25E3E" opacity="0.6" />
    <text x="225" y="142" text-anchor="middle" font-size="10" font-family="system-ui, sans-serif" font-weight="600" fill="#71717A">MID</text>
  </g>
</svg>
