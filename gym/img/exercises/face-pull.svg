<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 150" width="100%" height="100%">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#C25E3E" />
    </marker>
  </defs>
  <!-- Divider -->
  <line x1="150" y1="15" x2="150" y2="135" stroke="#E4E4E7" stroke-dasharray="3 3" />

  <!-- Left Frame: START -->
  <g id="start-frame">
    <rect x="12" y="20" width="6" height="105" rx="1" fill="#52525B" />
<circle cx="20" cy="40" r="3" fill="#71717A" />
    <circle cx="80" cy="42" r="6.5" fill="#18181B" />
    <line x1="80" y1="48" x2="75" y2="88" stroke="#18181B" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" />
    <line x1="75" y1="88" x2="72" y2="128" stroke="#18181B" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" />
    <line x1="78" y1="52" x2="40" y2="44" stroke="#18181B" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" />
    <line x1="20" y1="40" x2="40" y2="44" stroke="#71717A" stroke-width="2" stroke-linecap="round" />
    <path d="M 42 44 L 65 44" stroke="#C25E3E" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" fill="none" marker-end="url(#arrow)" />
    <text x="75" y="142" text-anchor="middle" font-size="10" font-family="system-ui, sans-serif" font-weight="600" fill="#71717A">START</text>
  </g>

  <!-- Right Frame: MID -->
  <g id="mid-frame">
    <rect x="162" y="20" width="6" height="105" rx="1" fill="#52525B" />
<circle cx="170" cy="40" r="3" fill="#71717A" />
    <circle cx="230" cy="42" r="6.5" fill="#18181B" />
    <line x1="230" y1="48" x2="225" y2="88" stroke="#18181B" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" />
    <line x1="225" y1="88" x2="222" y2="128" stroke="#18181B" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" />
    <path d="M 228 52 L 248 45 L 220 42" stroke="#18181B" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" fill="none" />
    <line x1="170" y1="40" x2="220" y2="42" stroke="#71717A" stroke-width="2" stroke-linecap="round" />
<circle cx="235" cy="50" r="4" fill="#C25E3E" opacity="0.6" />
    <text x="225" y="142" text-anchor="middle" font-size="10" font-family="system-ui, sans-serif" font-weight="600" fill="#71717A">MID</text>
  </g>
