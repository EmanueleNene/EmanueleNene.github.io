<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 150" width="100%" height="100%">
  <!-- Divider -->
  <line x1="150" y1="15" x2="150" y2="135" stroke="#E4E4E7" stroke-dasharray="3 3" />
  
  <!-- Labels -->
  <text x="75" y="142" text-anchor="middle" font-size="10" font-family="system-ui, sans-serif" font-weight="600" fill="#71717A">START</text>
  <text x="225" y="142" text-anchor="middle" font-size="10" font-family="system-ui, sans-serif" font-weight="600" fill="#71717A">MID</text>

  <!-- Ground line -->
  <line x1="20" y1="125" x2="130" y2="125" stroke="#E4E4E7" stroke-width="1.5" stroke-dasharray="2 2"/>
  <line x1="170" y1="125" x2="280" y2="125" stroke="#E4E4E7" stroke-width="1.5" stroke-dasharray="2 2"/>

  <!-- START -->
  <g>
    <!-- Bench -->
    <rect x="30" y="80" width="30" height="45" rx="2" fill="none" stroke="#71717A" stroke-width="2"/>
    <!-- Head resting back -->
    <circle cx="38" cy="70" r="6" fill="#18181B"/>
    <!-- Upper back on bench to low hips -->
    <path d="M 45 82 L 65 110" fill="none" stroke="#18181B" stroke-width="2.8" stroke-linecap="round"/>
    <!-- Legs to feet -->
    <path d="M 65 110 L 92 90 L 92 125" fill="none" stroke="#18181B" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M 92 125 L 100 125" fill="none" stroke="#18181B" stroke-width="2.8" stroke-linecap="round"/>
    <!-- Barbell on hips -->
    <circle cx="65" cy="105" r="7" fill="none" stroke="#52525B" stroke-width="2.5"/>
    <line x1="45" y1="105" x2="85" y2="105" stroke="#52525B" stroke-width="3.5" stroke-linecap="round"/>
  </g>

  <!-- MID -->
  <g>
    <!-- Bench -->
    <rect x="180" y="80" width="30" height="45" rx="2" fill="none" stroke="#71717A" stroke-width="2"/>
    <!-- Head -->
    <circle cx="188" cy="74" r="6" fill="#18181B"/>
    <!-- Full Hip Extension (Horizontal Torso & Thighs) -->
    <path d="M 195 82 L 225 82 L 252 82" fill="none" stroke="#18181B" stroke-width="2.8" stroke-linecap="round"/>
    <!-- Vertical lower legs -->
    <path d="M 252 82 L 252 125" fill="none" stroke="#18181B" stroke-width="2.8" stroke-linecap="round"/>
    <path d="M 252 125 L 260 125" fill="none" stroke="#18181B" stroke-width="2.8" stroke-linecap="round"/>
    <!-- Barbell on elevated hips -->
    <circle cx="225" cy="76" r="7" fill="none" stroke="#52525B" stroke-width="2.5"/>
    <line x1="205" y1="76" x2="245" y2="76" stroke="#52525B" stroke-width="3.5" stroke-linecap="round"/>
    <!-- Glute Squeeze Accent & Up Arrow -->
    <path d="M 215 87 Q 225 90 235 87" fill="none" stroke="#C25E3E" stroke-width="2.2" stroke-linecap="round"/>
    <path d="M 225 105 L 225 91 M 221 96 L 225 90 L 229 96" fill="none" stroke="#C25E3E" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>