<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 150" width="100%" height="100%">
  <defs>
    <marker id="arrow" viewBox="0 0 6 6" refX="5" refY="3" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 6 3 L 0 6 Z" fill="#C25E3E" />
    </marker>
  </defs>
  <!-- Divider -->
  <line x1="150" y1="15" x2="150" y2="135" stroke="#E4E4E7" stroke-dasharray="3 3" />
  <!-- Labels -->
  <text x="75" y="142" text-anchor="middle" font-size="10" font-family="system-ui, sans-serif" font-weight="600" fill="#71717A">START</text>
  <text x="225" y="142" text-anchor="middle" font-size="10" font-family="system-ui, sans-serif" font-weight="600" fill="#71717A">MID</text>

  <!-- START -->
  <line x1="25" y1="122" x2="125" y2="122" stroke="#E4E4E7" stroke-width="1.5" />
  <!-- Lifter Horizontal -->
  <path d="M 60 122 L 56 95 L 48 68 L 82 68" fill="none" stroke="#18181B" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round" />
  <line x1="82" y1="68" x2="82" y2="110" stroke="#18181B" stroke-width="2.8" stroke-linecap="round" />
  <circle cx="90" cy="66" r="6" fill="#18181B" />
  <!-- Barbell on floor -->
  <line x1="57" y1="110" x2="107" y2="110" stroke="#71717A" stroke-width="2.5" />
  <circle cx="82" cy="110" r="10" fill="none" stroke="#52525B" stroke-width="2.5" />
  <path d="M 92 102 L 92 80" fill="none" stroke="#C25E3E" stroke-width="1.5" marker-end="url(#arrow)" />

  <!-- MID -->
  <line x1="175" y1="122" x2="275" y2="122" stroke="#E4E4E7" stroke-width="1.5" />
  <path d="M 210 122 L 206 95 L 198 68 L 232 68" fill="none" stroke="#18181B" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round" />
  <!-- Arm high elbow -->
  <path d="M 232 68 L 222 48 L 228 68" fill="none" stroke="#18181B" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round" />
  <circle cx="240" cy="66" r="6" fill="#18181B" />
  <!-- Barbell pulled to lower chest -->
  <line x1="203" y1="68" x2="253" y2="68" stroke="#71717A" stroke-width="2.5" />
  <circle cx="228" cy="68" r="10" fill="none" stroke="#52525B" stroke-width="2.5" />
  <path d="M 205 60 Q 212 68 205 76" fill="none" stroke="#C25E3E" stroke-width="2" stroke-linecap="round" />
</svg>
