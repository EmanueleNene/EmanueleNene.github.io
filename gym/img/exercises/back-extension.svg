<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 150" width="100%" height="100%">
  <defs>
    <marker id="arrow" viewBox="0 0 6 6" refX="5" refY="3" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 6 3 L 0 6 Z" fill="#C25E3E" />
    </marker>
  </defs>
  <!-- Divider -->
  <line x1="150" y1="15" x2="150" y2="135" stroke="#E4E4E7" stroke-dasharray="3 3" />
  <!-- Labels -->
  <text x="75" y="142" text-anchor="middle" font-size="10" font-family="system-ui, sans-serif" font-weight="600" fill="#71717A">START</text>
  <text x="225" y="142" text-anchor="middle" font-size="10" font-family="system-ui, sans-serif" font-weight="600" fill="#71717A">MID</text>

  <!-- START -->
  <!-- Bench frame -->
  <path d="M 38 122 L 38 108 L 72 85 L 72 122" fill="none" stroke="#71717A" stroke-width="2" stroke-linejoin="round" />
  <rect x="32" y="104" width="12" height="8" rx="2" fill="#52525B" />
  <rect x="66" y="80" width="14" height="10" rx="2" fill="#52525B" />
  <!-- Lifter bent down -->
  <path d="M 38 108 L 55 96 L 72 85 L 72 118" fill="none" stroke="#18181B" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round" />
  <circle cx="72" cy="126" r="6" fill="#18181B" />
  <path d="M 80 115 Q 92 98 84 75" fill="none" stroke="#C25E3E" stroke-width="1.5" stroke-dasharray="2 2" marker-end="url(#arrow)" />

  <!-- MID -->
  <path d="M 188 122 L 188 108 L 222 85 L 222 122" fill="none" stroke="#71717A" stroke-width="2" stroke-linejoin="round" />
  <rect x="182" y="104" width="12" height="8" rx="2" fill="#52525B" />
  <rect x="216" y="80" width="14" height="10" rx="2" fill="#52525B" />
  <!-- Lifter extended -->
  <path d="M 188 108 L 205 96 L 222 85 L 258 62" fill="none" stroke="#18181B" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round" />
  <circle cx="266" cy="56" r="6" fill="#18181B" />
  <path d="M 218 84 Q 235 70 252 64" fill="none" stroke="#C25E3E" stroke-width="2" stroke-linecap="round" />
</svg>
