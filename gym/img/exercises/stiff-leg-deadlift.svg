<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 150" width="100%" height="100%">
  <!-- Divider -->
  <line x1="150" y1="15" x2="150" y2="135" stroke="#E4E4E7" stroke-dasharray="3 3" />
  
  <!-- Labels -->
  <text x="75" y="142" text-anchor="middle" font-size="10" font-family="system-ui, sans-serif" font-weight="600" fill="#71717A">START</text>
  <text x="225" y="142" text-anchor="middle" font-size="10" font-family="system-ui, sans-serif" font-weight="600" fill="#71717A">MID</text>

  <!-- Ground line -->
  <line x1="20" y1="125" x2="130" y2="125" stroke="#E4E4E7" stroke-width="1.5" stroke-dasharray="2 2"/>
  <line x1="170" y1="125" x2="280" y2="125" stroke="#E4E4E7" stroke-width="1.5" stroke-dasharray="2 2"/>

  <!-- START -->
  <g>
    <!-- Barbell -->
    <line x1="55" y1="78" x2="105" y2="78" stroke="#52525B" stroke-width="3.5" stroke-linecap="round"/>
    <circle cx="55" cy="78" r="8" fill="none" stroke="#71717A" stroke-width="2"/>
    <circle cx="105" cy="78" r="8" fill="none" stroke="#71717A" stroke-width="2"/>
    <!-- Head -->
    <circle cx="75" cy="28" r="6" fill="#18181B"/>
    <!-- Body upright -->
    <path d="M 75 34 L 75 75 L 75 125" fill="none" stroke="#18181B" stroke-width="2.8" stroke-linecap="round"/>
    <!-- Feet -->
    <path d="M 75 125 L 83 125" fill="none" stroke="#18181B" stroke-width="2.8" stroke-linecap="round"/>
    <!-- Arms -->
    <path d="M 75 44 L 80 78" fill="none" stroke="#18181B" stroke-width="2.5" stroke-linecap="round"/>
  </g>

  <!-- MID -->
  <g>
    <!-- Barbell down near ankles -->
    <line x1="225" y1="110" x2="275" y2="110" stroke="#52525B" stroke-width="3.5" stroke-linecap="round"/>
    <circle cx="225" cy="110" r="8" fill="none" stroke="#71717A" stroke-width="2"/>
    <circle cx="275" cy="110" r="8" fill="none" stroke="#71717A" stroke-width="2"/>
    <!-- Head -->
    <circle cx="262" cy="68" r="6" fill="#18181B"/>
    <!-- Torso horizontal -->
    <path d="M 256 68 L 205 68" fill="none" stroke="#18181B" stroke-width="2.8" stroke-linecap="round"/>
    <!-- Completely straight legs, hips high -->
    <path d="M 205 68 L 215 125" fill="none" stroke="#18181B" stroke-width="2.8" stroke-linecap="round"/>
    <!-- Feet -->
    <path d="M 215 125 L 223 125" fill="none" stroke="#18181B" stroke-width="2.8" stroke-linecap="round"/>
    <!-- Arms vertical reaching for bar -->
    <path d="M 250 68 L 250 110" fill="none" stroke="#18181B" stroke-width="2.5" stroke-linecap="round"/>
    <!-- Hamstring Accent Along Full Posterior Thigh -->
    <path d="M 203 72 L 211 120" fill="none" stroke="#C25E3E" stroke-width="2.2" stroke-linecap="round"/>
  </g>
</svg>
