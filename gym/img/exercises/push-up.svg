<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 150" width="100%" height="100%">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#C25E3E" />
    </marker>
  </defs>
  <!-- Divider -->
  <line x1="150" y1="15" x2="150" y2="135" stroke="#E4E4E7" stroke-dasharray="3 3" />

  <!-- Left Frame: START -->
  <g id="start-frame">
    <line x1="15" y1="120" x2="135" y2="120" stroke="#71717A" stroke-width="1.5" stroke-linecap="round" />
    <circle cx="35" cy="94" r="6.5" fill="#18181B" />
    <line x1="41" y1="96" x2="95" y2="104" stroke="#18181B" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" />
    <line x1="95" y1="104" x2="120" y2="118" stroke="#18181B" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" />
    <path d="M 48 97 L 42 108 L 52 120" stroke="#18181B" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" fill="none" />
    <path d="M 48 90 L 48 68" stroke="#C25E3E" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" fill="none" marker-end="url(#arrow)" />
    <text x="75" y="142" text-anchor="middle" font-size="10" font-family="system-ui, sans-serif" font-weight="600" fill="#71717A">START</text>
  </g>

  <!-- Right Frame: MID -->
  <g id="mid-frame">
    <line x1="165" y1="120" x2="285" y2="120" stroke="#71717A" stroke-width="1.5" stroke-linecap="round" />
    <circle cx="185" cy="62" r="6.5" fill="#18181B" />
    <line x1="191" y1="65" x2="245" y2="98" stroke="#18181B" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" />
    <line x1="245" y1="98" x2="270" y2="118" stroke="#18181B" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" />
    <line x1="198" y1="66" x2="198" y2="120" stroke="#18181B" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" />
<circle cx="205" cy="74" r="4" fill="#C25E3E" opacity="0.6" />
    <text x="225" y="142" text-anchor="middle" font-size="10" font-family="system-ui, sans-serif" font-weight="600" fill="#71717A">MID</text>
  </g>
</svg>
