<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 150" width="100%" height="100%">
  <!-- Divider -->
  <line x1="150" y1="15" x2="150" y2="135" stroke="#E4E4E7" stroke-dasharray="3 3" />
  
  <!-- Labels -->
  <text x="75" y="142" text-anchor="middle" font-size="10" font-family="system-ui, sans-serif" font-weight="600" fill="#71717A">START</text>
  <text x="225" y="142" text-anchor="middle" font-size="10" font-family="system-ui, sans-serif" font-weight="600" fill="#71717A">MID</text>

  <!-- Ground line -->
  <line x1="20" y1="125" x2="130" y2="125" stroke="#E4E4E7" stroke-width="1.5" stroke-dasharray="2 2"/>
  <line x1="170" y1="125" x2="280" y2="125" stroke="#E4E4E7" stroke-width="1.5" stroke-dasharray="2 2"/>

  <!-- START -->
  <g>
    <!-- Barbell -->
    <line x1="50" y1="42" x2="100" y2="42" stroke="#52525B" stroke-width="3.5" stroke-linecap="round"/>
    <rect x="49" y="32" width="4" height="20" rx="1" fill="#71717A"/>
    <rect x="97" y="32" width="4" height="20" rx="1" fill="#71717A"/>
    <!-- Head -->
    <circle cx="75" cy="28" r="6" fill="#18181B"/>
    <!-- Body -->
    <path d="M 75 34 L 75 75 L 75 98 L 75 125" fill="none" stroke="#18181B" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- Feet -->
    <path d="M 75 125 L 83 125" fill="none" stroke="#18181B" stroke-width="2.8" stroke-linecap="round"/>
    <!-- Arms holding bar -->
    <path d="M 75 44 L 66 54 L 66 42" fill="none" stroke="#18181B" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- MID -->
  <g>
    <!-- Barbell -->
    <line x1="200" y1="62" x2="250" y2="62" stroke="#52525B" stroke-width="3.5" stroke-linecap="round"/>
    <rect x="199" y="52" width="4" height="20" rx="1" fill="#71717A"/>
    <rect x="247" y="52" width="4" height="20" rx="1" fill="#71717A"/>
    <!-- Head -->
    <circle cx="225" cy="48" r="6" fill="#18181B"/>
    <!-- Torso angled -->
    <path d="M 223 54 L 206 85" fill="none" stroke="#18181B" stroke-width="2.8" stroke-linecap="round"/>
    <!-- Legs in deep squat -->
    <path d="M 206 85 L 238 95 L 225 125" fill="none" stroke="#18181B" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- Feet -->
    <path d="M 225 125 L 233 125" fill="none" stroke="#18181B" stroke-width="2.8" stroke-linecap="round"/>
    <!-- Arms -->
    <path d="M 222 62 L 213 72 L 215 62" fill="none" stroke="#18181B" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- Quad/Glute Accent & Drive Arrow -->
    <path d="M 210 88 Q 224 82 235 94" fill="none" stroke="#C25E3E" stroke-width="2.2" stroke-linecap="round"/>
    <path d="M 245 80 L 245 66 M 241 71 L 245 65 L 249 71" fill="none" stroke="#C25E3E" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>