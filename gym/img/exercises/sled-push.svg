<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 150" width="100%" height="100%">
  <line x1="150" y1="15" x2="150" y2="135" stroke="#E4E4E7" stroke-dasharray="3 3" />
  <text x="75" y="142" text-anchor="middle" font-size="10" font-family="system-ui, sans-serif" font-weight="600" fill="#71717A">START</text>
  <text x="225" y="142" text-anchor="middle" font-size="10" font-family="system-ui, sans-serif" font-weight="600" fill="#71717A">MID</text>
  <!-- START -->
  <g>
    <!-- Sled Frame -->
    <line x1="25" y1="120" x2="58" y2="120" stroke="#71717A" stroke-width="4" stroke-linecap="round" />
    <line x1="50" y1="120" x2="50" y2="60" stroke="#71717A" stroke-width="3" stroke-linecap="round" />
    <rect x="30" y="104" width="16" height="14" rx="1" fill="#52525B" />
    <!-- Athlete starting drive -->
    <circle cx="60" cy="58" r="6" fill="#18181B" />
    <line x1="63" y1="63" x2="88" y2="80" stroke="#18181B" stroke-width="2.5" stroke-linecap="round" />
    <path d="M88,80 L78,98 L78,120 M88,80 L108,102 L114,120" stroke="#18181B" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" fill="none" />
    <path d="M66,65 L50,68" stroke="#18181B" stroke-width="2.5" stroke-linecap="round" />
  </g>
  <!-- MID -->
  <g>
    <!-- Sled Frame pushed forward -->
    <line x1="165" y1="120" x2="198" y2="120" stroke="#71717A" stroke-width="4" stroke-linecap="round" />
    <line x1="190" y1="120" x2="190" y2="60" stroke="#71717A" stroke-width="3" stroke-linecap="round" />
    <rect x="170" y="104" width="16" height="14" rx="1" fill="#52525B" />
    <!-- Athlete mid sprint drive -->
    <circle cx="200" cy="58" r="6" fill="#18181B" />
    <line x1="203" y1="63" x2="228" y2="80" stroke="#18181B" stroke-width="2.5" stroke-linecap="round" />
    <path d="M228,80 L216,92 L220,105 M228,80 L248,100 L256,120" stroke="#18181B" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" fill="none" />
    <path d="M206,65 L190,68" stroke="#18181B" stroke-width="2.5" stroke-linecap="round" />
    <line x1="262" y1="78" x2="274" y2="78" stroke="#C25E3E" stroke-width="1.5" stroke-dasharray="2 2" stroke-linecap="round" />
    <polygon points="273,76 278,78 273,80" fill="#C25E3E" />
  </g>
</svg>