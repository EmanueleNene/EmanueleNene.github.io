<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 150" width="100%" height="100%">
  <defs>
    <marker id="arrow" viewBox="0 0 6 6" refX="5" refY="3" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 6 3 L 0 6 Z" fill="#C25E3E" />
    </marker>
  </defs>
  <!-- Divider -->
  <line x1="150" y1="15" x2="150" y2="135" stroke="#E4E4E7" stroke-dasharray="3 3" />
  <!-- Labels -->
  <text x="75" y="142" text-anchor="middle" font-size="10" font-family="system-ui, sans-serif" font-weight="600" fill="#71717A">START</text>
  <text x="225" y="142" text-anchor="middle" font-size="10" font-family="system-ui, sans-serif" font-weight="600" fill="#71717A">MID</text>

  <!-- START -->
  <line x1="20" y1="22" x2="130" y2="22" stroke="#52525B" stroke-width="3" />
  <path d="M 75 85 L 75 108 L 75 128" fill="none" stroke="#18181B" stroke-width="2.8" stroke-linecap="round" />
  <line x1="75" y1="85" x2="75" y2="48" stroke="#18181B" stroke-width="2.8" stroke-linecap="round" />
  <circle cx="75" cy="36" r="6" fill="#18181B" />
  <!-- Underhand narrow grip -->
  <line x1="75" y1="48" x2="68" y2="22" stroke="#18181B" stroke-width="2.5" stroke-linecap="round" />
  <line x1="75" y1="48" x2="82" y2="22" stroke="#18181B" stroke-width="2.5" stroke-linecap="round" />
  <path d="M 52 70 L 52 50" fill="none" stroke="#C25E3E" stroke-width="1.5" marker-end="url(#arrow)" />

  <!-- MID -->
  <line x1="170" y1="22" x2="280" y2="22" stroke="#52525B" stroke-width="3" />
  <circle cx="225" cy="14" r="6" fill="#18181B" />
  <path d="M 225 30 L 225 65 L 225 90 L 225 110" fill="none" stroke="#18181B" stroke-width="2.8" stroke-linecap="round" />
  <!-- Elbows tucked in front -->
  <path d="M 225 30 L 215 46 L 218 22" fill="none" stroke="#18181B" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" />
  <path d="M 225 30 L 235 46 L 232 22" fill="none" stroke="#18181B" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" />
  <path d="M 216 35 Q 210 44 218 48" fill="none" stroke="#C25E3E" stroke-width="2" stroke-linecap="round" />
  <path d="M 234 35 Q 240 44 232 48" fill="none" stroke="#C25E3E" stroke-width="2" stroke-linecap="round" />
</svg>
