<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 150" width="100%" height="100%">
  <line x1="150" y1="15" x2="150" y2="135" stroke="#E4E4E7" stroke-dasharray="3 3" />
  <text x="75" y="142" text-anchor="middle" font-size="10" font-family="system-ui, sans-serif" font-weight="600" fill="#71717A">START</text>
  <text x="225" y="142" text-anchor="middle" font-size="10" font-family="system-ui, sans-serif" font-weight="600" fill="#71717A">MID</text>
  <!-- START -->
  <g>
    <!-- Athlete Hinging -->
    <circle cx="56" cy="46" r="6" fill="#18181B" />
    <line x1="60" y1="50" x2="90" y2="72" stroke="#18181B" stroke-width="2.5" stroke-linecap="round" />
    <path d="M90,72 L82,96 L82,120 M90,72 L96,96 L96,120" stroke="#18181B" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" fill="none" />
    <path d="M64,54 L68,85" stroke="#18181B" stroke-width="2.5" stroke-linecap="round" />
    <!-- Kettlebell hiked back -->
    <circle cx="69" cy="94" r="6" fill="#52525B" />
    <path d="M66,88 L72,88" stroke="#52525B" stroke-width="2" stroke-linecap="round" />
  </g>
  <!-- MID -->
  <g>
    <!-- Athlete Lockout -->
    <circle cx="225" cy="30" r="6" fill="#18181B" />
    <line x1="225" y1="36" x2="225" y2="75" stroke="#18181B" stroke-width="2.5" stroke-linecap="round" />
    <path d="M225,75 L218,98 L218,120 M225,75 L232,98 L232,120" stroke="#18181B" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" fill="none" />
    <path d="M225,44 L258,44" stroke="#18181B" stroke-width="2.5" stroke-linecap="round" />
    <!-- Kettlebell at chest height -->
    <circle cx="266" cy="44" r="6" fill="#52525B" />
    <path d="M259,42 L259,46" stroke="#52525B" stroke-width="2" stroke-linecap="round" />
    <path d="M208,90 A45,45 0 0,1 254,48" stroke="#C25E3E" stroke-width="1.5" fill="none" stroke-dasharray="2 2" />
    <polygon points="252,44 259,45 254,51" fill="#C25E3E" />
  </g>
</svg>