<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 150" width="100%" height="100%">
  <defs>
    <marker id="arrow" viewBox="0 0 6 6" refX="5" refY="3" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 6 3 L 0 6 Z" fill="#C25E3E" />
    </marker>
  </defs>
  <!-- Divider -->
  <line x1="150" y1="15" x2="150" y2="135" stroke="#E4E4E7" stroke-dasharray="3 3" />
  <!-- Labels -->
  <text x="75" y="142" text-anchor="middle" font-size="10" font-family="system-ui, sans-serif" font-weight="600" fill="#71717A">START</text>
  <text x="225" y="142" text-anchor="middle" font-size="10" font-family="system-ui, sans-serif" font-weight="600" fill="#71717A">MID</text>

  <!-- START -->
  <line x1="20" y1="120" x2="130" y2="120" stroke="#E4E4E7" stroke-width="1.5" />
  <!-- V-sit -->
  <path d="M 105 98 L 90 85 L 70 108 L 50 76" fill="none" stroke="#18181B" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round" />
  <circle cx="44" cy="66" r="6" fill="#18181B" />
  <line x1="50" y1="76" x2="65" y2="80" stroke="#18181B" stroke-width="2.5" stroke-linecap="round" />
  <circle cx="65" cy="80" r="6" fill="#52525B" />
  <path d="M 55 70 C 60 62 70 65 72 75" fill="none" stroke="#C25E3E" stroke-width="1.5" stroke-dasharray="2 2" marker-end="url(#arrow)" />

  <!-- MID -->
  <line x1="170" y1="120" x2="280" y2="120" stroke="#E4E4E7" stroke-width="1.5" />
  <path d="M 255 98 L 240 85 L 220 108 L 200 76" fill="none" stroke="#18181B" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round" />
  <circle cx="194" cy="66" r="6" fill="#18181B" />
  <!-- Arms & ball twisted right -->
  <line x1="200" y1="76" x2="235" y2="98" stroke="#18181B" stroke-width="2.5" stroke-linecap="round" />
  <circle cx="235" cy="98" r="6" fill="#52525B" />
  <path d="M 205 80 Q 212 90 222 96" fill="none" stroke="#C25E3E" stroke-width="2" stroke-linecap="round" />
</svg>
