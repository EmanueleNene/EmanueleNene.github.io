<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 150" width="100%" height="100%">
  <defs>
    <marker id="arrow" viewBox="0 0 6 6" refX="5" refY="3" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 6 3 L 0 6 Z" fill="#C25E3E" />
    </marker>
  </defs>
  <!-- Divider -->
  <line x1="150" y1="15" x2="150" y2="135" stroke="#E4E4E7" stroke-dasharray="3 3" />
  <!-- Labels -->
  <text x="75" y="142" text-anchor="middle" font-size="10" font-family="system-ui, sans-serif" font-weight="600" fill="#71717A">START</text>
  <text x="225" y="142" text-anchor="middle" font-size="10" font-family="system-ui, sans-serif" font-weight="600" fill="#71717A">MID</text>

  <!-- START -->
  <!-- Machine frame & seat -->
  <line x1="75" y1="15" x2="75" y2="30" stroke="#71717A" stroke-width="2" />
  <rect x="65" y="102" width="20" height="5" rx="2" fill="#52525B" />
  <rect x="66" y="84" width="18" height="5" rx="2" fill="#71717A" />
  <line x1="42" y1="32" x2="108" y2="32" stroke="#52525B" stroke-width="3" stroke-linecap="round" />
  <!-- Lifter Reach -->
  <path d="M 75 102 L 85 86 L 85 122" fill="none" stroke="#18181B" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round" />
  <line x1="75" y1="102" x2="75" y2="68" stroke="#18181B" stroke-width="2.8" stroke-linecap="round" />
  <circle cx="75" cy="56" r="6" fill="#18181B" />
  <line x1="75" y1="68" x2="48" y2="32" stroke="#18181B" stroke-width="2.5" stroke-linecap="round" />
  <line x1="75" y1="68" x2="102" y2="32" stroke="#18181B" stroke-width="2.5" stroke-linecap="round" />
  <path d="M 45 42 L 45 56" fill="none" stroke="#C25E3E" stroke-width="1.5" marker-end="url(#arrow)" />
  <path d="M 105 42 L 105 56" fill="none" stroke="#C25E3E" stroke-width="1.5" marker-end="url(#arrow)" />

  <!-- MID -->
  <line x1="225" y1="15" x2="225" y2="56" stroke="#71717A" stroke-width="1.5" />
  <rect x="215" y="102" width="20" height="5" rx="2" fill="#52525B" />
  <rect x="216" y="84" width="18" height="5" rx="2" fill="#71717A" />
  <line x1="192" y1="56" x2="258" y2="56" stroke="#52525B" stroke-width="3" stroke-linecap="round" />
  <path d="M 225 102 L 235 86 L 235 122" fill="none" stroke="#18181B" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round" />
  <line x1="225" y1="102" x2="222" y2="68" stroke="#18181B" stroke-width="2.8" stroke-linecap="round" />
  <circle cx="222" cy="56" r="6" fill="#18181B" />
  <!-- Arms pulling down -->
  <path d="M 222 68 L 202 74 L 198 56" fill="none" stroke="#18181B" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" />
  <path d="M 222 68 L 242 74 L 252 56" fill="none" stroke="#18181B" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" />
  <path d="M 212 64 Q 206 72 212 80" fill="none" stroke="#C25E3E" stroke-width="2" stroke-linecap="round" />
  <path d="M 232 64 Q 238 72 232 80" fill="none" stroke="#C25E3E" stroke-width="2" stroke-linecap="round" />
</svg>
