<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 150" width="100%" height="100%">
  <defs>
    <marker id="arrow" viewBox="0 0 6 6" refX="5" refY="3" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 6 3 L 0 6 Z" fill="#C25E3E" />
    </marker>
  </defs>
  <!-- Divider -->
  <line x1="150" y1="15" x2="150" y2="135" stroke="#E4E4E7" stroke-dasharray="3 3" />
  <!-- Labels -->
  <text x="75" y="142" text-anchor="middle" font-size="10" font-family="system-ui, sans-serif" font-weight="600" fill="#71717A">START</text>
  <text x="225" y="142" text-anchor="middle" font-size="10" font-family="system-ui, sans-serif" font-weight="600" fill="#71717A">MID</text>

  <!-- START -->
  <line x1="25" y1="122" x2="125" y2="122" stroke="#E4E4E7" stroke-width="1.5" />
  <!-- Lifter Hinge -->
  <path d="M 60 122 L 65 100 L 52 76 L 80 58" fill="none" stroke="#18181B" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round" />
  <line x1="80" y1="58" x2="82" y2="100" stroke="#18181B" stroke-width="2.8" stroke-linecap="round" />
  <circle cx="86" cy="52" r="6" fill="#18181B" />
  <!-- Barbell low -->
  <line x1="57" y1="100" x2="107" y2="100" stroke="#71717A" stroke-width="2.5" />
  <circle cx="82" cy="100" r="9" fill="none" stroke="#52525B" stroke-width="2.5" />
  <path d="M 88 92 Q 92 82 82 72" fill="none" stroke="#C25E3E" stroke-width="1.5" marker-end="url(#arrow)" />

  <!-- MID -->
  <line x1="175" y1="122" x2="275" y2="122" stroke="#E4E4E7" stroke-width="1.5" />
  <path d="M 210 122 L 215 100 L 202 76 L 230 58" fill="none" stroke="#18181B" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round" />
  <!-- Arm Bent Back -->
  <path d="M 230 58 L 215 54 L 220 72" fill="none" stroke="#18181B" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round" />
  <circle cx="236" cy="52" r="6" fill="#18181B" />
  <!-- Barbell pulled to abdomen -->
  <line x1="195" y1="72" x2="245" y2="72" stroke="#71717A" stroke-width="2.5" />
  <circle cx="220" cy="72" r="9" fill="none" stroke="#52525B" stroke-width="2.5" />
  <path d="M 207 60 Q 212 67 207 74" fill="none" stroke="#C25E3E" stroke-width="2" stroke-linecap="round" />
</svg>
