    <path d="M 228 102 L 245 107 L 245 125" stroke="#18181B" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" fill="none" />
    <line x1="205" y1="75" x2="230" y2="38" stroke="#18181B" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" />
<circle cx="230" cy="38" r="3.5" fill="#52525B" />
