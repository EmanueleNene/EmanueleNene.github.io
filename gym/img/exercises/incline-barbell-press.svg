    <rect x="75" y="105" width="30" height="5" rx="1" fill="#52525B" />
    <line x1="80" y1="105" x2="35" y2="60" stroke="#52525B" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" />
    <line x1="80" y1="105" x2="80" y2="125" stroke="#71717A" stroke-width="2" stroke-linecap="round" />
    <line x1="45" y1="70" x2="45" y2="125" stroke="#71717A" stroke-width="2" stroke-linecap="round" />
    <circle cx="33" cy="52" r="6.5" fill="#18181B" />
    <line x1="38" y1="58" x2="78" y2="102" stroke="#18181B" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" />
    <path d="M 78 102 L 95 107 L 95 125" stroke="#18181B" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" fill="none" />
    <path d="M 55 75 L 48 88 L 62 62" stroke="#18181B" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" fill="none" />
<circle cx="62" cy="62" r="3.5" fill="#52525B" />
    <rect x="59" y="50" width="6" height="24" rx="1" fill="#71717A" />
    <path d="M 65 58 L 78 40" stroke="#C25E3E" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" fill="none" marker-end="url(#arrow)" />
    <text x="75" y="142" text-anchor="middle" font-size="10" font-family="system-ui, sans-serif" font-weight="600" fill="#71717A">START</text>
  </g>

  <!-- Right Frame: MID -->
  <g id="mid-frame">
    <rect x="225" y="105" width="30" height="5" rx="1" fill="#52525B" />
    <line x1="230" y1="105" x2="185" y2="60" stroke="#52525B" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" />
    <line x1="230" y1="105" x2="230" y2="125" stroke="#71717A" stroke-width="2" stroke-linecap="round" />
