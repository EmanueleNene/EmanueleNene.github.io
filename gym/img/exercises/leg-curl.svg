<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 150" width="100%" height="100%">
  <!-- Divider -->
  <line x1="150" y1="15" x2="150" y2="135" stroke="#E4E4E7" stroke-dasharray="3 3" />
  
  <!-- Labels -->
  <text x="75" y="142" text-anchor="middle" font-size="10" font-family="system-ui, sans-serif" font-weight="600" fill="#71717A">START</text>
  <text x="225" y="142" text-anchor="middle" font-size="10" font-family="system-ui, sans-serif" font-weight="600" fill="#71717A">MID</text>

  <!-- START -->
  <g>
    <!-- Prone Bench -->
    <path d="M 30 90 L 65 85 L 110 90" fill="none" stroke="#71717A" stroke-width="4" stroke-linecap="round"/>
    <!-- Head lying down -->
    <circle cx="34" cy="78" r="6" fill="#18181B"/>
    <!-- Body prone -->
    <path d="M 40 84 L 65 82 L 115 87" fill="none" stroke="#18181B" stroke-width="2.8" stroke-linecap="round"/>
    <!-- Feet flat -->
    <path d="M 115 87 L 120 81" fill="none" stroke="#18181B" stroke-width="2.8" stroke-linecap="round"/>
    <!-- Lever Pad on back of ankles -->
    <circle cx="113" cy="83" r="4" fill="#52525B"/>
  </g>

  <!-- MID -->
  <g>
    <!-- Prone Bench -->
    <path d="M 180 90 L 215 85 L 260 90" fill="none" stroke="#71717A" stroke-width="4" stroke-linecap="round"/>
    <!-- Head -->
    <circle cx="184" cy="78" r="6" fill="#18181B"/>
    <!-- Torso to Hips -->
    <path d="M 190 84 L 215 82" fill="none" stroke="#18181B" stroke-width="2.8" stroke-linecap="round"/>
    <!-- Lower legs curled up >90 deg -->
    <path d="M 215 82 L 245 84 L 235 55" fill="none" stroke="#18181B" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M 235 55 L 227 57" fill="none" stroke="#18181B" stroke-width="2.8" stroke-linecap="round"/>
    <!-- Lever Pad -->
    <circle cx="236" cy="52" r="4" fill="#52525B"/>
    <!-- Curl Arc Motion Line & Hamstring Accent -->
    <path d="M 255 82 A 28 28 0 0 0 238 52" fill="none" stroke="#C25E3E" stroke-width="1.8" stroke-dasharray="3 2"/>
    <path d="M 218 80 Q 232 78 238 68" fill="none" stroke="#C25E3E" stroke-width="2.2" stroke-linecap="round"/>
  </g>
</svg>