<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 150" width="100%" height="100%">
  <line x1="150" y1="15" x2="150" y2="135" stroke="#E4E4E7" stroke-dasharray="3 3" />
  <text x="75" y="142" text-anchor="middle" font-size="10" font-family="system-ui, sans-serif" font-weight="600" fill="#71717A">START</text>
  <text x="225" y="142" text-anchor="middle" font-size="10" font-family="system-ui, sans-serif" font-weight="600" fill="#71717A">MID</text>
  <!-- START -->
  <g>
    <!-- Bench -->
    <line x1="35" y1="90" x2="115" y2="90" stroke="#71717A" stroke-width="3" stroke-linecap="round" />
    <line x1="45" y1="90" x2="45" y2="125" stroke="#71717A" stroke-width="2" />
    <line x1="105" y1="90" x2="105" y2="125" stroke="#71717A" stroke-width="2" />
    <!-- Person lying -->
    <circle cx="45" cy="84" r="6" fill="#18181B" />
    <line x1="51" y1="84" x2="90" y2="84" stroke="#18181B" stroke-width="2.5" stroke-linecap="round" />
    <path d="M90,84 L102,90 L102,118" stroke="#18181B" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" fill="none" />
    <!-- Arms extended straight up -->
    <path d="M65,84 L65,58 L65,36" stroke="#18181B" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" fill="none" />
    <!-- Bar -->
    <line x1="50" y1="36" x2="80" y2="36" stroke="#52525B" stroke-width="2.5" stroke-linecap="round" />
    <rect x="47" y="30" width="3" height="12" rx="1" fill="#52525B" />
    <rect x="80" y="30" width="3" height="12" rx="1" fill="#52525B" />
  </g>
  <!-- MID -->
  <g>
    <!-- Bench -->
    <line x1="185" y1="90" x2="265" y2="90" stroke="#71717A" stroke-width="3" stroke-linecap="round" />
    <line x1="195" y1="90" x2="195" y2="125" stroke="#71717A" stroke-width="2" />
    <line x1="255" y1="90" x2="255" y2="125" stroke="#71717A" stroke-width="2" />
    <!-- Person lying -->
    <circle cx="195" cy="84" r="6" fill="#18181B" />
    <line x1="201" y1="84" x2="240" y2="84" stroke="#18181B" stroke-width="2.5" stroke-linecap="round" />
    <path d="M240,84 L252,90 L252,118" stroke="#18181B" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" fill="none" />
    <!-- Upper arm vertical, forearm bent back to forehead -->
    <path d="M215,84 L215,58 L196,72" stroke="#18181B" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" fill="none" />
    <!-- Bar at forehead -->
    <line x1="181" y1="72" x2="211" y2="72" stroke="#52525B" stroke-width="2.5" stroke-linecap="round" />
    <rect x="178" y="66" width="3" height="12" rx="1" fill="#52525B" />
    <rect x="211" y="66" width="3" height="12" rx="1" fill="#52525B" />
    <path d="M222,44 A18,18 0 0,1 202,68" stroke="#C25E3E" stroke-width="1.5" stroke-dasharray="2 2" fill="none" />
    <polygon points="204,71 197,71 200,65" fill="#C25E3E" />
  </g>
</svg>