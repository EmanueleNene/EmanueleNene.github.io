    <path d="M 68 52 L 50 70 L 68 75" stroke="#18181B" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" fill="none" />
    <path d="M 68 38 L 68 20" stroke="#C25E3E" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" fill="none" marker-end="url(#arrow)" />
    <text x="75" y="142" text-anchor="middle" font-size="10" font-family="system-ui, sans-serif" font-weight="600" fill="#71717A">START</text>
  </g>

