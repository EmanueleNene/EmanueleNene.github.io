      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#C25E3E" />
    </marker>
  </defs>
  <!-- Divider -->
  <line x1="150" y1="15" x2="150" y2="135" stroke="#E4E4E7" stroke-dasharray="3 3" />

  <!-- Left Frame: START -->
  <g id="start-frame">
    <line x1="25" y1="75" x2="125" y2="75" stroke="#52525B" stroke-width="3.5" stroke-linecap="round" />
    <line x1="35" y1="75" x2="35" y2="125" stroke="#71717A" stroke-width="2" stroke-linecap="round" />
