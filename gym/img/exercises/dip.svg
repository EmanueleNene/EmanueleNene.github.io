    <line x1="218" y1="35" x2="218" y2="75" stroke="#18181B" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" />
<circle cx="218" cy="45" r="4" fill="#C25E3E" opacity="0.6" />
