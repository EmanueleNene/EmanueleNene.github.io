<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 150" width="100%" height="100%">
  <!-- Divider -->
  <line x1="150" y1="15" x2="150" y2="135" stroke="#E4E4E7" stroke-dasharray="3 3" />
  
  <!-- Labels -->
  <text x="75" y="142" text-anchor="middle" font-size="10" font-family="system-ui, sans-serif" font-weight="600" fill="#71717A">START</text>
  <text x="225" y="142" text-anchor="middle" font-size="10" font-family="system-ui, sans-serif" font-weight="600" fill="#71717A">MID</text>

  <!-- Ground line -->
  <line x1="20" y1="125" x2="130" y2="125" stroke="#E4E4E7" stroke-width="1.5" stroke-dasharray="2 2"/>
  <line x1="170" y1="125" x2="280" y2="125" stroke="#E4E4E7" stroke-width="1.5" stroke-dasharray="2 2"/>

  <!-- START -->
  <g>
    <!-- Plyo Box -->
    <rect x="80" y="85" width="40" height="40" rx="2" fill="none" stroke="#71717A" stroke-width="2"/>
    <!-- Head -->
    <circle cx="55" cy="35" r="6" fill="#18181B"/>
    <!-- Torso -->
    <path d="M 55 41 L 55 78" fill="none" stroke="#18181B" stroke-width="2.8" stroke-linecap="round"/>
    <!-- Ground Leg -->
    <path d="M 55 78 L 55 125" fill="none" stroke="#18181B" stroke-width="2.8" stroke-linecap="round"/>
    <!-- Raised Foot on Box -->
    <path d="M 55 78 L 74 78 L 88 85" fill="none" stroke="#18181B" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M 88 85 L 96 85" fill="none" stroke="#18181B" stroke-width="2.8" stroke-linecap="round"/>
  </g>

  <!-- MID -->
  <g>
    <!-- Plyo Box -->
    <rect x="230" y="85" width="40" height="40" rx="2" fill="none" stroke="#71717A" stroke-width="2"/>
    <!-- Head high up -->
    <circle cx="250" cy="18" r="6" fill="#18181B"/>
    <!-- Torso tall -->
    <path d="M 250 24 L 250 58" fill="none" stroke="#18181B" stroke-width="2.8" stroke-linecap="round"/>
    <!-- Legs standing fully on box -->
    <path d="M 250 58 L 250 85" fill="none" stroke="#18181B" stroke-width="2.8" stroke-linecap="round"/>
    <path d="M 250 85 L 258 85" fill="none" stroke="#18181B" stroke-width="2.8" stroke-linecap="round"/>
    <!-- Arms -->
    <path d="M 250 32 L 250 54" fill="none" stroke="#18181B" stroke-width="2.2" stroke-linecap="round"/>
    <!-- Upward Step Motion Arrow -->
    <path d="M 215 75 L 215 45 M 211 50 L 215 44 L 219 50" fill="none" stroke="#C25E3E" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>
