<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 150" width="100%" height="100%">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#C25E3E" />
    </marker>
  </defs>
  <!-- Divider -->
  <line x1="150" y1="15" x2="150" y2="135" stroke="#E4E4E7" stroke-dasharray="3 3" />

  <!-- Left Frame: START -->
  <g id="start-frame">
    <rect x="35" y="50" width="6" height="45" rx="1" fill="#52525B" />
    <rect x="35" y="95" width="25" height="5" rx="1" fill="#52525B" />
    <line x1="35" y1="100" x2="35" y2="125" stroke="#71717A" stroke-width="2" stroke-linecap="round" />
    <line x1="60" y1="100" x2="60" y2="125" stroke="#71717A" stroke-width="2" stroke-linecap="round" />
    <circle cx="45" cy="42" r="6.5" fill="#18181B" />
    <line x1="45" y1="49" x2="45" y2="95" stroke="#18181B" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" />
    <path d="M 45 95 L 65 95 L 65 125" stroke="#18181B" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" fill="none" />
    <path d="M 45 60 L 38 72 L 58 72" stroke="#18181B" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" fill="none" />
    <line x1="58" y1="45" x2="58" y2="85" stroke="#52525B" stroke-width="2.5" stroke-linecap="round" />
    <path d="M 62 72 L 85 72" stroke="#C25E3E" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" fill="none" marker-end="url(#arrow)" />
    <text x="75" y="142" text-anchor="middle" font-size="10" font-family="system-ui, sans-serif" font-weight="600" fill="#71717A">START</text>
  </g>

  <!-- Right Frame: MID -->
  <g id="mid-frame">
    <rect x="185" y="50" width="6" height="45" rx="1" fill="#52525B" />
    <rect x="185" y="95" width="25" height="5" rx="1" fill="#52525B" />
    <line x1="185" y1="100" x2="185" y2="125" stroke="#71717A" stroke-width="2" stroke-linecap="round" />
    <line x1="210" y1="100" x2="210" y2="125" stroke="#71717A" stroke-width="2" stroke-linecap="round" />
    <circle cx="195" cy="42" r="6.5" fill="#18181B" />
    <line x1="195" y1="49" x2="195" y2="95" stroke="#18181B" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" />
    <path d="M 195 95 L 215 95 L 215 125" stroke="#18181B" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" fill="none" />
    <line x1="195" y1="60" x2="238" y2="60" stroke="#18181B" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" />
    <line x1="238" y1="45" x2="238" y2="85" stroke="#52525B" stroke-width="2.5" stroke-linecap="round" />
<circle cx="208" cy="60" r="4" fill="#C25E3E" opacity="0.6" />
    <text x="225" y="142" text-anchor="middle" font-size="10" font-family="system-ui, sans-serif" font-weight="600" fill="#71717A">MID</text>
  </g>
