<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 150" width="100%" height="100%">
  <!-- Divider -->
  <line x1="150" y1="15" x2="150" y2="135" stroke="#E4E4E7" stroke-dasharray="3 3" />
  
  <!-- Labels -->
  <text x="75" y="142" text-anchor="middle" font-size="10" font-family="system-ui, sans-serif" font-weight="600" fill="#71717A">START</text>
  <text x="225" y="142" text-anchor="middle" font-size="10" font-family="system-ui, sans-serif" font-weight="600" fill="#71717A">MID</text>

  <!-- START -->
  <g>
    <!-- Incline Machine Frame & Footplate -->
    <line x1="30" y1="120" x2="95" y2="40" stroke="#71717A" stroke-width="3" stroke-linecap="round"/>
    <line x1="85" y1="110" x2="110" y2="125" stroke="#52525B" stroke-width="4" stroke-linecap="round"/>
    <!-- Sled Pad -->
    <line x1="55" y1="62" x2="78" y2="90" stroke="#52525B" stroke-width="6" stroke-linecap="round"/>
    <!-- Head -->
    <circle cx="48" cy="48" r="6" fill="#18181B"/>
    <!-- Torso on pad -->
    <path d="M 54 58 L 74 83" fill="none" stroke="#18181B" stroke-width="2.8" stroke-linecap="round"/>
    <!-- Legs extended -->
    <path d="M 74 83 L 90 98 L 98 116" fill="none" stroke="#18181B" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- Arms holding handles -->
    <path d="M 56 62 L 48 68 L 52 58" fill="none" stroke="#18181B" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- MID -->
  <g>
    <!-- Incline Machine Frame & Footplate -->
    <line x1="180" y1="120" x2="245" y2="40" stroke="#71717A" stroke-width="3" stroke-linecap="round"/>
    <line x1="235" y1="110" x2="260" y2="125" stroke="#52525B" stroke-width="4" stroke-linecap="round"/>
    <!-- Sled Pad slid down -->
    <line x1="190" y1="80" x2="213" y2="108" stroke="#52525B" stroke-width="6" stroke-linecap="round"/>
    <!-- Head -->
    <circle cx="183" cy="66" r="6" fill="#18181B"/>
    <!-- Torso -->
    <path d="M 189 76 L 209 101" fill="none" stroke="#18181B" stroke-width="2.8" stroke-linecap="round"/>
    <!-- Deep Knee Flexion -->
    <path d="M 209 101 L 242 108 L 248 116" fill="none" stroke="#18181B" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- Arms -->
    <path d="M 191 80 L 183 86 L 187 76" fill="none" stroke="#18181B" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- Quad Accent & Push Arrow -->
    <path d="M 212 103 Q 228 98 239 107" fill="none" stroke="#C25E3E" stroke-width="2.2" stroke-linecap="round"/>
    <path d="M 220 80 L 232 65 M 224 67 L 233 64 L 231 74" fill="none" stroke="#C25E3E" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>