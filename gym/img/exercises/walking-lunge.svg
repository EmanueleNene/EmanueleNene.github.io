<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 150" width="100%" height="100%">
  <!-- Divider -->
  <line x1="150" y1="15" x2="150" y2="135" stroke="#E4E4E7" stroke-dasharray="3 3" />
  
  <!-- Labels -->
  <text x="75" y="142" text-anchor="middle" font-size="10" font-family="system-ui, sans-serif" font-weight="600" fill="#71717A">START</text>
  <text x="225" y="142" text-anchor="middle" font-size="10" font-family="system-ui, sans-serif" font-weight="600" fill="#71717A">MID</text>

  <!-- Ground line -->
  <line x1="20" y1="125" x2="130" y2="125" stroke="#E4E4E7" stroke-width="1.5" stroke-dasharray="2 2"/>
  <line x1="170" y1="125" x2="280" y2="125" stroke="#E4E4E7" stroke-width="1.5" stroke-dasharray="2 2"/>

  <!-- START -->
  <g>
    <!-- Head -->
    <circle cx="75" cy="28" r="6" fill="#18181B"/>
    <!-- Torso -->
    <path d="M 75 34 L 75 75" fill="none" stroke="#18181B" stroke-width="2.8" stroke-linecap="round"/>
    <!-- Feet standing together -->
    <path d="M 75 75 L 75 125" fill="none" stroke="#18181B" stroke-width="2.8" stroke-linecap="round"/>
    <path d="M 75 125 L 83 125" fill="none" stroke="#18181B" stroke-width="2.8" stroke-linecap="round"/>
    <!-- Arms holding DBs -->
    <path d="M 75 44 L 75 72" fill="none" stroke="#18181B" stroke-width="2.2" stroke-linecap="round"/>
    <line x1="71" y1="72" x2="79" y2="72" stroke="#52525B" stroke-width="3" stroke-linecap="round"/>
  </g>

  <!-- MID -->
  <g>
    <!-- Head -->
    <circle cx="218" cy="46" r="6" fill="#18181B"/>
    <!-- Torso upright -->
    <path d="M 218 52 L 218 88" fill="none" stroke="#18181B" stroke-width="2.8" stroke-linecap="round"/>
    <!-- Front Leg stepped forward -->
    <path d="M 218 88 L 248 98 L 248 125" fill="none" stroke="#18181B" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M 248 125 L 256 125" fill="none" stroke="#18181B" stroke-width="2.8" stroke-linecap="round"/>
    <!-- Back Leg knee near floor -->
    <path d="M 218 88 L 196 112 L 184 125" fill="none" stroke="#18181B" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- Arms -->
    <path d="M 218 60 L 218 85" fill="none" stroke="#18181B" stroke-width="2.2" stroke-linecap="round"/>
    <line x1="214" y1="85" x2="222" y2="85" stroke="#52525B" stroke-width="3" stroke-linecap="round"/>
    <!-- Forward Step Motion Arrow & Quad Accent -->
    <path d="M 220 90 Q 235 88 246 97" fill="none" stroke="#C25E3E" stroke-width="2.2" stroke-linecap="round"/>
    <path d="M 258 105 L 272 105 M 267 101 L 273 105 L 267 109" fill="none" stroke="#C25E3E" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>
