<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 150" width="100%" height="100%">
  <defs>
    <marker id="arrow" viewBox="0 0 6 6" refX="5" refY="3" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 6 3 L 0 6 Z" fill="#C25E3E" />
    </marker>
  </defs>
  <!-- Divider -->
  <line x1="150" y1="15" x2="150" y2="135" stroke="#E4E4E7" stroke-dasharray="3 3" />
  <!-- Labels -->
  <text x="75" y="142" text-anchor="middle" font-size="10" font-family="system-ui, sans-serif" font-weight="600" fill="#71717A">START</text>
  <text x="225" y="142" text-anchor="middle" font-size="10" font-family="system-ui, sans-serif" font-weight="600" fill="#71717A">MID</text>

  <!-- START -->
  <line x1="20" y1="110" x2="130" y2="110" stroke="#E4E4E7" stroke-width="1.5" />
  <!-- Flat back -->
  <line x1="48" y1="102" x2="82" y2="102" stroke="#18181B" stroke-width="2.8" stroke-linecap="round" />
  <circle cx="32" cy="102" r="6" fill="#18181B" />
  <!-- Both arms up -->
  <line x1="48" y1="102" x2="48" y2="62" stroke="#18181B" stroke-width="2.5" stroke-linecap="round" />
  <!-- Tabletop legs -->
  <path d="M 82 102 L 82 72 L 106 72" fill="none" stroke="#18181B" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round" />
  <path d="M 44 65 L 34 85" fill="none" stroke="#C25E3E" stroke-width="1.5" marker-end="url(#arrow)" />
  <path d="M 98 75 L 115 95" fill="none" stroke="#C25E3E" stroke-width="1.5" marker-end="url(#arrow)" />

  <!-- MID -->
  <line x1="170" y1="110" x2="280" y2="110" stroke="#E4E4E7" stroke-width="1.5" />
  <line x1="198" y1="102" x2="232" y2="102" stroke="#18181B" stroke-width="2.8" stroke-linecap="round" />
  <circle cx="182" cy="102" r="6" fill="#18181B" />
  <!-- One arm up, one back -->
  <line x1="198" y1="102" x2="198" y2="62" stroke="#18181B" stroke-width="2.5" stroke-linecap="round" />
  <line x1="198" y1="102" x2="162" y2="102" stroke="#18181B" stroke-width="2.5" stroke-linecap="round" />
  <!-- One leg tabletop, one extended -->
  <path d="M 232 102 L 232 72 L 256 72" fill="none" stroke="#18181B" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round" />
  <line x1="232" y1="102" x2="276" y2="98" stroke="#18181B" stroke-width="2.8" stroke-linecap="round" />
  <line x1="200" y1="104" x2="230" y2="104" stroke="#C25E3E" stroke-width="2" stroke-linecap="round" />
</svg>
