<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 150" width="100%" height="100%">
  <defs>
    <marker id="arrow" viewBox="0 0 6 6" refX="5" refY="3" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 6 3 L 0 6 Z" fill="#C25E3E" />
    </marker>
  </defs>
  <!-- Divider -->
  <line x1="150" y1="15" x2="150" y2="135" stroke="#E4E4E7" stroke-dasharray="3 3" />
  <!-- Labels -->
  <text x="75" y="142" text-anchor="middle" font-size="10" font-family="system-ui, sans-serif" font-weight="600" fill="#71717A">START</text>
  <text x="225" y="142" text-anchor="middle" font-size="10" font-family="system-ui, sans-serif" font-weight="600" fill="#71717A">MID</text>

  <!-- START -->
  <line x1="25" y1="122" x2="125" y2="122" stroke="#E4E4E7" stroke-width="1.5" />
  <!-- Pivot and Bar -->
  <circle cx="20" cy="118" r="4" fill="#71717A" />
  <line x1="20" y1="118" x2="90" y2="100" stroke="#71717A" stroke-width="3" />
  <circle cx="85" cy="101" r="10" fill="none" stroke="#52525B" stroke-width="2.5" />
  <!-- Lifter -->
  <path d="M 68 122 L 64 98 L 52 74 L 78 58" fill="none" stroke="#18181B" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round" />
  <line x1="78" y1="58" x2="80" y2="102" stroke="#18181B" stroke-width="2.8" stroke-linecap="round" />
  <circle cx="85" cy="52" r="6" fill="#18181B" />
  <path d="M 88 95 L 80 75" fill="none" stroke="#C25E3E" stroke-width="1.5" marker-end="url(#arrow)" />

  <!-- MID -->
  <line x1="175" y1="122" x2="275" y2="122" stroke="#E4E4E7" stroke-width="1.5" />
  <circle cx="170" cy="118" r="4" fill="#71717A" />
  <line x1="170" y1="118" x2="242" y2="70" stroke="#71717A" stroke-width="3" />
  <circle cx="237" cy="71" r="10" fill="none" stroke="#52525B" stroke-width="2.5" />
  <path d="M 218 122 L 214 98 L 202 74 L 228 58" fill="none" stroke="#18181B" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round" />
  <path d="M 228 58 L 214 52 L 230 72" fill="none" stroke="#18181B" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round" />
  <circle cx="235" cy="52" r="6" fill="#18181B" />
  <path d="M 206 60 Q 212 66 206 72" fill="none" stroke="#C25E3E" stroke-width="2" stroke-linecap="round" />
</svg>
