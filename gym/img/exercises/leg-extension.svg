<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 150" width="100%" height="100%">
  <!-- Divider -->
  <line x1="150" y1="15" x2="150" y2="135" stroke="#E4E4E7" stroke-dasharray="3 3" />
  
  <!-- Labels -->
  <text x="75" y="142" text-anchor="middle" font-size="10" font-family="system-ui, sans-serif" font-weight="600" fill="#71717A">START</text>
  <text x="225" y="142" text-anchor="middle" font-size="10" font-family="system-ui, sans-serif" font-weight="600" fill="#71717A">MID</text>

  <!-- START -->
  <g>
    <!-- Machine Frame Seat -->
    <line x1="45" y1="50" x2="55" y2="85" stroke="#71717A" stroke-width="4" stroke-linecap="round"/>
    <line x1="55" y1="85" x2="80" y2="85" stroke="#71717A" stroke-width="4" stroke-linecap="round"/>
    <!-- Head -->
    <circle cx="42" cy="38" r="6" fill="#18181B"/>
    <!-- Body -->
    <path d="M 47 44 L 56 82" fill="none" stroke="#18181B" stroke-width="2.8" stroke-linecap="round"/>
    <!-- Leg 90 deg down -->
    <path d="M 56 82 L 80 82 L 80 115" fill="none" stroke="#18181B" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M 80 115 L 88 115" fill="none" stroke="#18181B" stroke-width="2.8" stroke-linecap="round"/>
    <!-- Machine Lever Pad behind shins -->
    <circle cx="83" cy="112" r="4" fill="#52525B"/>
  </g>

  <!-- MID -->
  <g>
    <!-- Machine Frame Seat -->
    <line x1="195" y1="50" x2="205" y2="85" stroke="#71717A" stroke-width="4" stroke-linecap="round"/>
    <line x1="205" y1="85" x2="230" y2="85" stroke="#71717A" stroke-width="4" stroke-linecap="round"/>
    <!-- Head -->
    <circle cx="192" cy="38" r="6" fill="#18181B"/>
    <!-- Body -->
    <path d="M 197 44 L 206 82" fill="none" stroke="#18181B" stroke-width="2.8" stroke-linecap="round"/>
    <!-- Leg fully extended horizontal -->
    <path d="M 206 82 L 260 82" fill="none" stroke="#18181B" stroke-width="2.8" stroke-linecap="round"/>
    <path d="M 260 82 L 260 74" fill="none" stroke="#18181B" stroke-width="2.8" stroke-linecap="round"/>
    <!-- Machine Lever Pad under ankle -->
    <circle cx="258" cy="86" r="4" fill="#52525B"/>
    <!-- Arc Motion Line & Quad Accent -->
    <path d="M 233 110 A 30 30 0 0 1 258 88" fill="none" stroke="#C25E3E" stroke-width="1.8" stroke-dasharray="3 2"/>
    <path d="M 215 80 L 245 80" fill="none" stroke="#C25E3E" stroke-width="2.2" stroke-linecap="round"/>
  </g>
</svg>
