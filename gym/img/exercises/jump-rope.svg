<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 150" width="100%" height="100%">
  <line x1="150" y1="15" x2="150" y2="135" stroke="#E4E4E7" stroke-dasharray="3 3" />
  <text x="75" y="142" text-anchor="middle" font-size="10" font-family="system-ui, sans-serif" font-weight="600" fill="#71717A">START</text>
  <text x="225" y="142" text-anchor="middle" font-size="10" font-family="system-ui, sans-serif" font-weight="600" fill="#71717A">MID</text>
  <!-- START -->
  <g>
    <!-- Person standing -->
    <circle cx="75" cy="38" r="6" fill="#18181B" />
    <line x1="75" y1="44" x2="75" y2="82" stroke="#18181B" stroke-width="2.5" stroke-linecap="round" />
    <path d="M75,82 L70,102 L70,122 M75,82 L80,102 L80,122" stroke="#18181B" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" fill="none" />
    <path d="M75,52 L60,68 M75,52 L90,68" stroke="#18181B" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" fill="none" />
    <!-- Rope under feet -->
    <path d="M58,68 Q75,130 92,68" stroke="#52525B" stroke-width="1.5" fill="none" />
  </g>
  <!-- MID -->
  <g>
    <!-- Person jumped in mid-air -->
    <circle cx="225" cy="24" r="6" fill="#18181B" />
    <line x1="225" y1="30" x2="225" y2="68" stroke="#18181B" stroke-width="2.5" stroke-linecap="round" />
    <path d="M225,68 L218,88 L220,104 M225,68 L232,88 L230,104" stroke="#18181B" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" fill="none" />
    <path d="M225,38 L210,54 M225,38 L240,54" stroke="#18181B" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" fill="none" />
    <!-- Rope overhead -->
    <path d="M208,54 Q225,2 242,54" stroke="#52525B" stroke-width="1.5" fill="none" />
    <!-- Rust jump accent -->
    <path d="M218,114 L218,120 M232,114 L232,120" stroke="#C25E3E" stroke-width="1.5" stroke-linecap="round" />
  </g>
</svg>